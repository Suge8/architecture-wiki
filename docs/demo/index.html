` / `timeout` / `aborted` / `unexpected_response`）。这里没有任何厂商策略，授权地址、回调判定、token 解析都由调用方传入。\n- ChatGPT 域：登录入口 `loginOpenAICodex`（`lib/codex-oauth.ts`）；协议常量、刷新 `refreshCodexTokens`、模型发现 `fetchCodexModels` / `parseCodexModels` / `selectDefaultCodexModel`、JWT 身份解析 `parseCodexTokenMetadata`、脱敏 `redactCodexSecrets` 在 `lib/codex-auth.ts`；落库与读取 `connectOpenAICodex` / `readCodexTokens` / `readFreshCodexTokens` / `refreshCodexModels`（`lib/codex-provider.ts`）；运行时 `createCodexLanguageModel` / `codexProviderOptions`（`lib/codex-runtime.ts`）。\n- xAI 域对称：`loginXaiSub` / `parseXaiManualCode`（`lib/xai-oauth.ts`）、`refreshXaiTokens` / `parseXaiTokenResponse` / 静态模型表 `XAI_MODELS` / 错误映射 `mapXaiError`（`lib/xai-auth.ts`）、`connectXaiSub` / `readXaiTokens` / `readFreshXaiTokens`（`lib/xai-provider.ts`）、`createXaiLanguageModel` / `xaiProviderOptions`（`lib/xai-runtime.ts`）。\n- UI 只依赖 `lib/subscription-login.ts`：`createChatgptAdapter` / `createXaiAdapter` 把两条订阅收敛成同形状的 `SubscriptionVendorAdapter`（login / refresh / signOut / loadDetail），外加文案 `subscriptionCopy`、错误映射 `mapOAuthLoginError`、模型预览 `visibleSubscriptionModels`。\n\n## 数据怎么流\n\n登录时先在本地生成一对校验值（PKCE），拼出授权地址，打开一个新标签页让用户在官方页面上完成同意。扩展同时监听该标签页的导航和更新事件，一旦地址跳到约定的本地回调地址就判定成功，立刻关掉标签页并从地址里取出授权码；用户中途关掉标签页、超时（默认 5 分钟）或主动取消都会明确失败。授权码随后连同 PKCE 校验值换成访问令牌与刷新令牌，令牌里的身份信息（账号 ID、邮箱、套餐、有效期）从 JWT 里解出来补齐。\n\nChatGPT 这条多一步优先尝试：先走扩展自带的身份授权通道，用扩展自身的回调地址、非交互方式静默试一次；OpenAI 若不接受扩展回调（表现为跳到官方错误页或报重定向类错误），再回落到本地回调地址的标签页流程。拿到令牌后还要用它去 ChatGPT 后端问一次\"这个账号能用哪些模型\"，把模型名、上下文窗口、支持的推理档位一并写库，并按优先级选一个默认模型。\n\nxAI 这条没有模型发现接口，模型表写死在代码里；但它允许用户手工把登录码或回调地址粘回来——标签页回调和手工粘贴同时等待，谁先成功用谁，另一条立即取消。\n\n凭据按供应商写进本地数据库，与用户自填的密钥同一张凭据表、不同类型。任务运行时不直接持有令牌：每次发请求前才去读一次凭据，若离过期不足一分钟就先用刷新令牌换新的再写回。写回是一次带条件的事务——只有库里当前凭据仍与读出来那份完全一致（同一访问令牌、刷新令牌、账号、同一更新时间）才允许覆盖，因此并发刷新或期间用户重新登录/登出时，落后的那次写入会失败而不是把新凭据踩掉。刷新失败、未登录或凭据字段残缺都当作\"未登录\"直接报错，不会静默降级成匿名请求。\n\n最终这份凭据被包成一个语言模型对象交给 Agent。与密钥直连的区别在于请求头：密钥方式把密钥交给 SDK 即可，订阅方式则由一层薄壳在每次请求时注入 Bearer 令牌，ChatGPT 还要额外带账号 ID、实验开关、客户端标识和客户端版本——版本或标识过旧，新模型会直接报\"找不到模型\"。这层薄壳同时把错误响应和流式内容里的令牌、账号 ID 脱敏，并在 ChatGPT 发出终止事件后主动关闭流，避免后端不断连导致任务永远等不到结束。\n\n## 改动指南\n\n- 新增第三家订阅时，通用部分只应加到 `lib/oauth-browser.ts`，厂商策略留在各自 `*-oauth.ts` / `*-auth.ts`；UI 侧只需再加一个 `SubscriptionVendorAdapter`（`lib/subscription-login.ts`），不要让组件直接 import 厂商模块。\n- `CODEX_CLIENT_VERSION` 与 `CODEX_ORIGINATOR`（`lib/codex-auth.ts`）不是装饰：版本落后会让新模型在模型发现和推理请求上都不可见，originator 改成自定义值会让部分受限模型返回 404，两者在模型接口和 `createCodexFetch` 里都要保持一致。\n- 令牌写回必须走 `saveRefreshedCodexCredential` / `saveRefreshedXaiCredential`（`lib/provider-config-flow.ts`）的比对事务；绕过它直接 put 会破坏并发刷新保护。判定\"是否需要刷新\"的一分钟提前量在两个 provider 文件里各有一份常量。\n- 任何新增的错误路径都要经过 `mapBrowserError`（`lib/codex-oauth.ts`）或 `mapXaiError`（`lib/xai-auth.ts`）转成本域错误类型，否则 UI 的取消/超时/需交互文案匹配（`mapOAuthLoginError`）会退化成裸英文消息——该匹配依赖 `lib/oauth-browser.ts` 中的原文，改文案要同步。\n- 日志与错误信息一律先过 `redactCodexSecrets`；ChatGPT 流式响应的终止事件处理见 ADR 0012，删掉它会复现任务挂死。\n- 受影响验证：`scripts/test-oauth-browser.ts`、`test-codex-auth.ts`、`test-codex-provider.ts`、`test-codex-runtime.ts`、`test-xai-oauth.ts`、`test-xai-provider.ts`、`test-xai-runtime.ts`、`test-subscription-login.ts`，统一由 `pnpm run test:unit` 驱动。\n",
    "modules/ui-kit.md": "---\nsources:\n  - components.json 3fb05cb9257a shadcn-svelte.com/schema.json entrypoints/sidepanel/app.css\n  - lib/utils.ts ee339984defd cn WithoutChildrenOrChild WithElementRef\n  - lib/components/ai-elements/response/markdown.ts 372185f41c01 normalizeAssistantMarkdown readFenceMarker\n  - lib/components/ai-elements/tool/tool-header.svelte ffb4b5e38929\n  - lib/components/ai-elements/prompt-input/core/root.svelte 54b0735d5f3c\n  - lib/components/ai-elements/conversation/stick-to-bottom-context.svelte.ts ff3ae9e73601\ncovers:\n  - lib/components/\n  - lib/utils.ts\n  - components.json\n---\n\n# 界面组件库\n\n## 职责\n\n侧边栏用到的所有通用界面零件都放在这里：按钮、对话框、下拉菜单、折叠面板这类基础控件，以及为对话场景准备的成套组件——消息气泡、会话滚动区、输入框连同附件管理、工具调用的可折叠卡片、把模型输出的 Markdown 渲染成正文的组件。\n\n这一层只管\"长什么样、怎么交互\"，不知道 Agent、任务和数据库的存在。所有业务判断都在调用它的界面里完成，组件只接收已经算好的数据并把用户动作抛回去。基础控件是从 shadcn-svelte 注册表安装到本仓库的源码副本，不是运行时依赖，因此可以按需改造，升级也不会被覆盖。\n\n唯一带业务味道的例外是模型输出的排版修正：模型（尤其中英混排时）经常把列表项挤成一行、把粗体标题和前文黏在一起，渲染前会先把这类畸形还原成正常的 Markdown 结构，代码块内容原样保留。\n\n## 对外接口\n\n三组入口，界面代码只从这三处取用：\n\n- 基础控件 `lib/components/ui/<name>/index.ts`，每个目录导出一组同族组件（按 shadcn-svelte 的约定命名，如 `dialog` 导出 Root/Trigger/Content/Header 等）。\n- 对话组件 `lib/components/ai-elements/<域>/index.ts`，域包括 `conversation`（滚动容器与置底跟随，状态在 `stick-to-bottom-context.svelte.ts`）、`message`（消息体、附件、操作条、分支切换）、`prompt-input`（输入框、附件、动作菜单，状态在 `context/*.svelte.ts`，装配入口 `core/root.svelte`）、`tool`（工具卡片头/输入/输出）、`response`（`normalizeAssistantMarkdown` + 渲染组件）。\n- 工具函数 `lib/utils.ts`：类名合并 `cn`，以及去掉插槽属性的类型工具 `WithoutChildrenOrChild`、带 ref 的 `WithElementRef`。\n\n`components.json` 声明了 shadcn-svelte CLI 的安装约定：样式基线 `nova`/`stone`、CSS 落点 `entrypoints/sidepanel/app.css`、别名 `$lib/components`。新增组件应通过 CLI 安装到这些路径，而不是手写。\n\n## 数据怎么流\n\n数据是单向的：调用方把已经算好的展示数据传进组件，组件只负责呈现，用户的点击、输入、选择通过回调原样抛回调用方，组件自身不写数据库、不发消息。\n\n组件之间的共享状态只在一棵组件树内部流动——输入框和它的附件区、会话容器和它的置底按钮，靠上下文对象连接，不跨越组件库边界。因此这一层没有任何持久化，刷新即重来。\n\n## 改动指南\n\n- 新增基础控件用 shadcn-svelte CLI 按 `components.json` 安装，不要手建目录；改动已安装组件直接改本地源码即可，属于预期用法。\n- 想在组件里读会话、事件或数据库是走错层了：把数据在调用方（`entrypoints/sidepanel/`）算好再传进来。\n- 模型输出排版异常（列表粘连、粗体前缺空格）改 `normalizeAssistantMarkdown`（`lib/components/ai-elements/response/markdown.ts`）；注意它按代码围栏分段，围栏内文本必须原样透传，改正则时先确认 `readFenceMarker` 的分段行为。\n- `lib/components/ui/dialog/index.ts` 与 `dialog-content.svelte` 之间存在再导出环，这是 shadcn 生成代码的固有形态，Vite 能处理，不必\"修复\"。\n- 这里只保留侧边栏真正在用的组件：装了没用的 badge、card、sheet、scroll-area 与剪贴板 hook 已删除，需要时用 CLI 重新安装即可，不要为“以后可能用”预留空目录。当前健康状况见[体检报告](../health.md)。\n",
    "system.md": "---\nsources:\n  - wxt.config.ts 0679a4e99991 offscreen sidePanel userScripts optional_host_permissions sandbox\n  - entrypoints/background.ts 75acddbc8303 handleTaberMessage isPrivilegedMessageType startTask\n  - entrypoints/offscreen/main.ts b1baf380f71c runAgentTask createConfiguredRuntime ToolLoopAgent\n  - entrypoints/sidepanel/App.svelte c61f97285c00 handleStart handleStop appendLiveEvent\n  - lib/agent-tools.ts 40485c8780d3 createAgentTools AGENT_TOOL_SCHEMA_VERSION\n  - lib/db.ts 5e8b63382cda TaberDatabase database appendAgentEvent readSessionSnapshot\n  - lib/chrome-api-broker.ts 7ecf75f3075b createChromeApiBroker isTrustedChromeApiSender\n  - lib/agent-event-projection.ts 1f68d156756e projectAgentEvents\n---\n\n# 系统总览\n\nTaber 是一个浏览器侧边栏 Agent：用户用一句话交代任务，它自己读页面、点按钮、填表单、跨标签导航、产出文件，全过程在侧边栏可见、可随时停止。它是一个 Chrome/Edge 扩展，没有服务端，所有数据留在本机；唯一的外部调用是用户自己配置的模型服务。\n\n## 五个进程边界\n\n扩展被浏览器切成几个互相隔离的运行环境，Taber 的模块划分基本沿着这些边界走：\n\n**侧边栏**是用户界面所在的页面，负责收集意图和展示过程。它没有浏览器特权，也不保存任务状态——所有画面都是把本地事件日志重放一遍算出来的，所以关掉再开、换个窗口开，看到的都是同一份事实。详见[监督侧边栏](modules/sidepanel.md)与[设置与登录界面](modules/settings-ui.md)。\n\n**AgentHost** 是一个隐藏的扩展页面，任务真正在这里跑：装配模型、循环调用工具、把每一步写进日志。它有任务才被创建，任务结束两分钟后自动关闭。详见 [AgentHost 任务主循环](modules/agent-host.md)。\n\n**后台**是整个扩展里唯一持有浏览器特权的地方。侧边栏和 AgentHost 都不能直接动标签页或注入脚本，只能发消息请它代劳；它同时校验消息来源、校验目标标签页仍是这次任务锁定的那一个，并管理 AgentHost 的生老病死。详见[后台代理与扩展生命周期](modules/background-broker.md)。\n\n**页面世界**是被操作的网页本身。Taber 往里注入一组固定的操作助手，读文本、点元素、填表、等待变化都发生在这里；模型写的代码则跑在一个没有任何权限的空白沙箱页里，只能通过消息请助手代劳。详见[浏览器 REPL 执行链](modules/browser-repl.md)。\n\n**本地数据库**是唯一的持久层：供应商配置、凭据、会话、事件日志、工具记录、站点技能、工作区文件全在一处。详见[本地 Agent 数据库](modules/database.md)。\n\n## 能力域\n\n模型能做的事被固定成六件（调试构建多一件），边界刻意分得很开：读内容、取图、跨标签导航、结构化页面操作、代码兜底、读写文件与技能。工具的注册、参数收敛、串行执行与审计集中在[顶层工具集与页面操作](modules/agent-tools.md)；把网页、远程链接、PDF 和上传文件变成模型可读文本的能力在[文档与视觉提取](modules/document-extraction.md)；把三类本地数据伪装成一棵文件树、并让 Agent 沉淀站点经验的能力在[文件工作区与站点技能](modules/skills-workspace.md)。\n\n模型接入分两条路：用户自填密钥的 OpenAI 兼容服务，以及用已有 ChatGPT / xAI 订阅登录。两条路最终汇合成同一份供应商与模型记录，任务侧感知不到差别——见[模型供应商配置](modules/provider-config.md)与[官方订阅登录与运行时](modules/subscription-auth.md)。\n\n贯穿全系统的是事件日志：AgentHost 只管往里追加，侧边栏、模型上下文和会话导出都只读它的投影，没有第二份状态。这条约定的实现在 [Agent 事件日志与投影](modules/event-log.md)。\n\n界面零件（基础控件与对话组件）集中在[界面组件库](modules/ui-kit.md)；构建、验证链与诊断脚本见[构建与验证工具链](modules/build-verify.md)；对外的产品站点是独立子项目，见[营销落地页](modules/landing.md)。\n\n## 立起来的几条硬约束\n\n同一时间只跑一个任务，全局唯一。任务启动时锁定一个目标标签页，此后用户自己切标签不改变目标，只有导航工具或侧边栏确认能改；目标标签被关掉，任务明确失败，不会悄悄换一个页面继续。\n\n事件日志写不进去就停机。动作可能已经生效却没有记录，比停下来危险得多，所以日志写入失败被当成致命错误终止任务。\n\n权限按需而非预支。上架版本只申请必要权限，对任意站点的访问是可选权限，由用户在需要时授权；能直接驱动浏览器底层协议的调试能力只存在于本地调试构建里，发布包连权限都不申请。\n\n个人资料默认不可见，只有用户在某次任务上显式勾选授权，这一次任务才读得到，且读到的内容不会落进事件日志。\n\n具体运行路径见[端到端数据流](data-flow.md)，代码健康状况见[体检报告](health.md)。\n"

   死文件/死导出按每百源文件密度扣分（大小仓库同尺）；循环与断裂按绝对条数扣（应恒为零）；疑似未确认，低权。
   分级：≥90 健康（绿），75–89 尚可（金），60–74 亚健康（橙），<60 高危（红）。 */
const HEALTH_GRADES = [[90, "健康", "var(--accent)"], [75, "尚可", "#B08F4C"], [60, "亚健康", "#C9704A"], [0, "高危", "var(--warn)"]];
function healthScore() {
  const h = DATA.health;
  if (!h) return null;
  const n = h.files || 100;
  const cuts = [
    [Math.min(25, (h.dead ?? 0) / n * 500), `清理 ${h.dead} 个死文件`],
    [Math.min(15, (h.deadExports ?? 0) / n * 8), `删除 ${h.deadExports} 个未用导出`],
    [Math.min(25, (h.cycles ?? 0) * 6), `拆开 ${h.cycles} 条循环依赖`],
    [Math.min(25, (h.breaks ?? 0) * 8), `修复 ${h.breaks} 处断裂引用`],
    [Math.min(5, (h.suspects ?? 0) * .5), `逐一确认 ${h.suspects} 个疑似死文件`],
  ];
  const score = Math.max(0, Math.round(100 - cuts.reduce((s, [c]) => s + c, 0)));
  const [, grade, color] = HEALTH_GRADES.find(([t]) => score >= t);
  return { score, grade, color, cuts };
}

const statRow = pairs => `<div class="statrow">` +
  pairs.map(([v, k]) => `<span class="sv">${v}<em>${k}</em></span>`).join("") + `</div>`;
function coversOf(pageRef) {
  const m = (WIKI[(pageRef || "").split("#")[0]] || "").match(/^---\n([\s\S]*?)\n---/);

    const it = l.match(/^\s+-\s+(.+?)\s*$/);   // 与 verify 的认领对账同步则：取整行剩余，路径含空格也不会提前截断

  const cross = (DATA.links || []).filter(l => inSet.has(l.from) !== inSet.has(l.to))
    .map(l => { const out = inSet.has(l.from); const other = out ? l.to : l.from;
      return N[other] ? `<span class="chip" data-code="${other}">${out ? "→" : "←"} ${N[other].short || N[other].name}${l.label ? " · " + l.label : ""}</span>` : ""; })
    .filter(Boolean);
  const scen = FLOWS.map((f, i) => [f, i])
    .filter(([f]) => f.steps.some(s => inSet.has(s.from) || inSet.has(s.to)))
    .map(([f, i]) => `<span class="chip" data-flow="${i}" data-step="0">${f.title}</span>`);
  const df = districtFiles(id);
  const mods = codes.filter(c => N[c].form !== "external").length;
  return head +
    (df.length ? statRow([[mods, "个模块"], [df.length, "个文件"], fmtLines(linesOf(df))])
      : `<p class="dimtext">本区是仓库之外的系统，不含本仓库代码。</p>`) +
    `<h3>包含模块</h3>` + moduleRows(codes) +
    `<h3>跨区往来 · ${cross.length}</h3>` + chips(cross) +
    `<h3>参与场景</h3>` + chips(scen);
}
function linkPanel(i) {
  const l = DATA.links[i];
  return kicker("gateway", "结构关系") + `<h2>${l.label}</h2>
    <p>${l.what || ""}</p><p><code>${N[l.from].name}</code> → <code>${N[l.to].name}</code></p>
    ${srcList([...(N[l.from].sources || []).slice(0, 1), ...(N[l.to].sources || []).slice(0, 1)])}`;
}
/* 同一拍的步骤共用序号、用 a/b/c 区分，一眼看得出哪几步是同时发生的 */
function stepRows(F, curBeat) {
  return beatsOf(F.steps).flatMap((b, k) => b.map((j, m) => {
    const no = b.length > 1 ? `${k + 1}${String.fromCharCode(97 + m)}` : `${k + 1}`;
    const state = curBeat < 0 ? "" : k < curBeat ? "done" : k === curBeat ? "now" : "";
    return `<li class="${state}" data-step="${j}"><span class="no">${no}</span>${F.steps[j].title}</li>`;
  })).join("");
}
function flowPanel(i) {
  const F = FLOWS[activeFlow], beats = beatsOf(F.steps);
  const k = beats.findIndex(b => b.includes(i));
  const cur = beats[k], many = cur.length > 1;
  const head = kicker("play", F.title) +
    `<h2>第 ${k + 1}/${beats.length} ${many ? `拍 · 并行 ${cur.length} 步` : `步 · ${F.steps[cur[0]].title}`}</h2>`;
  const body = cur.map(j => {
    const f = F.steps[j];
    return (many ? `<h3>${f.title}</h3>` : "") +
      `<p>${f.what}</p><p><code>${N[f.from].name}</code> → <code>${N[f.to].name}</code></p>` +
      srcList(f.sources || [...(N[f.from].sources || []).slice(0, 1), ...(N[f.to].sources || []).slice(0, 1)]);
  }).join("");
  return head + body + `<h3>全部步骤</h3><ul class="steps">${stepRows(F, k)}</ul>`;
}
function scrollToAnchor(pageRef) {
  const anchor = pageRef?.split("#")[1];
  if (!anchor) { panel.scrollTop = 0; return; }
  const h = [...panel.querySelectorAll("[data-h]")].find(e => e.dataset.h === anchor);
  if (h) h.scrollIntoView({ block: "start" });
}
function render() {
  panel.innerHTML =
    sel == null ? systemPanel() :
    typeof sel === "number" ? flowPanel(sel) :
    typeof sel === "object" ? (sel.flow != null ? scenarioPanel(sel.flow) : sel.district ? districtPanel(sel.district) : wikiPanel()) :
    sel.startsWith("L") ? linkPanel(+sel.slice(1)) : nodePanel(sel);
  document.querySelectorAll("nav .item").forEach(e => {
    e.classList.toggle("sel", e.dataset.code === sel);
    e.classList.remove("dm");
  });
  panel.querySelectorAll(".steps li").forEach(li =>
    li.addEventListener("click", () => { pauseAuto(); showStep(+li.dataset.step); }));
  panel.querySelectorAll("li.src").forEach(li =>
    li.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(li.dataset.path); } catch {}
      const c = li.querySelector("code"), t = c.textContent;
      c.textContent = "已复制 ✓"; setTimeout(() => c.textContent = t, 900);
    }));
  panel.querySelectorAll(".chip[data-code], li.mod[data-code]").forEach(ch =>
    ch.addEventListener("click", () => select(ch.dataset.code)));
  panel.querySelectorAll("li.mod[data-district]").forEach(li =>
    li.addEventListener("click", () => select({ district: li.dataset.district })));
  panel.querySelectorAll(".chip[data-flow]").forEach(ch =>
    ch.addEventListener("click", () => showScenarioStep(+ch.dataset.flow, +ch.dataset.step)));
  panel.querySelectorAll("[data-hsec]").forEach(ch =>
    ch.addEventListener("click", () => openHealth(ch.dataset.hsec)));
  panel.querySelector(".morebtn")?.addEventListener("click", e => {
    panel.querySelector(".flist.collapsed")?.classList.remove("collapsed");
    e.target.remove();
  });
  panel.querySelectorAll("a.wl").forEach(a =>
    a.addEventListener("click", () => {
      const cur = (sel && typeof sel === "object" && (sel.page || FLOWS[sel.flow]?.page)) ||
        (typeof sel === "string" && !sel.startsWith("L") && N[sel]?.page) || "index.md";
      const target = resolvePage(cur.split("#")[0], a.dataset.href);
      openWikiPage(target, a.dataset.href.split("#")[1]);
    }));
  if (typeof sel === "object" && sel) scrollToAnchor(sel.flow != null ? FLOWS[sel.flow].page : sel.page);
  else if (typeof sel === "string" && !sel.startsWith("L") && tab === "page") scrollToAnchor(N[sel]?.page);
}
const tabsBox = document.querySelector(".tabs");
tabPage.onclick = () => { tab = "page"; tabPage.classList.add("on"); tabRel.classList.remove("on"); segInd(tabsBox); render(); };
tabRel.onclick = () => { tab = "rel"; tabRel.classList.add("on"); tabPage.classList.remove("on"); segInd(tabsBox); render(); };
segInd(tabsBox);
/* 面板拖宽、窗口变化都会改变按钮几何，指示器跟着容器尺寸重测 */
const segRO = new ResizeObserver(() => { segInd(tabsBox); segInd(flowbar); });
segRO.observe(tabsBox);
if (FLOWS.length) segRO.observe(flowbar);

/* ── 聚焦 ── */
function focusSet(set) {
  for (const [c, g] of Object.entries(nodeEls)) g.classList.toggle("dim", !!set && !set.has(c));
  for (const g of gPlate.children) g.classList.toggle("dim", !!set && !set.has(g.dataset.code));
  for (const g of gTag.children) {   // 分区名牌跟随聚焦：区内无亮节点则一同退下
    if (!g.dataset.d) continue;
    g.classList.toggle("dim", !!set && !DATA.nodes.some(n => n.district === g.dataset.d && set.has(n.code)));
  }
  for (const g of [...gLink.children, ...gFlow.children]) {
    const [a, b] = g.dataset.n.split(" ");
    const live = !set || (set.has(a) && set.has(b));
    g.classList.toggle("dim", !live);
    g.classList.toggle("hi", !!set && live);
  }
}
const hood = code => new Set([code, ...(adj[code] || [])]);
function markSel(code) {
  gSel.innerHTML = "";
  if (!code) return;
  const n = N[code];
  el("polygon", { id: "selring", points: P([
    iso(n.x - .35, n.y - .35), iso(n.x + n.w + .35, n.y - .35),
    iso(n.x + n.w + .35, n.y + n.d + .35), iso(n.x - .35, n.y + n.d + .35)]),
    fill: "none", stroke: "var(--accent)", "stroke-width": 2 }, gSel);
}
function hopNode(code) {
  const g = nodeEls[code];
  if (!g) return;
  g.classList.remove("hop"); g.getBBox(); g.classList.add("hop");
  g.addEventListener("animationend", () => g.classList.remove("hop"), { once: true });
}
function baseFocus() {
  if (typeof sel === "string" && !sel.startsWith("L")) return hood(sel);
  if (sel && typeof sel === "object") {
    if (sel.flow != null) return new Set(FLOWS[sel.flow].steps.flatMap(s => [s.from, s.to]));
    if (sel.district) return new Set(districtNodes(sel.district));
  }
  return null;
}
function markDistrict(id) {
  for (const g of gDist.children) g.classList.toggle("sel", g.dataset.d === id);
  for (const e of nav.querySelectorAll(".grp")) e.classList.toggle("sel", e.dataset.d === id);
}
function select(code) {
  stopFlowVisual(); sel = code; hideEdgeTag();
  if (code == null && activeFlow >= 0) { activeFlow = -1; syncFlowbar(); }  // 点空白回总览
  const isNode = typeof code === "string" && !code.startsWith("L");
  buildEdges();
  markSel(isNode ? code : null);
  markDistrict(code && typeof code === "object" ? code.district : null);
  focusSet(baseFocus());
  if (isNode) hopNode(code);
  render();
  // 面板内容淡入仅限点选：hover 预览和播放节拍是高频替换，不进这条路径，不加动画
  if (motionOK) panel.animate({ opacity: [0, 1], translate: ["0 3px", "0 0"] },
    { duration: 160, easing: "cubic-bezier(.16, 1, .3, 1)" });
}
/* 打开 wiki 页时同步地图：模块页→点亮对应楼；场景小节→激活对应路线；跨模块页→不选中。
   面板收起时先展开——内容不能渲染进看不见的地方 */
function openWikiPage(target, anchor) {
  if (target === "health.md") { openHealth(anchor); return; }
  if (document.body.classList.contains("aside-off")) document.getElementById("handleAside").click();
  const ref = target + (anchor ? "#" + anchor : "");
  const fi = FLOWS.findIndex(f => f.page && f.page.split("#")[0] === target &&
    anchor && f.page.split("#")[1] === anchor);
  if (fi >= 0) {
    stopFlowVisual(); activeFlow = fi; syncFlowbar();
    sel = { flow: fi }; markSel(null); buildEdges(stepsOf(fi));
    focusSet(new Set(FLOWS[fi].steps.flatMap(s => [s.from, s.to])));
    render(); return;
  }
  const matches = DATA.nodes.filter(n => (n.page || "").split("#")[0] === target);
  if (matches.length === 1) {
    select(matches[0].code);
    if (anchor) scrollToAnchor(ref);
    return;
  }
  sel = { page: ref }; markSel(null); render();
  let set = null;
  if (matches.length) set = new Set(matches.map(n => n.code));
  else {
    const fs = FLOWS.filter(f => (f.page || "").split("#")[0] === target);
    if (fs.length) set = new Set(fs.flatMap(f => f.steps.flatMap(s => [s.from, s.to])));
  }
  focusSet(set); navDim(set);
}
function navDim(set) {
  document.querySelectorAll("nav .item").forEach(e =>
    e.classList.toggle("dm", !!set && !set.has(e.dataset.code)));
}
function bindNode(g) {
  const code = g.dataset.code;
  g.addEventListener("mouseenter", () => {
    if (typeof sel !== "number") {
      focusSet(hood(code)); buildEdges(stepsFor(code));
      if (sel == null) panel.innerHTML = nodePanel(code);
    }
  });
  g.addEventListener("mouseleave", () => {
    if (typeof sel !== "number") {
      focusSet(baseFocus()); buildEdges();
      if (sel == null) render();
    }
  });
  g.addEventListener("click", e => { e.stopPropagation(); select(code); });
}
Object.values(nodeEls).forEach(bindNode);
[...gPlate.children].forEach(bindNode);

/* ── 流程追踪：按「拍」推进而不是按步——标了 par 的步骤与上一步同时发生 ── */
let auto = null, beatIdx = -1, playPulses = [];
const beatsOf = (steps = []) => steps.reduce((out, s, i) => {
  if (i > 0 && s.par) out[out.length - 1].push(i); else out.push([i]);
  return out;
}, []);
const curBeats = () => beatsOf(FLOWS[activeFlow]?.steps);
function clearPulses() { for (const p of playPulses) p.remove(); playPulses = []; }
function addPulse(pathEl, myBeat) {
  const len = pathEl.getTotalLength(), t0 = performance.now(), dur = motionOK ? 340 : 0;
  const pulse = el("path", { d: pathEl.getAttribute("d"), stroke: "#FFFFFF", "stroke-width": 3,
    fill: "none", "stroke-linecap": "round", opacity: .95,
    "stroke-dasharray": `22 ${(len + 22).toFixed(1)}`, "stroke-dashoffset": 22 }, gTag);
  playPulses.push(pulse);
  (function anim(now) {
    const k = dur ? Math.min((now - t0) / dur, 1) : 1;
    pulse.setAttribute("stroke-dashoffset", (22 - k * (len + 22)).toFixed(1));
    if (k < 1 && beatIdx === myBeat) requestAnimationFrame(anim);
  })(t0);
}
function showBeat(k) {
  const F = FLOWS[activeFlow], beats = beatsOf(F?.steps);
  if (!F || k < 0 || k >= beats.length) return;
  beatIdx = k;
  const now = new Set(beats[k]), done = new Set(beats.slice(0, k).flat());
  sel = beats[k][0]; markSel(null); render();
  flowEls.forEach(({ p, glow }, j) => {
    const isNow = now.has(j);
    p.setAttribute("stroke", isNow ? "var(--accent)" : "var(--ink)");
    p.setAttribute("stroke-width", isNow ? 2.6 : done.has(j) ? 2 : 1.6);
    p.setAttribute("marker-end", isNow ? "url(#arrA)" : "url(#arr)");
    p.setAttribute("opacity", isNow || done.has(j) ? 1 : .35);
    glow.setAttribute("opacity", isNow ? .22 : 0);
  });
  const steps = beats[k].map(j => F.steps[j]);
  focusSet(new Set(steps.flatMap(s => [s.from, s.to])));
  for (const s of steps) hopNode(s.to);
  gStreak.style.display = "none";
  clearPulses();
  for (const j of beats[k]) if (flowEls[j]) addPulse(flowEls[j].p, k);
}
const showStep = i => showBeat(curBeats().findIndex(b => b.includes(i)));
function pauseAuto() { if (auto) clearTimeout(auto); auto = null; }
function stopFlowVisual() {
  pauseAuto(); beatIdx = -1; clearPulses();
  gStreak.style.display = "";
  flowEls.forEach(({ p, glow }) => { p.setAttribute("stroke", "var(--ink)");
    p.setAttribute("stroke-width", 1.6); p.setAttribute("marker-end", "url(#arr)");
    p.setAttribute("opacity", 1); glow.setAttribute("opacity", 0); });
}
document.getElementById("btnPlay").onclick = () => {
  if (activeFlow < 0) { activeFlow = 0; syncFlowbar(); }
  stopFlowVisual(); buildEdges(stepsOf(activeFlow)); showBeat(0);
  const total = curBeats().length;
  const tick = () => {
    if (beatIdx + 1 >= total) { auto = null; return; }
    showBeat(beatIdx + 1);
    auto = setTimeout(tick, motionOK ? 620 : 400);
  };
  auto = setTimeout(tick, motionOK ? 620 : 400);
};
document.getElementById("btnStep").onclick = () => {
  if (activeFlow < 0) { activeFlow = 0; syncFlowbar(); buildEdges(stepsOf(0)); }
  pauseAuto(); showBeat((beatIdx + 1) % (curBeats().length || 1));
};

/* ── 取景 / 平移缩放 / 响应式 ── */
const stage = document.getElementById("stage");
function fitHome() {
  const boxes = [gDist.getBBox(), gNode.getBBox(), gPlate.getBBox(), gTag.getBBox()];
  const x = Math.min(...boxes.map(b => b.x)) - 18, y = Math.min(...boxes.map(b => b.y)) - 16;
  return { x, y,
    w: Math.max(...boxes.map(b => b.x + b.width)) + 18 - x,
    h: Math.max(...boxes.map(b => b.y + b.height)) + 16 - y };
}
const HOME = fitHome();
let vb = { ...HOME }, homeView = true;
const applyVB = () => svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
document.getElementById("btnReset").onclick = () => { stopFlowVisual(); select(null); vbT = null; vb = { ...HOME }; homeView = true; applyVB(); };
new ResizeObserver(() => { if (homeView) applyVB(); }).observe(stage);
let pan = null, moved = false, pinch = null;
const touches = new Map();
stage.addEventListener("pointerdown", e => {
  if (e.target.closest(".b") || e.target.closest(".lk") || e.target.closest("#flowbar")) return;
  if (vbT) { vb = { ...vbT }; vbT = null; applyVB(); }   // 手势接管前先把追赶中的缩放落定
  touches.set(e.pointerId, [e.clientX, e.clientY]);
  stage.setPointerCapture(e.pointerId);
  if (touches.size === 2) {   // 双指捿合：以按下时取景为基准缩放
    const [a, b] = [...touches.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, vb: { ...vb } };
    pan = null; moved = true;
    stage.classList.remove("panning");
    return;
  }
  // 记住起手落在哪块地板：指针捕获后 pointerup/click 的 target 都会被重定向到画布，当场判不出来
  pan = { px: e.clientX, py: e.clientY, x: vb.x, y: vb.y, floor: e.target.closest(".dfloor")?.dataset.d || null };
  moved = false;
  stage.classList.add("panning");
});
stage.addEventListener("pointermove", e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && touches.size >= 2) {
    const [a, b] = [...touches.values()];
    const k = pinch.d / (Math.hypot(a[0] - b[0], a[1] - b[1]) || 1);
    const r = svg.getBoundingClientRect();
    const mx = pinch.vb.x + ((a[0] + b[0]) / 2 - r.left) / r.width * pinch.vb.w;
    const my = pinch.vb.y + ((a[1] + b[1]) / 2 - r.top) / r.height * pinch.vb.h;
    vb = { x: mx - (mx - pinch.vb.x) * k, y: my - (my - pinch.vb.y) * k, w: pinch.vb.w * k, h: pinch.vb.h * k };
    homeView = false; applyVB();
    return;
  }
  if (!pan) return;
  if (Math.hypot(e.clientX - pan.px, e.clientY - pan.py) > 3) moved = true;
  const k = vb.w / stage.clientWidth;
  vb.x = pan.x - (e.clientX - pan.px) * k; vb.y = pan.y - (e.clientY - pan.py) * k;
  if (moved) { homeView = false; applyVB(); }
});
const endPointer = e => {
  touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
};
stage.addEventListener("pointercancel", endPointer);
stage.addEventListener("pointerup", e => {
  endPointer(e);
  const wasPan = pan; pan = null; stage.classList.remove("panning");
  if (e.pointerType !== "mouse") hideEdgeTag();   // 触屏无 mouseleave，气泡会滞留
  // 未拖动的单击：落在地板上选中分区，落在真空白处取消选中
  if (wasPan && !moved) select(wasPan.floor ? { district: wasPan.floor } : null);
});
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY > 0 ? 1.12 : 1 / 1.12;
  const b = vbT || vb;   // 连续滚轮在目标上复利，锚点映射才不漂
  const r = svg.getBoundingClientRect();
  const mx = b.x + (e.clientX - r.left) / r.width * b.w;
  const my = b.y + (e.clientY - r.top) / r.height * b.h;
  const t = { x: mx - (mx - b.x) * k, y: my - (my - b.y) * k, w: b.w * k, h: b.h * k };
  homeView = false;
  if (motionOK) vbT = t; else { vb = t; applyVB(); }
}, { passive: false });

applyVB();
render();
</script>
</body>
</html>
