  main { flex: 1; display: flex; min-height: 0; gap: 10px; padding: 10px 12px 12px; position: relative; }
  /* 把手：贴边半圆，展开时贴面板外缘、收起时贴视口边缘，位置本身带过渡 */
  .handle {
    position: fixed; z-index: 30; top: 50%; transform: translateY(-50%);
    width: 24px; height: 48px; padding: 0;

  /* 展开时向面板方向压 1px 盖住面板边框且不带阴影，半圆与面板融为一体；收起悬浮在屏幕边缘时才需要投影 */

  /* 跨断点是布局模式切换（挤占 ↔ 覆盖），定位机制不同无法平滑，瞬间切换比半吊子动画干净 */

  .gauge circle { fill: none; stroke-width: 8; }
  .gauge .gbg { stroke: color-mix(in srgb, currentColor 16%, transparent); }
  .gauge .gfg { stroke: currentColor; stroke-linecap: round; transition: stroke-dashoffset .7s cubic-bezier(.16, 1, .3, 1); }
  .gscore { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 22px var(--mono); color: var(--ink); }
  .gscore span { font-size: 10px; color: var(--ink-soft); margin: 9px 0 0 1px; }
  .vmeta { flex: 1; min-width: 0; }
  .vgrade { font: 700 15px var(--sans); }
  .vadvice { margin: 2px 0 9px; }
  .vadvice div { font-size: 11px; line-height: 1.6; color: var(--ink-soft); }
  .vadvice b { font-weight: 700; }
  .vstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .vstat { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 5px 3px; text-align: center; cursor: pointer; transition: border-color .15s, scale .16s cubic-bezier(.2, 0, 0, 1); }
  .vstat:hover { border-color: var(--accent); }
  .vstat .vv { font: 700 14px var(--mono); color: var(--ink-soft); }
  .vstat .vv em { font: 600 9.5px var(--sans); font-style: normal; opacity: .85; }
  .vstat .vk { font-size: 10px; color: var(--ink-soft); margin-top: 1px; }
  .hmodal .md-body { font: 12.5px/1.75 var(--sans); }
  .hmodal .md-body h2 { font: 700 13px/1.5 var(--sans); margin: 20px 0 8px; }
  .hmodal .md-body h3 { font: 700 12px var(--sans); margin: 14px 0 6px; }
  .hmodal .md-body p, .hmodal .md-body li { font-size: 12.5px; }
  .hmodal .md-body ul { list-style: disc; padding-left: 18px; margin-bottom: 11px; }
  .hmodal .md-body li { margin: 3px 0; }
  .hmodal .md-body li::marker { color: var(--accent); }
  .hmodal .md-body code { font: 11.5px var(--mono); background: var(--surface); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
  .hmodal .md-body table { border-collapse: collapse; width: 100%; margin: 0 0 12px; }
  .hmodal .md-body th, .hmodal .md-body td { border: 1px solid var(--line); padding: 5px 9px; font-size: 11.5px; text-align: left; }
  .hmodal .md-body th { background: var(--surface); font-size: 10.5px; letter-spacing: .05em; color: var(--ink-soft); }
  .hmodal .md-body tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 55%, transparent); }
  .dt { transition: opacity .18s; }
  .dt.dim { opacity: .13; }
  @media (prefers-reduced-motion: reduce) {
    .gauge .gfg { transition: none; }
    dialog#healthDlg[open] .hmodal { animation: none; }
  }
  #panel .md-body blockquote { border-left: 3px solid var(--accent); padding: 2px 10px; color: var(--ink-soft); margin: 0 0 11px; }
  #panel .md-body a { color: var(--accent-deep); }
  #panel .md-body hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  #panel .wl { cursor: pointer; text-decoration: underline dotted; }
  .b, .lk { transition: opacity .18s, transform .2s ease; cursor: pointer; }
  .dfloor { cursor: pointer; }
  .dfloor polygon { transition: fill .18s, stroke-width .18s; }
  .dfloor.sel polygon { stroke-dasharray: none; stroke-width: 2.4; }
  nav .grp.sel { outline: 1.5px solid currentColor; outline-offset: -1.5px; }
  .hbadge { cursor: pointer; }
  .hbadge .ring { transition: r .15s ease-out; }
  .hbadge:hover .ring { r: 8.5; }
  .b.dim, .lk.dim { opacity: .13; }
  /* 聚焦时结构边要真的亮起来：细虚线本身就淡，只靠不压暗看不出区别 */
  #svg g.lk.hi > path:first-child { opacity: 1; stroke-width: 1.7; stroke: var(--ink); }
  #svg g.b:not([data-plate]):hover { transform: translateY(-3px); }
  #svg g.b.hop { animation: hop .5s ease; }
  @keyframes hop { 30% { transform: translateY(-7px); } 60% { transform: translateY(-1px); } }
  #selring { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) {
    #selring, #svg g.b.hop { animation: none; }
    #svg g.b:not([data-plate]):hover { transform: none; }
    nav, aside, .handle, .isw .ic, .seg-ind { transition: none; }
  }
  /* 窄屏：两栏转为固定抽屉，把手停靠屏幕边缘 */
  @media (max-width: 1080px) {
    nav {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 20; margin: 0;
      width: min(78vw, 320px); border-radius: 0 16px 16px 0;
      box-shadow: 10px 0 34px rgba(20, 20, 19, .18);
      transition: transform .26s cubic-bezier(.2, 0, 0, 1);
    }
    body.nav-off nav { margin: 0; opacity: 1; transform: translateX(calc(-100% - 40px)); }
    #handleNav { left: calc(min(78vw, 320px) - 1px); }
    body.nav-off #handleNav { left: 0; }
  }
  @media (max-width: 820px) {
    #asideResize { display: none; }
    aside {
      position: fixed; right: 0; top: 0; bottom: 0; z-index: 20; margin: 0;
      width: min(88vw, 360px); border-radius: 16px 0 0 16px;
      box-shadow: -10px 0 34px rgba(20, 20, 19, .18);
      transition: transform .26s cubic-bezier(.2, 0, 0, 1);
    }
    body.aside-off aside { margin: 0; opacity: 1; transform: translateX(calc(100% + 40px)); }
    #handleAside { right: calc(min(88vw, 360px) - 1px); }
    body.aside-off #handleAside { right: 0; }
  }
  @media (max-width: 700px) {
    .statbar { display: none; }
    header { gap: 6px; }
    header button.compact .lb { display: none; }
    header button.compact { padding: 7px 9px; }
    .vstats { grid-template-columns: repeat(2, 1fr); }
    .hmodal { padding: 16px 16px 22px; }
  }
</style>
</head>

    "data-flow.md": "---\nsources:\n  - entrypoints/sidepanel/App.svelte c61f97285c00 handleStart handleStop appendLiveEvent readSelectedSessionSnapshot projectAgentEvents\n  - entrypoints/background.ts 75acddbc8303 startTask handleTaberMessage executeBrowserReplScriptingCommand captureVisibleTab\n  - lib/agent-host-controller.ts 3b3ae90b9257 taber.agent.startTask sendToHost\n  - entrypoints/offscreen/main.ts b1baf380f71c runAgentTask emitAgentEvent createConfiguredRuntime\n  - lib/agent-tools.ts 40485c8780d3 createAgentTools waitForInputPersistence\n  - lib/browser-repl-executor.ts 3823f48553bf executePageCommand callChromeApi\n  - lib/browser-repl.ts 91a8914c1db4 createBrowserReplController\n  - lib/browser-repl-sandbox.ts 7ee8040a279e runBrowserReplInSandbox\n  - lib/db.ts 5e8b63382cda appendAgentEvent readSelectedSessionSnapshot\n  - lib/sidepanel-view.ts 6f17efdad84b timelineFromProjection mergeLiveAgentEvent\n  - lib/subscription-login.ts 6e901a307370 loginOpenAICodex connectOpenAICodex\n  - lib/fs-tool.ts 435378f7d4a7 writeSessionFile\n  - entrypoints/sidepanel/FilesStrip.svelte 84fd158cf0a5 exportPdf print.html\n  - entrypoints/print/main.ts ed1aada29752\n---\n\n# 端到端数据流\n\n系统有四个真实入口：用户在侧边栏的操作、被操作页面回传的执行结果、用户在设置里发起的订阅登录、以及打印页的导出请求。下面五条路径覆盖它们。\n\n## 任务启动与执行\n\n用户在输入框写一句话按下发送。侧边栏把提示词连同这次的运行选项（前台模式、是否授权读取个人资料、界面语言、所在窗口）发给后台（`entrypoints/sidepanel/App.svelte` 的 `handleStart`）。\n\n后台在这个窗口里取当前活动标签页作为本次任务的目标——即使停在设置页或新标签页也允许启动，因为纯问答不需要页面。它确保 AgentHost 这个隐藏页面存在，再把任务连同目标标签快照转发过去（`entrypoints/background.ts` 的 `startTask` → `lib/agent-host-controller.ts` 发出 `taber.agent.startTask`）。\n\nAgentHost 先写一条任务开始事件——写不进去就地回滚，任务根本不算开始。随后装配这次运行需要的一切：按目标站点和提示词取出相关站点技能摘要，拼进系统指令；读出当前选中的模型与供应商，构造对应的模型运行时；生成工具表。装配结果单独记一条运行时配置事件，事后排查能直接看到当时用的是什么（`entrypoints/offscreen/main.ts` 的 `runAgentTask`、`createConfiguredRuntime`）。\n\n模型的输入不是内存里的对话对象，而是从事件日志重新推导出来的消息序列；预估超过模型上下文九成时，先把已结束的历史任务交给同一个模型压成摘要，再重算（`lib/model-context.ts`、`lib/context-compaction.ts`）。\n\n然后进入工具循环。模型每吐出一段文字、一段思考、一次工具调用，都被写成事件；正文类增量先攒到约 512 字或 300 毫秒再落一条，里程碑事件写之前一定先把缓冲刷干净。工具调用的入参必须先落库，对应工具才被放行执行——先记录、后动作（`lib/agent-stream.ts`、`lib/event-coalescer.ts`、`lib/agent-tools.ts` 的输入审计闸门）。\n\n每写一条事件，AgentHost 顺手广播一份给侧边栏；侧边栏按事件序号插入并重新投影界面（`entrypoints/offscreen/main.ts` 的 `emitAgentEvent` → `App.svelte` 的 `appendLiveEvent`）。任务收尾时按优先级判定终局：内部致命错误记失败，用户中断记取消，其余记失败并附原因，随后摘掉页面浮层、通知后台转空闲并排一个两分钟的关闭倒计时。\n\n## 页面读取与操作\n\n模型调用页面工具后，参数先被收敛成规范形状，再进目标串行队列——同一时间只允许一个动作打到目标标签页，否则上一份页面快照里的元素编号会立刻失效（`lib/agent-tools.ts`）。\n\n执行时 AgentHost 把命令连同锁定的目标标签号发给后台。后台先确认这个标签页还在、还可操作，请求里若夹带了别的标签号直接拒绝；前台模式开着就先把目标标签切到可见。随后走用户脚本通道，把页面覆盖层、元素定位器和运行时拼成脚本注入页面执行（`lib/browser-repl-executor.ts` 的 `executePageCommand` → 后台的 Chrome API 代理 → `lib/browser-repl-page-runtime.ts`）。\n\n用户脚本通道不可用时降级：后台改用脚本注入，页面执行完把结果作为一条消息发回后台，按请求编号与等待中的调用配对（`entrypoints/background.ts` 的 `executeBrowserReplScriptingCommand` 与 `taber.scripting.result`）。\n\n页面返回的是可序列化的元素描述——真实的 DOM 引用留在扩展内存里，模型只看到编号和选择器，下次动作再换回真实引用。模型自己写的代码则走另一条路：它在一个没有任何权限的隐藏沙箱页里求值，调用助手时把名字和参数发消息给父页面代劳（`lib/browser-repl-sandbox.ts`、`entrypoints/sandbox/main.ts`）。\n\n结果回到工具层做两件加工：正文或返回值过大时写进工作区文件、只回预览和路径；站点域名变化时附上该站点已有的技能路径。加工后的结果写进工具运行记录并广播完成事件，其中读取个人资料的结果会先脱敏。\n\n## 侧边栏重建与实时跟随\n\n侧边栏打开时不问任何人\"现在什么状态\"，而是自己算：初始化数据库、按设置里记的选中会话读出整份快照（会话、工具记录、按写入顺序排列的事件），把事件流投影成对话、工具时间线、来源和图片，再渲染（`App.svelte` 的启动流程 → `readSelectedSessionSnapshot` → `projectAgentEvents` → `lib/sidepanel-view.ts`）。\n\n之后分两条路跟随：任务边界事件（开始、完成、失败、取消）触发整段会话重读，顺带补上任何漏收的广播；其余增量事件就地追加，不为每个片段重读。因此侧边栏中途关闭期间跑完的每一步，重开后仍能完整回看。\n\n## 订阅登录写入配置\n\n用户在设置里点 ChatGPT 或 xAI 登录。扩展生成一对 PKCE 校验值，打开一个新标签页让用户在官方页面上完成同意，同时监听这个标签页的导航；地址跳到约定回调即判定成功，关掉标签页取出授权码，换成访问令牌与刷新令牌（`lib/subscription-login.ts` → `lib/codex-oauth.ts` / `lib/xai-oauth.ts` → `lib/oauth-browser.ts`）。\n\nChatGPT 这条还会拿令牌去问一次账号能用哪些模型；xAI 没有这个接口，模型表写死在代码里。拿到的凭据、账号身份和模型清单在同一个事务里写进本地数据库，并把选中模型收敛到一个立刻能用的值（`lib/codex-provider.ts` / `lib/xai-provider.ts` → `lib/provider-config-flow.ts`）。任务运行时不持有令牌，每次请求前才读一次，快过期就先续期再写回，写回带乐观比对以防并发覆盖。\n\n## 文件产出与 PDF 导出\n\nAgent 写文件走 fs 工具：文本格式直接编码入库，Word 文档先把 Markdown 逐行解析再打包成真正的二进制；用户从输入框上传的附件、以及超大工具结果的自动外溢，都写进同一张按会话隔离的表（`lib/fs-tool.ts` → `lib/workspace-files.ts`）。\n\n侧边栏的文件条列出本会话的文件，可下载、可删除。导出 PDF 时新开一个扩展内的打印页，它按文件编号从本地库取内容，Markdown 渲染、HTML 直用，统一消毒后插入页面并唤起浏览器打印对话框，由用户另存为 PDF——排版交给浏览器，不引入 PDF 生成库（`entrypoints/sidepanel/FilesStrip.svelte` 的 `exportPdf` → `entrypoints/print/main.ts`）。\n",
    "health.md": "---\ngenerated: npx -y knip@latest --reporter json --include files,exports,cycles\ngenerated-at: 6854c75f7836b4eb793b967b0e95bee02b62acef\n---\n\n# 体检报告\n\n事实来自确定性命令：死代码与循环依赖用 knip，热点用 git churn × 当前行数，断点取 oxc 依赖图（`.svelte` 部分为脚本提取的 import，见末尾说明）。\n\n## 死代码\n\nknip 报了 34 个未被引用的文件，逐个用文件名与基础名全仓搜引用复核后，产品代码（`lib/`、`entrypoints/`）里已经一个不剩，确认仍无引用的只有 3 个脚本：\n\n`scripts/smoke-debugger-runtime.mjs` 不在冒烟运行器的场景表里（`scripts/run-runtime-smoke-if-configured.mjs` 只注册了 extension / browser-repl / sidepanel），`scripts/spikes/spike-codex-extension.ts` 与 `spike-codex-pkce-extension.ts` 是订阅登录的一次性验证残留。三者都属于有意保留的探针，留着就明确标注，不留就删。\n\n上一轮体检报出的 29 个装了没用的界面文件（badge / card / scroll-area / sheet、工具卡上下文、两份重复安装的剪贴板 hook）已经删除，需要时用 shadcn-svelte CLI 重新安装即可。同时清掉的还有三个无任何调用者的导出与两个无调用者的模块内私有函数。\n\n### 疑似（存在动态引用痕迹，需人工确认）\n\n- `scripts/smoke-sidepanel-ui.mjs`、`scripts/smoke-browser-repl-runtime.ts`、`scripts/smoke-extension.mjs`：由冒烟运行器以子进程命令行启动，静态分析看不见。\n- `scripts/dump-session-events.ts`、`scripts/benchmark-agent-event-projection.ts`：分别在 `docs/debugging.md`、`AGENTS.md` 与开发计划里作为诊断/基准命令引用。\n- `design/promo/` 下三个脚本：宣传物料生成，手动执行。\n- `landing/` 下 24 个文件：SvelteKit 约定式路由与组件，knip 没有针对该子项目的配置，整体误报。\n\n## 循环依赖\n\n1 条，且是 shadcn 生成代码的固有形态：`lib/components/ui/dialog/index.ts` 通过 `./dialog-content.svelte` 再导出，而 `dialog-content.svelte` 又从 `./index.js` 取兄弟组件。打包器能处理，不影响运行，改动 dialog 组件时知道有这条环即可。\n\n另有 254 个未被引用的导出，其中前七名全部是组件库的桶文件（`prompt-input`、`dropdown-menu`、`message`、`select`、`dialog`、`tool`、`tooltip` 的 `index.ts`），属于组件库对外导出完整 API 的正常形态，不是缺陷。业务代码那部分逐个复核过：绝大多数是被 `scripts/` 下的测试直接引用的常量与函数（knip 没有把测试脚本当入口，因此整体误报），真正无人调用的只有三个：订阅令牌写入的薄包装与绕过收敛直接清空选中模型的函数已删除（后者绕过选中模型不变量，属于需要清掉的陷阱），Codex 设备码登录的组合函数暂留——它拼装的两个原语仍有单测覆盖，是完整的备用登录路径，要删应整条路径一起删。\n\n## 高危热点\n\n近 12 个月改动次数 × 当前行数，取前 10：\n\n| 文件 | 改动次数 | 行数 |\n| --- | --- | --- |\n| scripts/test-browser-repl.ts | 11 | 2607 |\n| scripts/smoke-sidepanel-ui.mjs | 11 | 1903 |\n| scripts/test-agent-tools.ts | 14 | 1005 |\n| lib/agent-tools.ts | 14 | 675 |\n| lib/sidepanel-i18n.ts | 10 | 779 |\n| scripts/test-document-image-debugger.ts | 6 | 1123 |\n| entrypoints/offscreen/main.ts | 14 | 470 |\n| entrypoints/sidepanel/App.svelte | 9 | 729 |\n| scripts/smoke-browser-repl-runtime.ts | 6 | 1057 |\n| entrypoints/sidepanel/Composer.svelte | 7 | 721 |\n\n前列一半是测试与冒烟脚本，说明改动主要压在验证链上——工具契约每动一次，对应的测试就要跟着改。真正的产品热点是三处：工具集装配（`lib/agent-tools.ts`）、任务主循环（`entrypoints/offscreen/main.ts`）和侧边栏主组件（`App.svelte`）。它们同时是行数偏大的文件，改动前值得先读对应模块页的改动指南。\n\n## 断点\n\n无。依赖图解析全部成功，没有解析失败的文件，也没有指向不存在文件的相对导入。\n\n盲区说明：模板字符串形式的动态导入对静态解析不可见（既不进依赖图也不进悬空导入），这类引用只能靠死文件复核与人工确认兜底。另外 `.svelte` 文件的依赖边由脚本按 `from '...'` 正则提取并按 `$lib` 别名解析，动态组件加载不在覆盖范围内。\n",
    "index.md": "---\nbaseline: 4e4fea9b6e4aeb68729585c102a48fde19ea1664\nexclude:\n  - docs/\n  - design/\n  - README.md\n  - AGENTS.md\n  - CONTEXT.md\n  - PRODUCT.md\n  - DESIGN.md\n  - CHANGELOG.md\n  - CONTRIBUTING.md\n  - SECURITY.md\n  - LICENSE\n---\n\n# Taber 架构 wiki\n\n代码是事实源，这里是压缩后的理解。每页 frontmatter 记录来源文件与哈希，`node docs/architecture/verify.mjs` 负责判断是否过期。\n\n## 从这里开始\n\n- [系统总览](system.md)：进程边界、能力域与硬约束\n- [端到端数据流](data-flow.md)：五条真实运行路径\n- [体检报告](health.md)：死代码、循环依赖、热点、断点\n\n## 模块\n\n**运行时骨架**\n\n- [监督侧边栏](modules/sidepanel.md)：用户观看与接管 Agent 的界面\n- [AgentHost 任务主循环](modules/agent-host.md)：任务生命周期、模型装配、上下文与流式落库\n- [后台代理与扩展生命周期](modules/background-broker.md)：浏览器特权收口、目标标签守卫、AgentHost 生死\n- [Agent 事件日志与投影](modules/event-log.md)：事件流如何被解释成界面与模型上下文\n- [本地 Agent 数据库](modules/database.md)：唯一持久层与保留策略\n\n**Agent 能力**\n\n- [顶层工具集与页面操作](modules/agent-tools.md)：模型能做的六件事及其审计与串行\n- [浏览器 REPL 执行链](modules/browser-repl.md)：模型代码如何安全地作用到页面\n- [文档与视觉提取](modules/document-extraction.md)：网页、链接、PDF、文件转成可读内容与图像\n- [文件工作区与站点技能](modules/skills-workspace.md)：虚拟文件树、站点经验沉淀、导出\n\n**配置与界面**\n\n- [模型供应商配置](modules/provider-config.md)：供应商形状、选中模型不变量、推理强度\n- [官方订阅登录与运行时](modules/subscription-auth.md)：ChatGPT / xAI 登录、令牌续期、模型运行时\n- [设置与登录界面](modules/settings-ui.md)：两条配置路径的界面收口\n- [界面组件库](modules/ui-kit.md)：基础控件与对话组件\n\n**工程与对外**\n\n- [构建与验证工具链](modules/build-verify.md)：构建产物、权限策略、验证分层、诊断脚本\n- [营销落地页](modules/landing.md)：独立部署的产品站点\n\n## 维护\n\n代码改动后跑 `node docs/architecture/verify.mjs`，按打印出的 diff 逐页判断论断是否受影响：受影响就改正文，不受影响就只跑 `--sync` 刷新哈希与 baseline。改过正文才需要重新渲染 `architecture.html`。\n\n产品用语见 `CONTEXT.md`，架构决策见 `docs/adr/`，两者是本 wiki 的上游背景，不在此重复。\n",
    "modules/agent-host.md": "---\nsources:\n  - entrypoints/offscreen/main.ts b1baf380f71c startTask stopTask switchTarget runAgentTask createConfiguredRuntime createLanguageModelRuntime failRunningTask updateRunningTarget handleTargetTabRemoved handleTargetTabUpdated emitAgentEvent scheduleIdleClose AUDIT_PERSISTENCE_FATAL_ERROR MAX_AGENT_STEPS\n  - lib/agent-stream.ts 05dc5e480cce collectAgentResponseText emitAgentEventFailClosed inspectStreamHealth streamFailureMessage nextWithIdleTimeout STREAM_IDLE_TIMEOUT_MS MAX_TOOL_INPUT_CHARS MAX_STEP_OUTPUT_CHARS\n  - lib/model-context.ts db0f0a9553c8 deriveModelMessages estimateModelPromptTokens compactableTaskGroups latestCompactionSummary serializeTaskGroupsForCompaction taskGroupsAfter serializeToolEvidenceForContext\n  - lib/context-compaction.ts 94e4be805749 compactContext needsCompaction contextLimit SUMMARIZATION_PROMPT UPDATE_SUMMARIZATION_PROMPT\n  - lib/event-coalescer.ts 1e4943eca155 createDeltaCoalescer DELTA_FLUSH_CHARS DELTA_FLUSH_AGE_MS\n  - lib/agent-instructions.ts 0df575a67b80 instructionsByLocale profileInstructionsByLocale readAgentLocale AGENT_INSTRUCTIONS_VERSION\n  - entrypoints/offscreen.html 753fd2b65c8e sandbox.html\ncovers:\n  - entrypoints/offscreen/main.ts\n  - entrypoints/offscreen.html\n  - lib/agent-stream.ts\n  - lib/agent-instructions.ts\n  - lib/context-compaction.ts\n  - lib/model-context.ts\n  - lib/event-coalescer.ts\n---\n\n# AgentHost 任务主循环\n\n## 职责\n\nAgentHost 是真正跑任务的那个后台页面：侧边栏只负责收集用户意图，任务从这里启动、在这里循环调用模型和工具、在这里结束。它同一时间只承认一个任务，负责给模型准备\"它需要知道的一切\"——行为守则、这个站点的既有经验、可用工具、模型接入方式，以及从历史事件日志还原出来的对话，然后把模型吐出的每一段思考、文字和工具调用如实记进本地日志，让侧边栏和后续任务都能看到同一份事实。\n\n它同时是任务安全的兜底位置：目标标签页被关掉、模型流卡住或开始胡乱刷屏、日志写不进去，都由这里判定任务失败并停机，而不是让任务半死不活地继续。\n\n## 对外接口\n\n宿主本身没有导出，靠消息驱动（`entrypoints/offscreen/main.ts`）：`taber.agent.startTask` 启动、`taber.agent.stopTask` 请求停止、`taber.agent.switchTarget` 换目标标签页，后台还会转发 `taber.background.tabRemoved` / `tabUpdated`。启动前先 `initializeDatabase` 并播种内置技能，就绪后置 `document.body.dataset.ready`，供构建期冒烟检测。宿主页面 `entrypoints/offscreen.html` 只做两件事：挂载主脚本、内嵌 `/sandbox.html` iframe。\n\n- 指令域只暴露 `instructionsByLocale` / `profileInstructionsByLocale` / `readAgentLocale` / `AGENT_INSTRUCTIONS_VERSION`（`lib/agent-instructions.ts`），中英双份，个人资料段落只在任务授权时拼接。\n- 流消费域只暴露 `collectAgentResponseText` 与 `emitAgentEventFailClosed`（`lib/agent-stream.ts`），前者把 AI SDK 的 `fullStream` 翻译成回调，后者把\"事件写失败即致命\"的语义封成一层。\n- 模型上下文域暴露 `deriveModelMessages` / `estimateModelPromptTokens` / `compactableTaskGroups` / `latestCompactionSummary` / `serializeTaskGroupsForCompaction` / `taskGroupsAfter` / `serializeToolEvidenceForContext`（`lib/model-context.ts`）；分组投影本身来自 `lib/agent-event-projection.ts`。\n- 压缩域暴露 `needsCompaction` / `contextLimit` / `compactContext` 与两份摘要提示词（`lib/context-compaction.ts`）。\n- 增量合并域只暴露 `createDeltaCoalescer`（`lib/event-coalescer.ts`），返回 `append` / `flush`。\n\n## 数据怎么流\n\n**启动。** 收到启动请求后先解析前台模式、个人资料授权、语言和目标标签页，没有会话就用提示词前 80 字建一个。目标页挂上\"Taber 正在控制此页\"的浮层、通知后台进入活跃态，然后写入任务开始事件。这条事件写不进去就地回滚：撤销浮层、清掉运行态、重新排空闲关闭定时器并把错误抛回调用方，任务根本不算开始。\n\n**装配。** 按目标页地址和提示词取站点技能摘要，与基础指令（必要时加个人资料段）拼成系统指令；读当前选中的模型与供应商，按供应商类型分别构造 ChatGPT 订阅、xAI 订阅、OpenAI API Key 或通用 OpenAI 兼容的模型运行时，同时带上推理强度选项；再按当前是否开启页面脚本同意生成工具集。装配结果连同供应商种类、模型名、工具 schema 版本一起写成一条运行时配置事件，任务出问题时能直接看到当时用的是什么。工具循环步数上限 20 步，单步 5 分钟、整任务 30 分钟。\n\n**上下文。** 模型的输入不是内存里的对话对象，而是从事件日志重新推导：取最近一次压缩摘要作为开头，其后每个历史任务折成一条用户消息（浏览器上下文、用户请求、工具证据、失败或取消结论）加一条助手消息，当前任务只放用户请求。启动前先估算指令、工具描述和消息的 token 总量，超过模型上下文窗口九成就触发压缩：把已结束的历史任务序列化后交给同一个模型做结构化摘要（已有摘要则走增量更新提示词），摘要落成一条压缩事件并记录它覆盖的事件区间，之后重新读日志重算消息。若压缩后仍然超限，或压根没有可压缩的历史任务，任务直接以\"上下文过大\"失败，不会截断着硬跑。\n\n**流式落库。** 模型输出边流边记：正文、推理、工具入参这三类增量先进合并缓冲，攒够约 512 字或 300 毫秒才写一条日志，而消息开始、推理开始结束、工具入参开始完成、工具失败这些里程碑事件写之前一定先把缓冲刷干净，保证时间顺序不乱。同一时间只缓冲一路增量，切换目标时自动刷。工具入参完成事件落库后才放行对应工具的执行，避免\"动作先发生、记录后到\"。\n\n**健康与终止。** 流被持续体检：整步生成量、单次工具入参长度、连续空白字符、工具入参 JSON 是否合法且没在闭合后继续吐，任何一项越界都当成模型失控，立刻把还挂着的工具调用标成失败并终止任务。三分钟完全没有输出也按上游卡死处理。收到停止请求时写一条停止请求事件并中断；结束阶段按优先级判定终局：内部致命错误（日志写入失败、目标页丢失）记失败并带上原因，用户中断记取消，其余记失败并附错误信息（供应商错误会带上响应体片段便于排查）。无论哪种收尾，都摘掉浮层、清空运行态、通知后台转空闲，并排一个两分钟的空闲关闭。\n\n**目标页变化。** 目标页被关闭即判任务失败，不会悄悄换一个页面继续；目标页变成不可操作的地址只是撤下浮层，任务仍可靠导航自救。换目标先写目标变更事件，写失败同样按致命处理，写成功后才移动浮层并更新运行态。\n\n## 改动指南\n\n- 新增任务事件类型时优先走 `emitTaskEvent`（`runAgentTask` 内的包装）而不是裸 `emitAgentEvent`：前者失败会触发 `failRunningTask(AUDIT_PERSISTENCE_FATAL_ERROR)`，fail-closed 语义靠它维持；终局事件（`task.completed` / `task.failed` / `task.cancelled`）故意用裸调用，写失败只打日志，否则会递归自毁。\n- 任何新的里程碑事件必须经 `emitFlushed` 或先 `deltas.flush()`；直接 `emitTaskEvent` 会让它插到未刷出的增量前面，侧边栏投影顺序会错。\n- `deriveModelMessages` 与 `serializeTaskGroupsForCompaction` 共用同一套分组投影，改事件 payload 结构要同时体检 `lib/agent-event-projection.ts` 的 `projectTaskGroups` / `projectToolEvidence`，否则历史任务会静默丢证据。\n- 修改指令文案必须同步 `AGENT_INSTRUCTIONS_VERSION`（`lib/agent-instructions.ts`），它写进任务开始事件用于回溯行为差异。\n- 上下文预算用 `estimateTokens` 粗估（ASCII 四字一 token、非 ASCII 一字一 token），只做保守判断，别拿它当计费依据；阈值是窗口的 0.9，改 `contextLimit` 会同时影响压缩触发和硬失败判定。\n- `compactContext` 只压缩已结束且不属于当前任务的历史任务；当前任务内部的长工具输出不在压缩范围内，遇到超长单任务要从工具侧收敛输出。\n- offscreen 的 `runtime` 是受限子集，实测没有 `getManifest`，需要版本信息用编译期常量，不要在这里读 manifest。\n- 运行态是模块级单例，所有异步回调回写前都要确认 `runningTask?.taskId` 仍是自己那一票，否则会污染下一个任务；新增回调请照抄这个守卫。\n- 流健康阈值（`lib/agent-stream.ts` 顶部常量）调松会放过刷屏模型、调紧会误杀大 JSON 入参的合法工具调用，改动前先确认最大工具入参的真实量级。\n",
    "modules/agent-tools.md": "---\nsources:\n  - lib/agent-tools.ts 40485c8780d3 createAgentTools AgentToolRuntime createTargetOperationSerializer createRunLogger recordableToolOutput createToolInputAuditGate spillLargeDocumentContent spillLargeReplValue navigateFailure\n  - lib/browser-tool.ts 1148e440eb33 parseBrowserInput browserInputJsonSchema hasBrowserStateRefShape MAX_BROWSER_SNAPSHOT_ELEMENTS DEFAULT_BROWSER_TOOL_TIMEOUT_MS\n  - lib/navigate.ts abd64d63012d createNavigateController parseNavigateInput assertLockedTabId waitForTabNavigation navigateInputJsonSchema\n  - lib/debugger-tool.ts e805bb1e71f1 createDebuggerController parseDebuggerInput debuggerRequestType\n  - lib/debugger-cookie-guard.ts 71485159216c assertAllowedCdpMethod prepareCdpParams assertNoCookieExposure wrapCookieBlockedExpression\n  - lib/agent-tool-image-output.ts d732bf20f98a extractImageToModelOutput\ncovers:\n  - lib/agent-tools.ts\n  - lib/agent-tool-image-output.ts\n  - lib/browser-tool.ts\n  - lib/navigate.ts\n  - lib/debugger-tool.ts\n  - lib/debugger-cookie-guard.ts\n---\n\n# 顶层工具集与页面操作\n\n## 职责\n\n这里定义模型能对浏览器做的全部动作，并把每一次动作变成一条可审计的记录。模型看到的是一组固定的、彼此边界清晰的能力：读网页或文件内容、截图取图、跨标签导航、按人话定位元素做点击填写、在页面里跑高级脚本兜底、读写会话文件与站点技能；调试构建下额外多一项读控制台、网络和无障碍树的能力。\n\n这一层还承担三件跨工具的公共职责。第一是把模型给的参数收敛成规范形状：模型常常把所有可选字段都填上占位值，收敛规则会丢掉占位、在真正冲突时才报错，让一次调用只表达一个意图。第二是审计与串行：所有针对被控标签页的操作排成一条队列依次执行，每次执行前后写事件日志和工具运行记录，日志写不进去时任务立即失败而不是继续操作，避免同一个动作被重复执行却无人知晓。第三是上下文经济：超长的正文和超长的脚本返回值会落盘到会话文件里，只把预览和文件路径回给模型。\n\n被控标签页的约束也在这里兜底。任务锁定的目标标签是隐式的，除了切换和关闭标签，工具输入里不接受任意标签号；关闭目标标签等于任务无法继续，会直接判失败而不是悄悄换一个页面接着做。\n\n## 对外接口\n\n- 工具集工厂 `createAgentTools`（`lib/agent-tools.ts`）返回 AI SDK 的工具表：`getDocument` / `extractImage` / `navigate` / `browser` / `browserRepl` / `fs`，`DEBUGGER_ENABLED` 为真时追加 `debugger`。同文件的 `createAgentToolPromptEstimateText` 把描述与 schema 序列化，供上下文预算估算；`AGENT_TOOL_SCHEMA_VERSION` 是工具契约版本号，随入参形状变更递增。\n- 输入审计闸门 `createToolInputAuditGate` 由 AgentHost 持有：`complete(toolCallId)` 在 `tool.input.completed` 落库后调用，工具执行前经 `waitForInputPersistence` 等待同一个 id，保证「先记录入参、后执行副作用」。\n- `browser` 域只暴露 `parseBrowserInput` / `browserInputJsonSchema` / `hasBrowserStateRefShape`（`lib/browser-tool.ts`），纯解析无副作用；实际页面执行走 `browser-repl-executor` 的 `executePageCommand`，超时 `DEFAULT_BROWSER_TOOL_TIMEOUT_MS`，snapshot 元素上限 `MAX_BROWSER_SNAPSHOT_ELEMENTS`。\n- `navigate` 域分两半：offscreen 侧只做 `parseNavigateInput` 和目标校验，真正的 tabs 操作在 background 由 `createNavigateController`（`lib/navigate.ts`）执行，消息类型 `navigateRequestType`。\n- `debugger` 域同样是 `parseDebuggerInput` + `debuggerRequestType` 转发，控制器 `createDebuggerController`（`lib/debugger-tool.ts`）跑在 background；cookie 防护由 `assertAllowedCdpMethod` / `prepareCdpParams` / `assertNoCookieExposure` / `wrapCookieBlockedExpression`（`lib/debugger-cookie-guard.ts`）把守。\n- 图片工具的模型侧呈现由 `extractImageToModelOutput`（`lib/agent-tool-image-output.ts`）以 `toModelOutput` 挂在 `extractImage` 上。\n- 落盘阈值 `DOCUMENT_SPILL_THRESHOLD_CHARS` / `DOCUMENT_SPILL_PREVIEW_CHARS` 与 `spillLargeDocumentContent` / `spillLargeReplValue` 一并导出，测试直接针对这两个函数。\n- `fs` 与 `browserRepl` 的实现分别在文件工作区页和 REPL 页；本层只负责注册它们、包上审计与串行，并在读过站点技能后记录路径。\n\n## 数据怎么流\n\n模型发起一次工具调用后，入参先经该工具自己的解析器收敛成规范形状，形状不合法直接以校验错误回给模型，不产生任何副作用。随后执行被闸门挡住，直到这次调用的入参已经写进事件日志；接着进入目标串行队列排队，只有明确与目标页面无关的调用（列标签页、读远端 URL 之外的纯文件操作）才免排队。\n\n执行时，需要碰浏览器的工具都通过消息发给后台代理，消息里带上当前锁定的目标标签号和前台模式标志，由后台去动 tabs、截图或注入脚本。页面执行失败时，如果原因是站点权限不足，错误会被改写成一句可操作的提示再抛给模型；如果原因是目标标签消失，则升级成任务级失败并通知 AgentHost 结束任务。\n\n成功后结果先做两件加工：正文或脚本返回值过大时写入会话文件，只保留开头预览、字符数和文件路径；导航、页面操作、脚本执行导致站点域名变化时，附上该域名下已有的站点技能路径，提示模型先看先验知识。然后结果写入工具运行记录并广播完成事件，侧边栏时间线、会话导出和后续任务的模型上下文都读这份记录——因此写入这份记录的输出会做一次脱敏，读取个人资料的结果只留元信息，不让历史绕过每任务授权。写日志失败被当成致命错误：动作可能已经生效，任务停下来而不是重试。\n\n截图类结果不以 JSON 原样进模型，而是拆成一段元信息文本加一份图片附件，data URL 不进对话文本。连续两次工具失败且本任务读过站点技能时，错误消息里会追加一句提示，让模型考虑技能已经过时并更新它。\n\n导航侧的失败被翻译成带错误码和重试建议的结构化结果而不是异常：目标不匹配、目标不可操作、导航失败三类各有各的下一步建议。页面加载超时不算失败，而是带上标签状态的降级成功，让模型去看页面而不是原地重试同一次导航。\n\n## 改动指南\n\n- 新增或修改工具入参形状后必须递增 `AGENT_TOOL_SCHEMA_VERSION`（`lib/agent-tools.ts`），它进任务诊断，用来解释旧会话的行为差异。\n- 顶层工具数量是产品约束（见 `AGENTS.md`、ADR 0015/0016）。要加能力优先做成已有工具的 action，不要往工具表里加第七个键。\n- `parseBrowserInput`（`lib/browser-tool.ts`）里的占位值清洗是对付降级模型的实战规则：空串、0/0 坐标、和语义定位并排出现的畸形 `ref` 都要继续被吞掉。放宽成「多定位符即报错」会显著提高真实任务的失败率；`fill` 拒绝空串也是刻意的，清空字段的路径在 REPL。\n- 任何新的目标页面操作都要走 `serializeTargetOperation` 包装（`lib/agent-tools.ts`）。绕过它会让两次页面操作并发打到同一个标签，snapshot 的 `ref` 立刻失效。\n- 目标标签规则有两处实现：offscreen 的 `navigateTargetMismatch` 与 background 的 `assertLockedTabId`（`lib/navigate.ts`）。两边都要改，前者给模型可读的重试建议，后者是最终防线。\n- `recordableToolOutput`（`lib/agent-tools.ts`）是审计脱敏的唯一收口。新增会读到个人数据的工具动作时必须在这里加分支，否则内容会通过事件日志泄进后续任务的上下文。\n- 落盘（spill）只对成功结果生效且跳过 file 来源，写文件失败时降级为不落盘并继续返回完整结果——这是有意的：宁可上下文大一点也不让辅助功能打断任务。\n- `lib/debugger-cookie-guard.ts` 的正则是层层叠加的绕过对抗（字符串折叠、charCode、atob、别名、回调注入），修改时只能加严不能放松；`wrapCookieBlockedExpression` 生成的包装脚本与静态检查是双保险，任何一侧削弱都等于放开 cookie。调试工具只在 `TABER_ENABLE_DEBUGGER=1` 构建里注册，上架版本不含它。\n- `navigate` 的等待基于标签与 webNavigation 事件，超时只是降级信号；不要改成轮询标签状态，也不要把超时改回抛错。\n",
    "modules/background-broker.md": "---\nsources:\n  - entrypoints/background.ts 75acddbc8303 handleTaberMessage isPrivilegedMessageType prepareAgentTarget requireTargetTab startTask captureVisibleTab executeUserScript executeBrowserReplScriptingCommand queryActiveTabs\n  - lib/chrome-api-broker.ts 7ecf75f3075b createChromeApiBroker isChromeApiRequest isTrustedChromeApiSender ChromeApiAction\n  - lib/offscreen-lifecycle.ts b7513ddd764c createOffscreenLifecycle ensureDocument closeDocument\n  - lib/agent-host-controller.ts 3b3ae90b9257 createAgentHostController AGENT_HOST_IDLE_TIMEOUT_MS markActive markIdle closeNow startTask stopTask\n  - lib/active-tab.ts 7b4bd85db560 selectOperableActiveTab isOperableTab effectiveTabUrl readRequiredWindowId\n  - lib/foreground-mode.ts e24f66df62a0 parseForegroundMode readForegroundMode setForegroundMode foregroundModeSettingKey\n  - lib/runtime-flags.ts 6f1a2de5c63d DEBUGGER_ENABLED\ncovers:\n  - entrypoints/background.ts\n  - lib/chrome-api-broker.ts\n  - lib/offscreen-lifecycle.ts\n  - lib/agent-host-controller.ts\n  - lib/active-tab.ts\n  - lib/foreground-mode.ts\n  - lib/runtime-flags.ts\n---\n\n# 后台代理与扩展生命周期\n\n## 职责\n\n后台是整个扩展里唯一持有浏览器特权的地方。侧边栏和 Agent 运行环境都没有直接操作标签页、注入脚本或截图的能力，它们只能发消息请求后台代劳，后台校验来源、校验参数、确认要操作的标签页仍然是这次任务锁定的那一个，然后才真正调用浏览器。\n\n它还负责三件生命周期的事：按需把 Agent 的运行容器（一个不可见的后台文档）创建出来，任务结束后等一段空闲期再关掉；在任务开始时确定并锁定这次任务要操作的标签页；根据用户的前台模式偏好决定操作时要不要把这个标签页切到可见。\n\n## 对外接口\n\n- 消息入口：`handleTaberMessage`（`entrypoints/background.ts`）按消息类型分发，覆盖 Chrome API 代理、文档/图片提取、导航、页面脚本执行与取消、offscreen 生命周期、任务启停、当前标签查询。返回 `undefined` 表示不认识的消息，交给其它监听器。\n- 权限闸门：`isPrivilegedMessageType` 列出全部特权消息类型，命中后必须通过 `isTrustedChromeApiSender`（`lib/chrome-api-broker.ts`）——发送方扩展 ID 相符且 URL 为本扩展的 `chrome-extension:` 页面，否则直接拒绝。\n- Chrome API 代理：`createChromeApiBroker` 把请求映射到白名单动作 `ChromeApiAction`（tabs 五个、`scripting.executeScript`、`userScripts.execute`、`webNavigation.getAllFrames`、三个 `debugger.*`），`isChromeApiRequest` 做形状校验。被 `lib/browser-repl-executor.ts`、`lib/browser-frame-router.ts`、`lib/browser-repl-cdp.ts` 复用为客户端契约。\n- Offscreen 文档：`createOffscreenLifecycle`（`lib/offscreen-lifecycle.ts`）只暴露 `ensureDocument`/`closeDocument`/`hasDocument`，内部用两个 in-flight promise 去重并发创建与关闭。\n- AgentHost 控制：`createAgentHostController`（`lib/agent-host-controller.ts`）暴露 `startTask`/`stopTask`/`markActive`/`markIdle`/`closeNow`，空闲期常量 `AGENT_HOST_IDLE_TIMEOUT_MS` 为 120 秒，被 offscreen 端复用成同一个倒计时口径。\n- 标签判定：`lib/active-tab.ts` 只暴露 `selectOperableActiveTab`/`isOperableTab`/`effectiveTabUrl`/`readRequiredWindowId`；可操作 = 有正整数 id 且 URL 为 http/https，URL 以 `pendingUrl` 优先。\n- 前台模式：`lib/foreground-mode.ts` 暴露 `parseForegroundMode`（严格布尔，否则抛错）与 Dexie 读写 `readForegroundMode`/`setForegroundMode`，键 `foregroundModeSettingKey`。\n- 页面脚本桥：`executeUserScript` 先试用户脚本通道并带超时，拿不到结果就把能力标记为不可用；`executeBrowserReplScriptingCommand` 走注入降级，注入侧结果经 `taber.scripting.result` 消息按请求 id 回填，默认 30 秒、上限 120 秒。\n- 构建开关：`DEBUGGER_ENABLED`（`lib/runtime-flags.ts`）读编译期常量 `__TABER_ENABLE_DEBUGGER__`，由 `wxt.config.ts` 从环境变量 `TABER_ENABLE_DEBUGGER=1` 注入。\n\n## 数据怎么流\n\n侧边栏打开时会连一条长连接并报上自己所在的窗口，后台记住这个窗口号；后续凡是要找「当前标签页」的查询，都在这个窗口里找，而不是笼统地问浏览器。用户点开始任务时，后台在该窗口取 active 标签页，优先选可操作的那个；即使停在设置页或新标签页也允许启动，因为纯问答不需要页面，Agent 也可以先导航过去。选中的标签页连同窗口号、前台模式、个人资料授权一起打包成一份任务快照，交给 Agent 运行容器；这份快照在任务期间不再变化。\n\n之后每次页面操作请求都带着这个锁定的标签页号回到后台。后台先确认该标签页仍然存在且仍可操作，不存在就明确报错而不是悄悄换一个；如果请求里另外指定了别的标签页且与锁定目标不一致，直接拒绝并提示只能通过导航工具里的切换动作改变目标。前台模式打开时，操作前会把目标标签页切到 active（已经 active 就不动）；关闭时全程在后台执行。唯一的例外是可视区域截图——浏览器只能截当前可见标签页，所以关闭模式下会临时激活、等一小段渲染时间、截完再切回原来的标签页，且只在用户期间没有自己切走时才恢复。\n\nAgent 容器是懒创建的：启动任务时才确保它存在，任务结束后进入空闲倒计时，两分钟内没有新任务就关闭，中途有新活动则取消倒计时。标签页被关闭或地址变化时，后台会广播通知，让正在跑的任务和侧边栏及时知道目标页面的状态。\n\n页面里的脚本执行走两条路：优先用浏览器的用户脚本能力，若它超时或拿不到返回值就降级为注入脚本，注入侧执行完把结果作为一条消息发回后台，与等待中的请求按 id 配对完成；任务被中止时后台会记下取消标记并主动通知页面停下。\n\n调试协议能力只在调试构建里存在；发布构建把相关接口替换成一律失败的桩，即使消息发到后台也只会得到明确的「仅调试构建可用」错误。\n\n## 改动指南\n\n- 新增任何后台消息类型时，必须同步加进 `isPrivilegedMessageType`（`entrypoints/background.ts`），否则该入口对任意页面开放。新增 Chrome API 动作要同时改 `ChromeApiAction` 类型与 `chromeApiActions` 数组（`lib/chrome-api-broker.ts`），两处漏一处会被 `assertNever` 或形状校验挡掉。\n- 涉及目标标签页的新消息，处理函数开头要调用 `prepareAgentTarget`，并把请求自带的标签页号传进去做一致性比对——这是「任务锁定 target」不变量的唯一执行点（ADR 0011/0018）。\n- 不要在后台重新读 Dexie 里的前台模式：任务快照是运行期唯一事实源，`parseForegroundMode` 只做严格布尔解析；运行中热切换是 ADR 0019 明确否决的方案。\n- 空闲关闭常量在 `lib/agent-host-controller.ts`，offscreen 端复用同一常量，改动请只改这一处。`createOffscreenLifecycle` 的并发去重依赖模块级 promise 变量，service worker 被回收后状态清零属预期，`ensureDocument` 会重新探测实际状态。\n- 「可操作」判定统一走 `isOperableTab`（`lib/active-tab.ts`），别在调用点自己写 URL 正则；`effectiveTabUrl` 优先取 `pendingUrl` 是为了覆盖导航中的中间态。\n- 上架构建只申请必要权限，站点访问在 `wxt.config.ts` 里走 `optional_host_permissions`；新增能力前先确认能否复用已代理的动作，而不是扩大静态权限。\n- 注入降级的挂起请求存在后台模块级 map 中，超时或取消都必须走清理路径，否则 service worker 存活期内会泄漏定时器；取消标记有 120 秒自动过期，别依赖它做长期状态。\n- 调试协议开关是编译期常量，运行时不可切换；新增依赖调试能力的代码路径要同时提供发布构建下的失败路径，不要静默降级。\n",
    "modules/browser-repl.md": "---\nsources:\n  - lib/browser-repl.ts 91a8914c1db4 createBrowserReplController browserJsPageResult createRunBudget withHelperResultHint\n  - lib/browser-repl-command.ts 9a22d2e0e8c6 parseBrowserReplInput rememberBrowserReplElementRefs readBrowserReplActionTarget browserReplFallbackFor browserReplPageHelperNames\n  - lib/browser-repl-executor.ts 3823f48553bf createBrowserReplPageExecutor executeUserScriptCommand executePageFallback executeScriptingPageCommand cancelPageCommandOnAbort requiresScriptingCancel\n  - lib/browser-repl-page.ts bf64bc546a77 createBrowserReplUserScript\n  - lib/browser-repl-page-runtime.ts 5ee23d68a00f runBrowserReplPageRuntimeInjected runBrowserReplPageRuntime\n  - lib/browser-repl-page-locator.ts c8cafd22bcfc installBrowserReplPageLocator\n  - lib/browser-frame-router.ts 6544e8f4a828 createBrowserFrameRouter\n  - lib/browser-repl-sandbox.ts 7ee8040a279e runBrowserReplInSandbox\n  - entrypoints/sandbox/main.ts b209a505eaca compileBrowserRepl createRemoteHelper\n  - lib/browser-repl-code.ts 4d6cc52cc223 normalizeBrowserJsCode jsonLiteralForInjectedCode cloneBoundaryError\n  - lib/browser-js-page-script.ts 323c6055dbb0 createBrowserJsScript\n  - lib/browser-repl-visual-page.ts e1653a9f37e0 runTaberPageOverlayCommand createBrowserReplVisualScript\n  - lib/browser-repl-cdp.ts 1508c50c098e canUseCdpFallback executeBrowserReplCdpFallback\ncovers:\n  - lib/browser-repl.ts\n  - lib/browser-repl-cdp.ts\n  - lib/browser-repl-code.ts\n  - lib/browser-repl-command.ts\n  - lib/browser-repl-evaluation.ts\n  - lib/browser-repl-executor.ts\n  - lib/browser-repl-page.ts\n  - lib/browser-repl-page-introspection.ts\n  - lib/browser-repl-page-locator.ts\n  - lib/browser-repl-page-runtime.ts\n  - lib/browser-repl-page-types.ts\n  - lib/browser-repl-sandbox.ts\n  - lib/browser-repl-visual-page.ts\n  - lib/browser-js-page-script.ts\n  - lib/browser-frame-router.ts\n  - entrypoints/sandbox/main.ts\n  - entrypoints/sandbox.html\n---\n\n# 浏览器 REPL 执行链\n\n## 职责\n\n这一层负责把模型现写的一小段 JavaScript 变成对目标标签页的真实操作，并把可信证据带回来。模型只提交代码，不接触扩展权限：代码跑在一个隔离的空白页里，能用的只有 Taber 注入的一组异步 helper——读可见文本、列出链接与按钮、按文字或选择器查元素、点击、填写、按键、滚动、等待页面变化、批量执行、按字段名填表、请用户亲手指点某个元素，以及把纯数据交给嵌套沙箱做计算。导航不属于 REPL，helper 里的导航调用会转交给顶层导航工具（ADR 0001）。\n\n页面操作的主路径是结构化的浏览器工具，REPL 是它的高级 fallback：它承担那些结构化动作表达不了的场景——需要在同一次调用里先查再算再操作、需要跨 iframe 拿快照、或者需要在页面自己的运行时里读一段只有页面 JS 才知道的状态。\n\n最后一类能力单独被围起来：`browserjs` 只有在用户明确同意后才出现在 helper 列表里。前面那些固定 helper 都在与页面脚本隔离的世界执行，看不见页面自己的变量；`browserjs` 反过来，跑在页面自己的运行时里，语义接近 DevTools 控制台，能读页面内部状态、也能观察到页面自身的网络调用（ADR 0002）。因为这份能力更危险，它的代码在提交前会被检查，禁止直接改地址、翻历史或开新窗口，只能走导航工具；返回值必须是可序列化的普通数据，DOM 节点、函数、窗口对象一律过不了边界。\n\n## 对外接口\n\n- REPL 编排只暴露 `createBrowserReplController`（`lib/browser-repl.ts`）：接收「取当前标签页」「执行页面命令」「跑沙箱」「导航」四个回调，返回一个 `run`。helper 集合、超时预算、证据判定都在这里。\n- 输入解析与参数归一集中在 `lib/browser-repl-command.ts`：`parseBrowserReplInput`、`browserReplInputJsonSchema`（工具描述文本的事实源）、`rememberBrowserReplElementRefs`（给元素编号并把真实引用留在扩展侧）、`readBrowserReplActionTarget`、`browserReplFallbackFor`。\n- 页面执行由 `createBrowserReplPageExecutor`（`lib/browser-repl-executor.ts`）实现，注入脚本文本由 `createBrowserReplUserScript`（`lib/browser-repl-page.ts`）拼装；页面侧真正干活的是 `installBrowserReplPageLocator` 与 `runBrowserReplPageRuntimeInjected`。\n- 结构化浏览器工具的跨 frame 路由是 `createBrowserFrameRouter`（`lib/browser-frame-router.ts`）。\n- 模型代码的执行容器是 `runBrowserReplInSandbox`（`lib/browser-repl-sandbox.ts`）配 `entrypoints/sandbox.html` + `entrypoints/sandbox/main.ts`。\n- 调试构建专属的原生兜底是 `canUseCdpFallback` / `executeBrowserReplCdpFallback`（`lib/browser-repl-cdp.ts`）。\n\n## 数据怎么流\n\n模型提交的代码先被解析成一个只含代码字符串的输入，然后进入一次带总预算的运行：整次调用有 30 秒上限，每个 helper 领到的超时都会被压到剩余额度内，预算耗尽或用户停止任务，信号会一路传到页面命令和沙箱。\n\n代码本身不在扩展页面里直接求值，而是被送进一个隐藏 iframe 里的空白沙箱页。沙箱先试着把代码当成单个表达式求值，语法不成立再当成多语句函数体跑，所以「一句表达式」能自动成为返回值。沙箱里没有真 helper，只有同名的代理函数：调用时把名字和参数发消息给父页面，父页面执行真实 helper，再把结果发回去。跨这层消息边界的东西必须能被结构化克隆，克隆失败会被翻译成一句人话的提示，告诉模型别返回 DOM。沙箱里还有一个嵌套的纯计算沙箱，用来处理数据但碰不到页面。\n\n真实 helper 落到页面时走的是用户脚本注入：扩展把页面覆盖层、页面自省、元素定位器和运行时逐段拼成一段脚本文本注入目标标签页，固定 helper 在隔离世界执行，`browserjs` 则以主世界注入，用户代码在注入前被包成一个带导航守卫的函数，页面里的 `console` 输出会被捕获并限量随结果回传。注入不可用时——比如用户没打开用户脚本开关——固定 helper 退到扩展的脚本注入通道，由后台依次注入同样几段代码并用消息回传结果；`browserjs` 不做这个降级，只提示用户开启后重试。等待类命令（等待、批量里含等待、请用户点选）本身就走后台通道，因为它们要能被中途取消。取消通过一个随机的取消键实现：扩展侧发出取消消息，页面里的等待监听收到就立刻中止，后台也会记住这个键，避免注入晚到的命令又挂起来。\n\n回到结果侧，读页面的 helper 返回的是可序列化的元素描述，真实的定位信息被留在扩展内存里，模型看到的是编号和精确选择器；下一次点击或填写传回编号或元素对象时，扩展再换回真实引用。这样模型不必猜选择器，也不可能把 DOM 拖过边界。结构化浏览器工具的引用更进一步：路由器给每个快照发一批带快照标识的引用，记住它属于哪个标签页的哪个子框架，动作按引用自动路由到对应框架；只保留最近两次快照的引用，过期或被模型自己拼造的引用会被明确区分成「过期」和「从未发放」两种失败，并附一份新鲜快照。按文字、角色或标签定位时，路由器会先拍一次含所有可访问子框架的快照，再打分选出唯一目标，命中多个就返回候选让模型自己选；跨源、出错或没有站点权限的框架只出现在结果里的元数据中，并提示需要授权或直接打开该页面。\n\n一次运行结束后，如果模型显式返回了值就用它，否则用最后一个 helper 的结果当证据；两者都没有且没有页面控制台输出，就返回一个明确的「无证据」失败，提示不要重复可能已经生效的副作用，而是重新取一次页面状态。任务执行期间页面上会显示 Taber 正在控制此页的覆盖层，点击、填写、按键还会给目标元素套一层高亮，成功和失败用不同颜色，这层视觉反馈出错时被吞掉，不会影响动作本身。调试构建下还多一条原生兜底：点击、填写、按键在 DOM 层失败且失败原因不是「元素禁用/不存在/引用过期」这类确定性问题时，会改用调试协议按元素坐标发真实鼠标键盘事件，并在结果里标明用了兜底。\n\n## 改动指南\n\n- 工具描述、helper 名单和输入约束是三处联动的事实源：`createBrowserReplInputJsonSchema` 的 description、`browserReplToolHelperNames`、`browserReplPageHelperNames`（均在 `lib/browser-repl-command.ts`），以及页面运行时 `browserReplPageMain` 里的 helper 表（`lib/browser-repl-page-runtime.ts`）。新增 helper 要四处一起改，少一处会得到 `Unsupported browserRepl helper`。\n- `createBrowserReplUserScript` 靠 `Function.prototype.toString` 把 `installBrowserReplPageLocator`、`createBrowserReplPageIntrospection`、`runBrowserReplPageRuntimeInjected`、`runTaberPageOverlayCommand` 整段序列化进页面。这些函数体内不能引用模块作用域的导入、常量或类型运行时值，只能用自身内部定义和页面全局；`lib/browser-repl-page-types.ts` 里的类型仅供编译期。后台的脚本注入通道也直接把同样几个函数当 `func` 传（`entrypoints/background.ts`），改签名要两边同步。\n- 注入命令要经 `jsonLiteralForInjectedCode`（`lib/browser-repl-code.ts`）序列化，它会转义 `<` 并拒绝不可序列化值；不要用裸 `JSON.stringify` 替换。\n- `browserjs` 的导航封禁靠 `normalizeBrowserJsCode` 的正则和 `createBrowserJsScript` 注入的守卫代理双层实现（`lib/browser-repl-code.ts`、`lib/browser-js-page-script.ts`）。守卫函数的形参列表与调用实参列表一一对应且很长，改动时必须同步两处顺序，错位会让页面代码拿到未经守卫的真对象。\n- 取消语义依赖取消键在三处一致：扩展侧生成并随命令下发、页面侧监听同名消息、后台记住已取消的键（`lib/browser-repl.ts`、`lib/browser-repl-page-runtime.ts`、`entrypoints/background.ts`）。`requiresScriptingCancel` 列出的命令必须走后台通道，把新的长等待 helper 加进去，否则中止会等到超时。\n- 元素编号只在单次调用内有效，`refs` 随控制器运行结束即丢；跨调用复用编号会报未知编号。跨调用要传选择器，不要试图让编号持久化。\n- 调试协议相关分支全部由构建期开关 `DEBUGGER_ENABLED`（`lib/runtime-flags.ts`）保护，上架版必须保持没有 CDP 兜底：新增兜底路径要放在同一个开关下（ADR 0002）。\n- 沙箱页是扩展内的独立文档，不要往里加任何扩展 API 或 DOM 访问；它的价值正是「模型代码没有能力」，能力一律以 helper 形式由父页面提供。\n",
    "modules/build-verify.md": "---\nsources:\n  - wxt.config.ts 0679a4e99991 defineConfig outDirTemplate optional_host_permissions __TABER_ENABLE_DEBUGGER__ TABER_ENABLE_DEBUGGER minimum_chrome_version\n  - package.json fd8b3922fe62 test:ci test:ci:full test:ci:runtime test:unit test:e2e build:chrome:debug zip:chrome\n  - tsconfig.json 8bb8b33e2824 allowImportingTsExtensions paths\n  - pnpm-workspace.yaml 7c9e86d5bc3e onlyBuiltDependencies\n  - scripts/verify-build.mjs eeb6e4e0c834 verifyExtension verifyLocalizedDescriptions entryScriptBytes MAX_INITIAL_ENTRY_BYTES requiredPermissions\n  - scripts/build-debug-extension.mjs 1dfa590ffb7a TABER_DEBUG_ARTIFACT TABER_ENABLE_DEBUGGER\n  - scripts/run-runtime-smoke-if-configured.mjs 9123522a3de3 smokeCommands acquireRuntimeLock assertProductionBuildOutput runtimeExtensionDir\n  - scripts/runtime-smoke-guard.mjs 677c3cb7bc6d markRuntimeSmokeBuild assertRuntimeSmokeTarget RUNTIME_SMOKE_PAGE\n  - scripts/runtime-browser.mjs e9b2fcc707eb prepareRuntimeBrowser findRuntimeBrowserApp findTaberExtensionId\n  - scripts/test-e2e-scenarios.ts 5099628bcf83 runFiveMvpScenarios testFixedToolRegistration testPersistedRecovery createE2EHarness\n  - scripts/dump-session-events.ts 53dda40d8480 connectTaberTarget dumpSession listSessions\n  - scripts/use-test-ci.mjs 498389b2479c\ncovers:\n  - wxt.config.ts\n  - tsconfig.json\n  - package.json\n  - pnpm-workspace.yaml\n  - scripts/\n---\n\n# 构建与验证工具链\n\n## 职责\n\n把源码打包成能装进 Chrome 和 Edge 的扩展包，并在每次改动后按层次证明它没坏。\n\n构建侧解决三件事：产出上架用的正式包（只申请必要权限，站点访问留给用户在需要时授权）；产出带调试能力的开发包（多一个可以直接驱动浏览器底层协议的权限，输出到独立目录，不会被误当成上架包）；打包成压缩档供发布。\n\n验证侧是一条从便宜到昂贵的链：先做类型和模板检查，再跑纯内存的单元测试，再跑一整套模拟浏览器的端到端场景，再校验真实构建产物的清单和体积，最后才在真浏览器里把扩展装起来点一遍。日常改动只需要前几层，发版前才跑到最后一层。另外还有一条独立的诊断路径：把某次任务在扩展本地库里留下的完整事件流导出成文件，供人或 agent 直接读。\n\n## 对外接口\n\n- 构建配置集中在 `wxt.config.ts`：清单里的权限、图标、快捷键、侧边栏与沙箱入口、`optional_host_permissions`、`minimum_chrome_version` 都在这里定义；`TABER_ENABLE_DEBUGGER=1` 同时打开 `debugger` 权限和编译期常量 `__TABER_ENABLE_DEBUGGER__`，`TABER_DEBUG_ARTIFACT=1` 与 `TABER_OUT_DIR_TEMPLATE` 决定产物目录名。\n- 路径别名 `$lib` 在 `wxt.config.ts`（Vite `resolve.alias`）与 `tsconfig.json`（`paths`）两处各写一份，缺一编译或类型检查会断；`allowImportingTsExtensions` 让脚本能直接 `import '../lib/x.ts'`。`exclude` 把 `landing` 挡在根类型检查外——它是自带 SvelteKit 配置与同名 `$lib` 别名的独立子项目，自己跑 `pnpm check`。\n- `package.json` 是所有入口的事实源：`build:chrome` / `build:edge`、`build:chrome:debug` / `build:edge:debug`、`zip:chrome`、`check`、`test:unit`、`test:e2e`、`test:database-integration`、`test:ci`、`test:ci:runtime`、`test:ci:full`，以及单项冒烟 `test:extension` / `test:browser-repl:runtime` / `test:sidepanel:smoke`。`pnpm test` 被 `scripts/use-test-ci.mjs` 故意做成失败并提示改用 `test:ci`。\n- `pnpm-workspace.yaml` 只声明单包工作区和 `onlyBuiltDependencies`（`esbuild`、`spawn-sync`），没有子包。\n- 产物校验：`scripts/verify-build.mjs <dir...> [--debugger]`，`verifyExtension` 断言清单版本、本地化描述（`verifyLocalizedDescriptions`，中英各一条且不超 132 字符）、必需权限集合、`host_permissions` 不含 `<all_urls>`、可选主机权限齐备、`debugger` 权限与期望一致，并用 `entryScriptBytes` 卡住 AgentHost 与侧边栏首包各 500 KB（`MAX_INITIAL_ENTRY_BYTES`）。\n- debug 构建：`scripts/build-debug-extension.mjs <chrome|edge>` 带两个环境变量调 WXT，产物落在 `.output/<browser>-mv3-dev`。\n- 冒烟总入口：`scripts/run-runtime-smoke-if-configured.mjs`，`--required` 表示不可跳过，`--only=extension,browser-repl,sidepanel` 选子集（`smokeCommands`）；它负责构建、加锁、起浏览器、依次跑子脚本。\n- 共享浏览器：`scripts/runtime-browser.mjs` 暴露 `prepareRuntimeBrowser` / `findRuntimeBrowserApp` / `findTaberExtensionId`；子冒烟脚本一律以 `allowLaunch: false` 附着，不自己开浏览器。\n- 破坏性防护：`scripts/runtime-smoke-guard.mjs` 的 `markRuntimeSmokeBuild` / `assertRuntimeSmokeTarget` / `RUNTIME_SMOKE_PAGE`。\n- 诊断：`scripts/dump-session-events.ts`（不带参列会话，带会话号导出 JSONL 到 `.tmp/`），`scripts/benchmark-agent-event-projection.ts` 量事件投影耗时。\n\n## 数据怎么流\n\n正式构建把源码编译进输出目录，清单里只写运行必需的那几项权限，加上登录订阅要用的几个固定域名；对任意站点的访问声明为可选，等用户在任务里授权。调试构建走同一条流水线，但打开一个编译期开关，让底层协议工具在代码里可见、在清单里有权限，并换一个目录名，从源头上避免和上架包混淆。产物校验脚本随后打开输出目录，逐项对照清单、本地化描述文件和两个入口脚本的体积，任何一项不符就让命令失败。\n\n验证按代价分层。类型与模板检查最快；单元测试用节点原生跑三十多个纯逻辑用例，覆盖工具、供应商、鉴权、事件投影和侧边栏视图；端到端场景在内存里搭一整套假浏览器（假页面、假标签页、假消息通道、内存数据库），把六个固定工具接进去，跑通五条基线任务、站点技能循环、文件工作区循环，最后重开数据库验证事件流能把界面还原回去——这一层是那五条任务行为的事实源。再往上是真实构建产物校验。最后才是运行时冒烟：真的把扩展装进浏览器，验证侧边栏能渲染、后台能开关离屏文档、页面执行环境能操作真实网页。\n\n运行时冒烟本身有一套自保。它先用生产配置构建一份隔离产物，确认里面没有调试权限；然后给这份构建写一个一次性版本标记，并放一个空白页面作为受控落脚点；子脚本在做任何破坏性操作（清库、撤权限）之前必须先核对这个标记，对不上就直接失败——这是为了防止有人把清库操作指到日常浏览器里的正式扩展上。整个过程由一个带持有者信息的锁文件串行化，锁会检查持有进程是否还活着来清理陈旧锁，结束时按\"关浏览器 → 还原构建标记 → 释放锁\"的顺序收尾。\n\n诊断路径与验证链无关：脚本通过调试端口连上一个装了扩展的浏览器，认出扩展目标后直接读它本地库里的会话与事件，排序后写成每行一个事件的文件。它只能读到所连那个浏览器实例的数据，用户日常浏览器里的历史会话拿不到，那种情况走侧边栏里的导出功能。\n\n## 改动指南\n\n- 权限、清单字段、体积预算改一处不够：`wxt.config.ts` 与 `scripts/verify-build.mjs`（`requiredPermissions`、`verifyLocalizedDescriptions` 里的中英描述常量、`MAX_INITIAL_ENTRY_BYTES`）必须同步，否则 `test:ci` 在构建校验步失败。描述文案还受 132 字符上限约束。\n- 新增单元测试必须手动追加到 `package.json` 的 `test:unit` 串联命令里，没有自动发现；文件名不进这条链就等于没跑。\n- 端到端脚本 `scripts/test-e2e-scenarios.ts` 里 `testFixedToolRegistration` 硬编码了六个顶层工具名，增删工具要一并改，否则整条 `test:e2e` 直接断言失败。\n- `scripts/build-debug-extension.mjs` 产物在 `.output/<browser>-mv3-dev`，与 WXT dev server 的默认目录同名；`docs/development.md` 中\"debug 构建先写 `.output/chrome-mv3` 再镜像\"的描述与当前脚本实现不一致，以脚本为准。\n- 任何破坏性冒烟只能经 `scripts/run-runtime-smoke-if-configured.mjs` 启动，直接执行 `scripts/smoke-sidepanel-ui.mjs` 会被 `assertRuntimeSmokeTarget` 拒绝。冒烟固定使用隔离目录 `.output/chrome-mv3-runtime`，不要改成复用发布目录。\n- 运行时冒烟的前置条件是本机存在 `/Applications/Google Chrome.app`（或设置 `TABER_CDP_ORIGIN` / `TABER_EXTENSION_ID` 复用已有实例）；`test:ci:runtime` 缺条件时安静跳过，`test:ci:full` 带 `--required` 会直接失败。`TABER_BROWSER_APP` / `TABER_HEADED` 只用于本地可视调试。Chrome 137 起 `--load-extension` 失效，加载走调试协议，别退回命令行参数。\n- 单条冒烟超过 180 秒会被总入口按进程组杀掉并判失败，写新冒烟时注意别做长等待。\n- `scripts/spikes/` 是一次性验证脚本，不在任何验证命令里，也不要当作事实源。\n- 架构 wiki 的校验器 `docs/architecture/verify.mjs` 已挂进 `test:ci`；改动代码后按它打印的 diff 更新 wiki，再跑 `--sync` 刷新哈希。\n",
    "modules/database.md": "---\nsources:\n  - lib/db.ts 5e8b63382cda TaberDatabase database initializeDatabase createSession appendToolRun appendAgentEvent readSessionSnapshot readSelectedSessionSnapshot selectSessionSnapshot listSessions readSessionRetentionLimit setSessionRetentionLimit pruneOldSessions selectPrunableSessionIds selectedSessionIdKey sessionRetentionLimitKey UNLIMITED_SESSION_RETENTION DEFAULT_SESSION_LIMIT\n  - lib/provider-config-flow.ts 91dd8cf89de0 createProviderConnection\n  - lib/skills.ts ced47471c1d1 saveSkill\n  - lib/workspace-files.ts 7eb961fd6d0c writeSessionFile listSessionFiles\n  - lib/agent-event-projection.ts 1f68d156756e projectAgentEvents\n  - docs/local-database.md d8e7948ae9c0\ncovers:\n  - lib/db.ts\n---\n\n# 本地 Agent 数据库\n\n## 职责\n\nTaber 把所有本地状态放进浏览器里一个名叫 taber 的数据库，不再散落到扩展存储：用户配置的模型供应商、登录凭据、可选模型列表、每一次对话及其完整事件流、Agent 执行过的工具记录、站点技能、会话工作区里的文件，以及零散的开关型设置，都在同一处。这样做的直接好处是，侧边栏关掉再打开、扩展被浏览器回收再唤醒，都能凭数据库把界面原样重建，不需要任何常驻内存的状态。\n\n本模块自己只管两件事：把数据的形状和版本演进定死，以及提供\"新建会话、往会话里追加记录、把会话整份读出来\"这一组窄接口。会话之外的领域（供应商、技能、文件）只借用它的表定义，具体写入规则由各自的领域模块负责。\n\n历史记录不是无限攒着的：默认只保留最近 30 个未置顶的会话，更旧的连同其工具记录、事件和文件一起删除；置顶的会话永远不会被清理，用户也可以把上限改成\"不限\"。清理时机是新建会话之后和用户调整上限之后，所以数据库规模跟着使用节奏自然收敛，不需要后台定时任务。\n\n## 对外接口\n\n- 表定义与实体类型集中在 `TaberDatabase`（`lib/db.ts`）：`providers` / `providerCredentials` / `models` 承载供应商配置，`sessions` / `toolRuns` / `agentEvents` 承载对话，`skills` 存站点技能，`files` 存会话工作区文件，`settings` 是全局键值表。单例 `database` 与 `initializeDatabase` 是唯一的连接入口。\n- 会话读写只暴露 `createSession` / `appendToolRun` / `appendAgentEvent` / `readSessionSnapshot` / `readLatestSessionSnapshot` / `readSelectedSessionSnapshot` / `selectSessionSnapshot` / `setSelectedSessionId` / `listSessions`（`lib/db.ts`）。两个 append 都在一个事务里校验会话存在、写入记录并刷新 `updatedAt`，会话不存在直接抛错，不会静默丢记录。\n- 保留策略走 `readSessionRetentionLimit` / `setSessionRetentionLimit` / `pruneOldSessions`，纯函数 `selectPrunableSessionIds` 决定该删哪些 id（`lib/db.ts`）。上限值只接受正整数或常量 `UNLIMITED_SESSION_RETENTION`，非法值抛错。\n- 两个约定键由本模块导出并被其它模块共用：`selectedSessionIdKey`、`sessionRetentionLimitKey`（`lib/db.ts`）；`DEFAULT_SESSION_LIMIT` 是默认 30。\n- 其它领域绕开会话接口直接操作自己的表：供应商/模型/凭据写入统一在 `createProviderConnection` 等流程里（`lib/provider-config-flow.ts`），技能在 `saveSkill`（`lib/skills.ts`），工作区文件在 `writeSessionFile` / `listSessionFiles`（`lib/workspace-files.ts`）。`settings` 表是共享的，前台模式、个人资料、模型目录缓存、技能种子等各自持有自己的键。\n\n## 数据怎么流\n\n任务开始时先建会话，紧接着触发一次清理；任务运行期间 Agent 每产生一步就往事件表追加一条，工具调用另外记一条运行记录，两种写入都会把会话的更新时间往前推，于是\"最近使用\"的排序自动成立。侧边栏不参与写入决策，它只订阅并按事件顺序渲染。\n\n侧边栏打开时先看设置里记的\"当前选中会话\"：有记录就读那一个，明确记成空表示用户想要一段新的空白对话，完全没有这条记录（老库）则退回到最近更新的那个会话。读出来的快照包含会话本身、按时间排序的工具记录和按写入顺序排序的事件，界面靠 `projectAgentEvents`（`lib/agent-event-projection.ts`）把事件流折算成对话气泡、工具时间线、来源和图片。事件顺序用自增主键而非时间戳排序，因此同一毫秒内的连续事件也不会乱序。\n\n用户在历史列表里切换会话时，写设置和读快照发生在同一个事务里，保证\"最后一次点击\"胜出，不会出现选中了 A 却渲染出 B 的事件缺口。清理同样是单事务：先并行删掉目标会话的工具记录、事件和文件，再删会话本身，不会留下没有归属的孤儿数据。\n\n## 改动指南\n\n- 加表或加索引必须新开一个 `this.version(n).stores({...})`（`lib/db.ts`），不要改动已发布版本的定义；Dexie 只对声明过的字段建索引，新增查询条件前先确认该字段在 stores 字符串里。\n- 迁移里如果需要复用别处的算法，要像 `migrationSkillSlug` 那样把当时的规则冻结拷贝进来。它是 v4 修复迁移用的技能名转路径规则的快照，故意不 import `lib/skills.ts`——否则以后改了 slug 规则，历史迁移的行为会跟着变，同一个库在不同版本上迁移出不同结果。\n- 会话相关的写入一律走本模块的 append 函数，不要在业务模块里直接 `database.agentEvents.add`：`updatedAt` 的刷新和会话存在性校验都挂在这里，绕过去会破坏排序与清理判断。\n- 事件是追加式历史，不要就地改写或删除已有事件（上下文压缩也是追加一条压缩事件，不是删旧的）；任何\"修正\"都应该表达成新事件。\n- 新增 `settings` 键时把键名常量放在使用它的领域模块里、并只由该模块读写；这张表没有 schema 约束，多个入口写同一个键会直接互相覆盖。\n- 改保留策略时优先改 `selectPrunableSessionIds` 这个纯函数（`lib/db.ts`），它不碰数据库、可直接单测；同时记得置顶会话不占用配额，上限只对未置顶会话计数。\n- 清理事务已经覆盖 `toolRuns` / `agentEvents` / `files` 三张按 `sessionId` 关联的表，将来若新增挂在会话下的表，必须同步加进 `pruneOldSessions` 的事务和删除列表，否则数据会永久残留。\n",
    "modules/document-extraction.md": "---\nsources:\n  - lib/get-document.ts 388bbc753cfa createGetDocumentController parseGetDocumentInput getDocumentInputJsonSchema ARTICLE_CONTENT_LIMIT PAGE_CONTENT_LIMIT MAX_TABLES pdfBytesToText parseArticleHtml workspaceFileText pageResultHints\n  - lib/get-document-page.ts 43868f104060 extractDocumentFromPage PageDocument PageDocumentFrame\n  - lib/document-markdown.ts 02b85453483f extractDocumentMarkdownFromHtml extractDocumentMarkdown elementToMarkdown extractTables htmlToMarkdown\n  - lib/extract-image.ts ba658f6362f3 createExtractImageController captureVisibleTarget extractImageFromPage parseExtractImageInput extractImageInputJsonSchema\ncovers:\n  - lib/get-document.ts\n  - lib/get-document-page.ts\n  - lib/document-markdown.ts\n  - lib/extract-image.ts\n---\n\n# 文档与视觉提取\n\n## 职责\n\n这个模块回答 Agent 的两个问题：这一页（或这个链接、这份文件）写了什么，以及现在屏幕上、页面里的图长什么样。\n\n读文本一共五种来源：受控标签页的正文、受控标签页的全文、用户在页面上的选区、一个远程网址，以及工作区里已上传或已生成的文件。远程网址是优先路径——公开静态内容直接抓取，不占用标签页、不打断用户、多个链接可以并行；只有需要登录态或前端渲染后才成型的内容，才回到受控标签页。网址来源同时认 PDF：按响应类型或链接后缀识别，走文本抽取而不是 HTML 解析。工作区文件按类型分流为 PDF 文本、Word 文本或纯文本。\n\n正文模式先用可读性算法剥掉导航和广告，失败时自动退回全文并在结果里标明这是退化结果，不假装成功。抽取时会把开放的 shadow DOM 内容并进文档、把同源 iframe 的可见文字单独列在旁边、把跨源 iframe 只登记为元数据并说明读不到的原因；如果页面看起来是个还没渲染出内容的前端框架壳子，结果会附一条提示，让模型改用运行时读取手段而不是反复重试。取不到内容、抓不到网址、没有选区、找不到文件都返回带重试建议的可恢复失败。\n\n看图有四种方式：截当前可见视口、读页面里图片元素的地址、把画布像素导出、读元素的 CSS 背景图地址。视口截图是唯一必须让目标标签页真正处于激活状态的操作——浏览器只允许截活动标签页。\n\n## 对外接口\n\n- 文本提取入口是 `createGetDocumentController`（`lib/get-document.ts`），调用方注入四件事：拿当前标签页、在标签页里执行取页脚本、抓远程 URL、读工作区文件；模型侧的参数形状与校验来自同文件的 `getDocumentInputJsonSchema` 和 `parseGetDocumentInput`。\n- 页内脚本只有 `extractDocumentFromPage`（`lib/get-document-page.ts`），返回 `PageDocument`：标题、URL、选区、整页 HTML 快照、可见文本、交互元素计数、SPA 判定、边界提示和 `PageDocumentFrame[]`。它被序列化后注入页面执行，因此内部全部是自包含的闭包函数，不能引用模块作用域的值。\n- HTML→Markdown 与表格抽取集中在 `lib/document-markdown.ts`：`extractDocumentMarkdownFromHtml` / `extractDocumentMarkdown` 一次产出正文候选、全文 Markdown 和 `ExtractedTable[]`，`htmlToMarkdown`、`elementToMarkdown`、`extractTables` 供单点复用。\n- 截长阈值是三个常量：`ARTICLE_CONTENT_LIMIT`、`PAGE_CONTENT_LIMIT`、`MAX_TABLES`（`lib/get-document.ts`）。\n- 文本侧的失败码固定为 `NO_SELECTION` / `NO_READABLE_CONTENT` / `REMOTE_FETCH_FAILED` / `PAGE_ACCESS_REQUIRED` / `FILE_NOT_FOUND`；图像侧为 `ELEMENT_NOT_FOUND` / `INVALID_SELECTOR` / `SCREENSHOT_UNAVAILABLE` / `PAGE_ACCESS_REQUIRED`。两侧都以判别联合表达“成功字段与失败字段互斥”，新增字段要同时补上另一分支的 `never`。\n- PDF 文本抽取由 `pdfBytesToText`、Word 文本由 `workspaceFileText` 转交文档导出模块处理；正文解析 `parseArticleHtml` 与可读性库都是动态 import，只在真正用到时才加载。\n- 图像入口是 `createExtractImageController`（`lib/extract-image.ts`），viewport 分支走注入的 `captureVisibleTab`，其余三种注入 `extractImageFromPage` 在页内执行；`captureVisibleTarget` 单独封装了“激活目标页 → 等一帧 → 截图 → 按需还原原标签页”的时序，供 background 复用。\n\n## 数据怎么流\n\n受控页读取先要到目标标签页，再把取页脚本注入页面执行。脚本只做一件事：把当前 DOM 拍成快照（HTML 字符串、可见文本、frame 摘要）传回来，不做任何解析。真正的解析——可读性判定、Markdown 转换、表格抽取——全部发生在 AgentHost 侧，用一个新建的 DOM 副本来做。这样解析代码不进用户页面、不受页面脚本干扰，也不必被序列化注入。\n\n选区模式最短：快照里有选区就直接返回，没有就报错并建议改用全文模式。全文模式取整页 Markdown，若为空则退回可见文本。正文模式先跑可读性解析，拿不到就依次退回正文候选、全文 Markdown、可见文本，并打上退化标记。表格只有显式请求时才随结果返回，超过上限截断并标注。\n\n远程网址由 AgentHost 直接发起抓取（受已授权的站点权限约束），按内容类型分流 PDF 与 HTML，跟随重定向后以最终地址作为结果 URL；抓取失败会把原始原因（状态码、CORS、超时）如实带回结果，因为模型需要它来决定重试、改用浏览器还是放弃。任务中止信号原样抛出，不会被伪装成抓取失败。\n\n同源 iframe 的正文不会被拌进主内容，而是单独列在结果的 frame 数组里；判断“这一页有没有可读内容”时会把它算进去，所以主体为空但 iframe 有字的页面仍算成功。提示信息来自两处并去重：页面侧关于 shadow DOM、iframe 边界的说明，以及 AgentHost 侧比对可见文本长度、交互元素数量后补的 SPA 空壳判断。\n\n结果内容超过对应上限即按上限截断并置位截断标志。更长的内容如何落到工作区文件、只回传预览与路径，是工具接线层的处理，不在本模块。\n\n图像结果分两类形状：视口和画布回传实际像素的 data URL，图片元素和背景图默认只回传绝对化后的地址，让下游按需下载；只有本来就是内联 data URL 时才直接带回数据。参数解析会丢弃非 JPEG 请求上附带的质量值——模型常拿它当占位符填。\n\n视口截图是这里唯一会改变浏览器可见状态的操作：截图前若目标页不是活动页则先激活并等待渲染，截图前后各校验一次活动标签页仍是目标页——中途被用户切走就判定失败而不是返回错的画面；后台模式下截完还原用户原来的标签页，前台模式保持目标页在前。页内三种图像来源不激活标签页：图片和背景图只回地址（data: 形式的直接原样返回），画布按请求格式导出像素。\n\n## 改动指南\n\n- 页内脚本 `extractDocumentFromPage`、`extractImageFromPage` 通过 `browser.scripting.executeScript` 的函数序列化注入，写法有硬约束：不能引用外部模块符号、不能用编译后残留的辅助引用，新增逻辑一律写成函数体内的内部函数。\n- 新增文本来源时守住分层：页内只加快照字段，解析放 `lib/document-markdown.ts` 或 `lib/get-document.ts`；不要把 Markdown 转换挪进页面脚本。\n- 阈值只有 `ARTICLE_CONTENT_LIMIT` / `PAGE_CONTENT_LIMIT` / `MAX_TABLES` 三个事实源；调大之前先确认外层的溢出到工作区逻辑仍然生效，否则会直接撑爆模型上下文。\n- 当前不存在按页/按偏移的分页读取参数；`getDocumentInputJsonSchema` 是模型可见参数的唯一事实源，加参数必须同步 `parseGetDocumentInput`（严格拒绝未知字段与错类型）。\n- 失败一律走带 `code` 和 `retryHint` 的可恢复结果，不要静默返回空内容；页面访问权限缺失单独一类，指向设置里的浏览器控制授权。\n- 改视口截图务必保留 `captureVisibleTarget` 的两次活动页校验和还原分支：去掉任何一处，都会在用户切标签页时返回别的页面的截图，或把用户的标签页永久切走。\n- 截图返回的宽高是 CSS 像素的视口尺寸，是页面操作工具坐标的参照系；换成截图位图尺寸会让点击坐标在高 DPI 屏上系统性偏移。\n- 背景与取舍见 `docs/adr/0010`（轻量解析器）与 `docs/adr/0017`（fetch-first）。\n",
    "modules/event-log.md": "---\nsources:\n  - lib/agent-event-projection.ts 1f68d156756e projectAgentEvents projectTaskGroups sourceFromBrowserContext AgentEventProjection ProjectedTaskGroup ProjectedTimelineEntry ProjectedSource ProjectedImage\n  - lib/agent-tool-projection.ts 5cfd7920d664 projectToolTimeline toolForEvent ProjectedToolRun\n  - lib/agent-event-text.ts 5806b48fba83 projectToolEvidence formatPayload formatRawEvidence hideReasoningText domainFromUrl\n  - lib/sidepanel-view.ts 6f17efdad84b mergeLiveAgentEvent groupTurnParts activityGroupStatus timelineFromProjection sourcesFromProjection imagePreviewFromProjection agentEventChangesWorkspace deriveTimeline\n  - lib/sidepanel-tool-presentation.ts edb01232e733 toolHeaderSummary rawToolDetails\n  - lib/session-export.ts 2d0346600ebc buildSessionExportJsonl sessionExportFileName SESSION_EXPORT_MAX_STRING_CHARS\n  - lib/agent-events.ts 4f4a3b53f33e deriveTaskState TaskState\n  - lib/db.ts 5e8b63382cda AgentEvent appendAgentEvent readSessionSnapshot\ncovers:\n  - lib/agent-events.ts\n  - lib/agent-event-projection.ts\n  - lib/agent-event-text.ts\n  - lib/agent-tool-projection.ts\n  - lib/sidepanel-view.ts\n  - lib/sidepanel-tool-presentation.ts\n  - lib/session-export.ts\n---\n\n# Agent 事件日志与投影\n\n## 职责\n\n任务执行过程中发生的一切都以一条条事件写进本地数据库：任务开始、目标标签页切换、任务完成/失败/被用户停止、助手正文的逐字流式输出、模型的思考过程、每一次工具调用的输入片段、开始、成功或失败，以及上下文压缩标记。事件只追加、不修改，带自增序号和时间戳，序号就是权威顺序。\n\n侧边栏本身不保存任务状态。它打开时把当前会话的全部事件读出来重放一遍，得到「现在应该显示什么」，再订阅后续新事件继续追加。因此侧边栏中途关闭、重开、甚至换一个窗口打开，看到的画面都一样，后台跑过的每一步都还在。\n\n投影层负责把这条扁平的事件流解释成人能看的四类东西：按任务切分的分组（含提示词、状态、证据摘要），用户与助手交替的对话，工具调用的时间线，以及从工具结果里顺带捞出来的来源链接和最新截图。同一套投影还给模型自己复用——把历史压成给下一轮用的上下文摘要靠的是同样的证据文本。\n\n## 对外接口\n\n- 投影主入口：`projectAgentEvents`（整包投影）与 `projectTaskGroups`（只要任务分组，支持从某个事件序号之后增量取），加上给当前标签页构造来源条目的 `sourceFromBrowserContext`（`lib/agent-event-projection.ts`）。类型 `AgentEventProjection` 是唯一的投影结果契约。\n- 工具时间线单独成域：`projectToolTimeline` 把 `tool.*` 系列事件合并成 `ProjectedToolRun`，`toolForEvent` 让任务分组按事件反查已合并的那一次调用（`lib/agent-tool-projection.ts`）。\n- 文本处理域只暴露 `projectToolEvidence`（工具结果摘要）、`formatPayload`/`formatRawEvidence`（UI 展开时的载荷格式化）、`hideReasoningText`、`domainFromUrl`（`lib/agent-event-text.ts`）。projection 与 sidepanel-view 都只是把它们再导出，不重复实现。\n- 侧边栏视图模型：`timelineFromProjection`/`deriveTimeline`、`conversationFromProjection`、`toolTimelineFromProjection`、`sourcesFromProjection`、`imagePreviewFromProjection`、`sidebarTaskViewFromProjection`（`lib/sidepanel-view.ts`）。带 `derive*` 前缀的是「事件数组进、视图出」的便利包装，内部同样先跑 `projectAgentEvents`。\n- 实时增量与 UI 分组同样在 `lib/sidepanel-view.ts`：`mergeLiveAgentEvent` 按序号插入新事件并去重，`groupTurnParts` 把连续的工具/思考折叠成活动块，`activePart`/`activityGroupStatus`/`activityStartedAt`/`activityEndedAt` 给折叠块算标题与状态，`agentEventChangesWorkspace` 判断是否需要刷新文件面板。\n- 工具卡文案：`toolHeaderSummary` 生成一行人话摘要，`rawToolDetails` 生成展开后的原始载荷（`lib/sidepanel-tool-presentation.ts`），两者都吃已投影的工具项而非裸事件。\n- 极简任务态：`deriveTaskState` 只回答 idle/running，用于不需要完整视图的调用方（`lib/agent-events.ts`）。\n- 导出：`buildSessionExportJsonl`、`sessionExportFileName`、`SESSION_EXPORT_MAX_STRING_CHARS`（`lib/session-export.ts`）。\n\n## 数据怎么流\n\n投影先按事件序号排序，然后一遍扫描切任务分组：遇到任务开始就开一个新组，之后的事件归入当前组，直到完成、失败或取消这三种终止事件之一落地才收口；带着别的任务编号的事件会被跳过，上下文压缩事件不参与分组。终止时顺手记下最终回复文本或错误原因，用于状态条和兜底展示。\n\n对话按流式语义拼装：同一条消息编号的多次追加合并成一条消息，若某个任务已经有过流式正文，任务完成事件里的完整文本就不再重复成第二条消息。工具调用同理，按工具调用编号把「输入开始/输入分片/输入完成/开始/完成或失败」合并成一次调用，只有没有调用编号时才退化成按工具名配对，最终得到状态、耗时、输入、输出或错误。\n\n时间线是两级结构：用户提示词是一条独立条目，之后同一任务里的工具、思考、助手正文按发生顺序放进同一个助手回合。正文连续的片段会被拼在一起，中间插入工具或思考时切段，让读者看到「说了几句 → 做了几件事 → 又说了几句」。任务整体失败且什么都没产出时，回合里放一条错误文本，不留空白。任何没能归入任务的历史工具调用会作为独立回合兜底渲染，不会凭空消失。\n\n侧边栏拿到时间线后再做一层折叠：连续的工具和思考并成一个活动块，块的状态取自最后一步——还在跑显示进行中，最后一步失败显示失败，返回可恢复错误（结果里带失败标记）显示警告，任务本身失败或被停止则整块继承任务状态。折叠块默认只显示一行摘要，展开才看到每步的输入输出。\n\n来源栏和图片预览是从工具成功结果里顺带提取的：递归扫描输出中形如 url/href/source 的字符串字段，取 http(s) 链接，附上标题、域名和图标，去重后最多留五条，当前受控标签页排在最前；最近一次成功截图作为图片预览，附来源与尺寸标签。\n\n思考原文有明确的脱敏边界：所有进入 UI 或摘要的文本都会先剥掉 think 标签包裹的内容和标为 cot/thinking/reasoning 的代码块，替换成占位标记；结构化载荷里键名带这些词的字段整体替换为隐藏标记，但带 summary 的字段保留。摘要生成时还会丢掉 base64 与截图数据、截断超长文本、限制数组和对象宽度，避免把整页 DOM 或图片塞进界面和模型上下文。\n\n诊断走导出：把一个会话的全部事件按每行一个 JSON 写成 jsonl，超长字符串截断并标注原始长度，截图 dataUrl 只留开头一小段，文件名带会话号和时间。导出的是原始事件而非投影结果，所以能用来复现投影本身的问题。\n\n## 改动指南\n\n- 新增事件类型时，先确认三处消费方是否都要跟进：任务分组（是否算终止事件、是否要跳过）、时间线回合（`createTaskAssistantTurn` 里按前缀分派 `reasoning.` / `tool.`）、以及证据摘要 `projectToolEvidence`。只加写入端会让事件在 UI 上静默丢失。\n- 事件顺序一律以自增 `id` 为准，不要改用 `createdAt` 排序：同一毫秒内多条事件常见，`mergeLiveAgentEvent` 与时间线排序都依赖 `id` 单调（`lib/sidepanel-view.ts`）。\n- 任何新的文本或载荷出口都必须过 `hideReasoningText` 或 `formatRawEvidence`/`formatPayload`，不要直接把 `event.payload` 渲染到 UI 或塞给模型；脱敏规则集中在 `lib/agent-event-text.ts`，改正则时同时覆盖字符串路径和对象键路径两条分支。\n- 工具摘要有两套，别混用：给模型看的一行证据在 `projectToolEvidence`，给用户看的卡片标题在 `toolHeaderSummary`（`lib/sidepanel-tool-presentation.ts`，需要 i18n 文案）。新增工具时两处都要加分支，否则模型上下文里只剩裸 JSON 片段。\n- 「结果里 ok 为 false」表示可恢复失败，与 `tool.failed` 事件是两回事：前者仍是完成事件，来源提取会跳过它，UI 显示为警告而非失败。新工具的软失败请沿用这个约定，不要抛异常。\n- 侧边栏不得引入本地任务状态。需要新的 UI 状态时，先想清楚它能否从事件流推出；确实推不出的（如快捷操作、设置分页）才放在视图层，且不参与重放。\n- 导出面向 agent 阅读，保持一行一事件、不做投影、不做重排；调整截断阈值时同步 `docs/debugging.md` 里对导出格式的描述。\n",
    "modules/landing.md": "---\nsources:\n  - landing/README.md 96e118c80ed4\n  - landing/svelte.config.js 31d3ab77ee43 adapter-static prerender\n  - landing/src/routes/+page.svelte 8c49959f758a\n  - landing/src/lib/i18n.ts dc243df58224 I18N Lang\n  - landing/src/lib/lang.svelte.ts 66c641fcef4f langState detectLang\n  - landing/src/lib/download.ts d5f68de1c505 resolveDownloadUrl DOWNLOAD_FALLBACK\n  - landing/src/lib/motion.ts bb588609c1ef prefersReducedMotion canRunScrollFX\n  - landing/vercel.json c1b7bd69c7dd\ncovers:\n  - landing/\n---\n\n# 营销落地页\n\n## 职责\n\n产品对外的介绍站点 https://taber.im：讲清 Taber 是什么、给出可信的演示证据、把访客送到下载。它和扩展本身完全独立——独立的依赖、独立的构建、独立的部署，扩展代码不引用它，它也不引用扩展代码。\n\n页面是一页式长滚动：主视觉里有一个循环播放的 Agent 任务模拟器，往下依次是任务跑马灯、实拍演示视频、产品截图与信任点、站点技能、模型与隐私说明、原理介绍和安装引导。全站中英双语，语言选择记在浏览器本地，首帧之前就决定好，不会出现语言闪烁。\n\n下载按钮不写死链接，而是实时去 GitHub 查最新发行版里的 Chrome 扩展包；查不到就退回发行版页面，任何情况下按钮都不会失效。\n\n页面重动效，但对性能和无障碍有明确底线：用户开了减少动态效果、或在触屏/窄屏上，滚动视差与 3D 倾斜整体关闭，动画循环在静止时停转。\n\n## 对外接口\n\n对外只有一个产物：预渲染后的静态站点。`landing/svelte.config.js` 用 `adapter-static` 把全站预渲染进 `build/`，`landing/vercel.json` 指定构建命令、输出目录和不可变资源的缓存头，Vercel 项目以 `landing` 为根目录跟随主分支自动部署。\n\n内部三个稳定入口：文案与语言在 `landing/src/lib/i18n.ts`（`I18N` 词条表）与 `lang.svelte.ts`（全站语言单一事实源 `langState`、翻译函数 `t`）；产品常量与模拟器脚本在 `content.ts`；下载地址解析在 `download.ts` 的 `resolveDownloadUrl`（带内存缓存与并发去重）。动效开关集中在 `motion.ts` 的 `prefersReducedMotion` / `canRunScrollFX`。\n\n页面结构由 `src/routes/+page.svelte` 按顺序装配十来个区块组件（`src/lib/components/`），路由层只声明预渲染与末尾斜杠策略。静态资产放 `landing/static/assets/`。\n\n## 数据怎么流\n\n站点没有后端，绝大部分内容在构建时就固化进 HTML。运行时只有三件事会变：访客选的语言（存本地，改变后整页文案即时切换）、下载按钮首次点击或进入视口时向 GitHub 取一次最新版本链接、以及滚动位置驱动的视觉效果。\n\n没有任何访客数据被收集或回传。\n\n## 改动指南\n\n- 改文案先改 `i18n.ts` 的词条表，两种语言同时补齐；组件里不要写死中英文字符串。\n- 新增区块：写 `src/lib/components/<Name>.svelte`，再在 `+page.svelte` 里按位置插入，导航锚点在 `Nav.svelte`。\n- 动效相关改动必须过一遍降级路径：任何新的滚动/指针动效都要挂在 `motion.ts` 的开关后面，窄屏与减少动态效果下不能跑。\n- 依赖装在 `landing/` 自己的 `package.json` 里，不要提升到仓库根；本地开发在 `landing/` 目录内执行 `pnpm dev`，验证用 `pnpm check`。\n- 部署走推送到主分支的自动流程；只推静态产物的手工流程有 Vercel 根目录设置的坑，步骤见 `landing/README.md`。\n- 站点当前不进主仓的 CI 验证链（[构建与验证工具链](build-verify.md)只覆盖扩展），改完请至少本地跑一次构建。\n",
    "modules/provider-config.md": "---\nsources:\n  - lib/provider-config-flow.ts 91dd8cf89de0 createProviderConnection updateProviderConnection deleteProviderConnection selectModel readSelectedConfiguredModel reconcileSelectedModel assertProviderCredentialKind\n  - lib/provider-store.ts 83ea66f45c96 listProvidersWithModels sortModelsForDisplay getProviderApiKey getReasoningEffort setReasoningEffort reasoningProviderOptionsForModel testConnection maskApiKey\n  - lib/provider-kind.ts 9f68077a214b apiKeyProviderKind isOpenAIApiBaseURL OPENAI_API_BASE_URL\n  - lib/model-catalog.ts 3ab9669d6a18 builtinProviderPresets refreshModelCatalog mergeProviderCatalog readCachedModelCatalog isModelCatalogStale normalizeContextWindowTokens DEFAULT_CONTEXT_WINDOW_TOKENS\n  - lib/reasoning-effort.ts 4df8c65cec19 reasoningEffortLevels normalizeReasoningEffortForModel assertReasoningEffortSupported normalizeSupportedReasoningEfforts\n  - lib/openai-api-provider.ts b1a10c6a774c listOpenAIApiModelCatalog selectOpenAIApiModels fetchOpenAIApiModelIds modelInputFromPreset\n  - lib/openai-runtime.ts 435ed6ebf39a createOpenAIApiLanguageModel openAIProviderOptions\n  - lib/provider-settings-policy.ts 688b7d5c2ee9 showManualContextWindowInput\ncovers:\n  - lib/provider-store.ts\n  - lib/provider-config-flow.ts\n  - lib/provider-kind.ts\n  - lib/provider-settings-policy.ts\n  - lib/model-catalog.ts\n  - lib/reasoning-effort.ts\n  - lib/openai-api-provider.ts\n  - lib/openai-runtime.ts\n---\n\n# 模型供应商配置\n\n## 职责\n\n把「用户配了哪些模型服务、当前用哪个模型、用多大推理强度」这件事收敛成本地数据库里的一份事实，并保证这份事实随时可用：任何一次新增、修改、删除或退出登录之后，要么存在一个立刻能跑任务的选中模型，要么明确地没有选中模型，不会留下指向已删除模型或已失去凭据的服务的悬空选择。\n\n供应商在这里被统一成同一个形状：名称、接口地址、密钥、模型清单，模型再各自带自己的上下文窗口大小和支持的推理强度。四类供应商共享这个形状但来源不同——普通 OpenAI 兼容服务由用户手填，OpenAI 官方密钥的模型清单来自账号本身，ChatGPT 和 xAI 两种订阅登录的模型清单由登录流程写入（订阅登录本身见对应页面）。\n\n模型的能力元数据（上下文窗口、支持哪些推理强度）以模型记录为唯一事实源；界面只展示当前模型真正支持的推理强度，运行时遇到不支持的组合直接报错而不是悄悄降级到默认值。\n\n## 对外接口\n\n- 写操作全部走事务型流程域（`lib/provider-config-flow.ts`）：`createProviderConnection` / `updateProviderConnection` / `deleteProviderConnection` 负责连接的增删改，`selectModel` 负责切换选中模型，`readSelectedConfiguredModel` 给运行时取当前可用模型，`reconcileSelectedModel` 是所有写路径共用的收敛函数。订阅侧的 `saveOpenAICodexConnection` / `saveXaiSubConnection` / `signOutOpenAICodex` / `signOutXaiSub` 及 token 刷新写入也在这里。\n- 读操作与 UI 辅助集中在 `lib/provider-store.ts`：`listProvidersWithModels`（带凭据存在标记）、`sortModelsForDisplay`、`getProviderApiKey`、`getReasoningEffort` / `setReasoningEffort`、`testConnection`、`maskApiKey`。其中 `setSelectedModelId` 和 `deleteProviderCredential` 只是转发到流程域，不绕过事务。\n- 分类判定只在 `lib/provider-kind.ts`：`apiKeyProviderKind` 按 baseURL 决定 `openaiApiKey` 还是 `openaiCompatible`，判据是 `isOpenAIApiBaseURL`（origin 为 `https://api.openai.com` 且路径规范化后等于 `/v1`）。设置页是否显示手填上下文窗口输入框由 `showManualContextWindowInput`（`lib/provider-settings-policy.ts`）单独判定，只有 `openaiCompatible` 才显示。\n- 模型目录域 `lib/model-catalog.ts` 暴露 `builtinProviderPresets`、`refreshModelCatalog`、`readCachedModelCatalog`、`isModelCatalogStale`、`mergeProviderCatalog`、`findPresetModel`，以及归一化入口 `normalizeContextWindowTokens` 和默认值 `DEFAULT_CONTEXT_WINDOW_TOKENS`。\n- 推理强度词表与归一化只在 `lib/reasoning-effort.ts`：`reasoningEffortLevels` 定义合法档位，`reasoningEffortOptionsForModel` 给 UI 出选项，`normalizeReasoningEffortForModel` 在换模型时收敛旧值，`assertReasoningEffortSupported` 是各 provider options 构造前的统一校验。\n- OpenAI 官方密钥的模型发现在 `lib/openai-api-provider.ts`：`fetchOpenAIApiModelIds` 拉账号可见模型，`listOpenAIApiModelCatalog` 合成带元数据的目录，`selectOpenAIApiModels` / `modelInputFromPreset` 把用户勾选转成写库输入，`currentOpenAIApiModelCatalog` 用于按 baseURL+key 判断快照是否仍然有效。\n- OpenAI 直连运行时在 `lib/openai-runtime.ts`：`createOpenAIApiLanguageModel` 建 Responses 模型，`openAIProviderOptions` 生成该家的 provider options。\n\n## 数据怎么流\n\n新增一个连接时，校验名称与地址合法、模型清单非空之后，在同一个数据库事务里写入供应商、密钥、全部模型，并把第一个模型设为选中；失败则整体回滚，不会出现「有供应商没密钥」这类半截状态。\n\n编辑连接时按用户提交的模型清单做替换：带 id 的沿用并更新，不带 id 的新增，原有但未出现在清单里的删除。删除完成后立刻走一次收敛：当前选中模型若还在且仍可选中就保持不动，否则从全库按顺序挑第一个可选中的模型顶上，一个都没有就清空选中。删除整个连接、删除密钥、订阅退出登录走的是同一套收敛，所以「退出登录后侧边栏还指着已失效模型」这类问题在数据层就被挡住了。\n\n「可选中」有三个条件同时成立：模型没有被标记为不可用、可见性不是隐藏、并且它所属的供应商还存在有效凭据。凭据存在与否由凭据表决定，因此退出登录不需要删模型记录，模型会自动从可选集合里退出，重新登录后又自动回来；订阅侧刷新模型清单时，本次没返回的旧模型只是被标记为不可用而不是删除，用户手工改过的上下文窗口值也因此保留。\n\n模型目录有三层来源，逐层回退：优先用远端目录（models.dev，超过一周视为过期需要刷新）与内置预置表按供应商 id、模型名合并，远端条目覆盖内置同名条目；远端拉取失败时退回本地缓存；缓存也没有时只用内置表。OpenAI 官方密钥这一路更特殊：模型清单以账号 `/v1/models` 返回为主表，目录只用来补上下文窗口和推理档位元数据，账号里有但目录不认识的模型仍然会列出来，按默认上下文窗口、空推理能力集处理。上下文窗口在写库时统一归一化，非正整数一律落回默认值；但用户手填路径用的是严格校验，非法值直接报错而不是静默替换。\n\n推理强度是一个全局设置而非每模型设置，读取时对非法值归一化为「默认」。真正下发给模型时按供应商分家：OpenAI 直连走 Responses 的选项，会关掉服务端存储、开启并行工具调用，模型有推理能力时额外要求返回详细推理摘要；OpenAI 兼容那一路把强度放进兼容层的选项里。两条路径都先校验该模型是否声明支持这一档，不支持就抛错并在错误里列出可选档位。选「默认」时不下发任何强度字段，把决定权交回给服务端。\n\n任务启动时，运行时先取当前可用的选中模型，没有就以「未配置模型」失败；再按供应商类别选运行时实现，只有需要密钥的两类才去读明文密钥。密钥只在这一刻被读出，界面上一律只展示掩码形式。\n\n## 改动指南\n\n- 任何会改变模型集合或凭据存在性的写操作都必须在流程域内完成并调用 `reconcileSelectedModel`，且和写入处于同一个事务；绕过它直接写 `database.models` 或 `database.providerCredentials` 会留下悬空的选中模型。读取域 `lib/provider-store.ts` 保持只读加转发的定位，不要在那里新增写逻辑。\n- 新增供应商类别要同时改四处：`ProviderKind` 的联合类型（`lib/db.ts`）、`validateProvider` 的白名单、offscreen 里的运行时分派（`entrypoints/offscreen/main.ts` 的 `createLanguageModelRuntime`）、以及 `showManualContextWindowInput` 这类按类别分叉的 UI 策略。漏掉校验白名单会在写库时直接抛错。\n- 分类只认 baseURL，改 `isOpenAIApiBaseURL` 的判据会让存量记录的类别与实际运行时不一致——已有记录的 `kind` 是写库时固化的，只有在编辑时显式传入 baseURL 才会重算。\n- 新增推理档位改 `reasoningEffortLevels` 即可，词表是全局唯一来源；但要确认各家 provider options 真的接受该字符串，`assertReasoningEffortSupported` 只校验模型声明的支持集，不校验服务端是否认识。\n- 订阅 token 刷新写入用的是「先比对旧凭据再覆盖」的乐观检查（`saveRefreshedCodexCredential` / `saveRefreshedXaiCredential`），比对包含 `updatedAt`；改动凭据写入路径时别破坏这个比对，否则并发刷新会互相覆盖。\n- 模型排序按名称里的版本号倒序，再按存储的优先级（`sortModelsForDisplay`），因为供应商自报的优先级不可靠。改排序前先确认不会把新一代模型排到旧版本后面。\n- `refreshModelCatalog` 会写入设置表并覆盖整份缓存，它没有增量合并语义；`mergeProviderCatalog` 才是内置与远端的合并点，新增内置预置只改 `builtinProviderPresets`。\n",
    "modules/settings-ui.md": "---\nsources:\n  - entrypoints/sidepanel/SettingsDialog.svelte 2d6c76501219 measureContent positionBrowserAccess handleBrowserAccessChanged refreshShortcut\n  - entrypoints/sidepanel/ProviderSettings.svelte e9d7d1e4acbd handleCreate saveEdit applyPreset loadDraftAccountModels testExisting requestRemoveProvider\n  - entrypoints/sidepanel/ProviderSecretInput.svelte d7affbf31e06\n  - entrypoints/sidepanel/SubscriptionHub.svelte 4e9f972f21bb createChatgptAdapter createXaiAdapter\n  - entrypoints/sidepanel/SubscriptionLoginCard.svelte e8c3ad9b28af handleLogin submitManualCode handleRefresh handleSignOut\n  - entrypoints/sidepanel/BrowserAccessPanel.svelte c50f5c835f44 grantAllSites openExtensionDetails\n  - lib/provider-config-flow.ts 91dd8cf89de0 createProviderConnection updateProviderConnection deleteProviderConnection reconcileSelectedModel\n  - lib/subscription-login.ts 6e901a307370 SubscriptionVendorAdapter subscriptionCopy mapOAuthLoginError visibleSubscriptionModels\n  - lib/provider-settings-policy.ts 688b7d5c2ee9 showManualContextWindowInput\n  - lib/openai-api-provider.ts b1a10c6a774c listOpenAIApiModelCatalog selectOpenAIApiModels modelInputFromPreset\ncovers:\n  - entrypoints/sidepanel/SettingsDialog.svelte\n  - entrypoints/sidepanel/ProviderSettings.svelte\n  - entrypoints/sidepanel/ProviderSecretInput.svelte\n  - entrypoints/sidepanel/SettingsActionBar.svelte\n  - entrypoints/sidepanel/SettingsBackButton.svelte\n  - entrypoints/sidepanel/SubscriptionHub.svelte\n  - entrypoints/sidepanel/SubscriptionLoginCard.svelte\n  - entrypoints/sidepanel/BrowserAccessPanel.svelte\n  - entrypoints/sidepanel/OpenAILogo.svelte\n  - entrypoints/sidepanel/GrokLogo.svelte\n---\n\n# 设置与登录界面\n\n## 职责\n\n把「让 Taber 能跑起来」需要的一次性配置收进一个弹窗：外观与语言、快捷键、个人资料、浏览器权限、日志导出属于偏好一侧；模型来源（官方订阅登录或自带密钥的供应商）属于供应商一侧。它只负责收集用户意图和展示当前状态，真正的落库、密钥保存、默认模型挑选都交给配置流程和登录适配器完成。\n\n首次使用时同一套界面还承担引导：新手模式下供应商表单会用另一套字段标识渲染，并支持把某个区块高亮出来（浏览器权限或供应商入口），周围内容变暗、滚动自动把高亮块居中，引导用户先补上缺的那一步。\n\n## 对外接口\n\n- 弹窗入口只有 `SettingsDialog.svelte`，由主界面传入开合状态、当前分区、主题/语言的读写回调，以及权限变化、供应商变化、个人资料变化三个通知回调。分区固定两个：偏好和供应商。\n- 供应商一侧的全部交互集中在 `ProviderSettings.svelte`，通过 `variant` 区分引导和常规面板、通过 `spotlight` 接受高亮请求，配置变化后调用 `onChanged` 让外层刷新模型列表。\n- 官方订阅由 `SubscriptionHub.svelte` 收成一个二级页，两张卡片都是同一个 `SubscriptionLoginCard.svelte`，差别全部来自 `createChatgptAdapter` / `createXaiAdapter` 提供的 `SubscriptionVendorAdapter`（登录、刷新、登出、读账号信息）与 `subscriptionCopy` 提供的文案（`lib/subscription-login.ts`）。品牌图标 `OpenAILogo.svelte` / `GrokLogo.svelte` 作为 props 传入。\n- 写库只走 `createProviderConnection` / `updateProviderConnection` / `deleteProviderConnection`（`lib/provider-config-flow.ts`），订阅侧走各自适配器内部的连接与登出函数；界面本身不碰 Dexie 表。\n- 浏览器权限区块 `BrowserAccessPanel.svelte` 只依赖 `readBrowserControlState` / `requestAllSitesAccess`（`entrypoints/sidepanel/browser-access.ts`）。\n- `ProviderSecretInput.svelte`、`SettingsActionBar.svelte`、`SettingsBackButton.svelte` 是无状态展示件：密钥框（明暗切换）、右对齐动作条、二级页返回按钮。\n\n## 数据怎么流\n\n供应商一侧有两条互斥的配置路径。订阅路径点开卡片即发起浏览器 OAuth，ChatGPT 走回调截获、Grok 额外支持把授权码粘回卡片里的输入框；登录成功后由适配器把令牌和该订阅可用的模型清单一起写库，界面只拿回一个账号标识（邮箱或名字）用于卡片副标题，并按需展开完整模型列表。自定义供应商路径先选预设（预设来自本地缓存的模型目录，过期会在后台静默刷新），填密钥，再挑模型，保存时才一次性写入供应商、密钥和模型清单。\n\n模型怎么挑取决于地址属于哪种供应商：官方 OpenAI 密钥必须先用当前密钥拉一次账号可用模型，只有拉到的名字才能加进待保存清单，界面会在密钥或地址改动后作废这份快照，保存时若快照失效直接报错而不是猜；其它 OpenAI 兼容地址则用预设清单，允许手填模型名，并显示上下文窗口输入框，因为这类地址无法自动得知窗口大小。上下文窗口的默认值优先取预设里该模型的数值，手填模型才落到用户输入。设置界面里没有推理强度开关——支持哪些强度、默认哪一档是随模型一起写入的元数据，真正的选择发生在主界面的模型选择器。\n\n密钥的边界是：新建时输入框始终从空开始，编辑时会把已存密钥读出来回填以便原样保存，展示与否只是本地开关，密钥不会出现在列表卡片上，只能通过测试连接按钮验证是否可用。删除供应商采用二次确认，三秒内不再点就自动取消。任何一次保存或删除后都重新读库刷新列表，并通知外层——因为删掉的模型可能正是当前选中的，重新选默认模型的责任在配置流程里。\n\n偏好一侧多为即时生效的开关；浏览器权限区块自己读一次权限状态，用户点击后触发 Chrome 权限申请或跳转扩展详情页（用户脚本开关只能在那里开），窗口重新获得焦点时自动复查一遍。诊断区块被刻意排在最底部，弹窗高度按它上沿裁剪，导出日志需要滚动才看得到。\n\n## 改动指南\n\n- 新增字段别在界面里拼库记录：`handleCreate` / `saveEdit` 只组装 `ProviderConnectionModelInput` 交给 `lib/provider-config-flow.ts`，校验、事务、默认模型重算（`reconcileSelectedModel`）都在那一层，绕过去会留下选中模型指向已删记录的脏状态。\n- 判断某类供应商行为的分支统一用 `apiKeyProviderKind` 的结果，上下文窗口输入框是否显示由 `showManualContextWindowInput`（`lib/provider-settings-policy.ts`）单点决定，不要在模板里重复写地址判断。\n- 官方 OpenAI 密钥的模型快照绑定「地址 + 密钥」，靠 `currentOpenAIApiModelCatalog` 判定是否仍然有效；改动这段时保持「快照失效即拒绝保存」，不要退回默认上下文窗口静默保存。\n- 加订阅厂商时只写一个 `SubscriptionVendorAdapter` 加一份文案，不要复制卡片组件；OAuth 的取消、超时、需要用户交互三类错误已在 `mapOAuthLoginError` 归一，新增文案要补齐对应键。\n- 弹窗高度和高亮滚动是一套联动逻辑（`measureContent` 与 `positionBrowserAccess`）：偏好区块的顺序或诊断区块位置一变，可视高度就会变；权限状态变化会推进 `browserAccessRevision` 让正在进行的滚动作废，新增异步定位逻辑必须沿用这个版本号与中止信号，否则会出现滚到一半跳回顶部。\n- 供应商面板的二级页（新建、编辑、订阅中心）互斥且靠布尔状态切换，进入任一页要先关掉另外两个；返回按钮统一用 `SettingsBackButton.svelte`，主按钮统一放进 `SettingsActionBar.svelte`，新建页的高级区展开时动作条会换行并做位移补偿动画。\n- 冒烟测试依赖若干 `data-smoke` 标记（订阅入口与登录卡片、新增 API 供应商、保存供应商、粘贴授权码输入框），重构模板时保留这些属性。\n",
    "modules/sidepanel.md": "---\nsources:\n  - entrypoints/sidepanel/App.svelte c61f97285c00 boot refreshSnapshot appendLiveEvent handleStart handleStop useCurrentTabAsTarget\n  - entrypoints/sidepanel/browser-access.ts 979a87c735da readBrowserControlState requestAllSitesAccess\n  - lib/browser-access.ts efec5f561d51 browserControlReady allSitesOrigins browserPageScriptConsentKey\n  - entrypoints/sidepanel/Timeline.svelte 2d78ef7c8345 groupTurnParts activityGroupStatus\n  - entrypoints/sidepanel/ActivityGroup.svelte 0c6aa1c8a88e activePart actionIcon toolState\n  - entrypoints/sidepanel/Composer.svelte 9130db59be56 submitPrompt runQuickAction handleProfileClick\n  - entrypoints/sidepanel/SourcesBar.svelte 1b32d6d935db requestSwitchTarget confirmSwitchTarget\n  - entrypoints/sidepanel/FilesStrip.svelte 84fd158cf0a5 download exportPdf\n  - entrypoints/sidepanel/SessionHistory.svelte 5e3b32e06d00 positionCurrentSession\n  - lib/sidepanel-i18n.ts 51dccfc7abd4 messages detectLocale persistLocale formatTime\n  - lib/fx-icon-draw.ts 01f23ab40ce9 installIconDrawNormalizer\ncovers:\n  - entrypoints/sidepanel.html\n  - entrypoints/sidepanel/main.ts\n  - entrypoints/sidepanel/App.svelte\n  - entrypoints/sidepanel/Timeline.svelte\n  - entrypoints/sidepanel/ActivityGroup.svelte\n  - entrypoints/sidepanel/Composer.svelte\n  - entrypoints/sidepanel/SourcesBar.svelte\n  - entrypoints/sidepanel/FilesStrip.svelte\n  - entrypoints/sidepanel/SessionHistory.svelte\n  - entrypoints/sidepanel/ToastStack.svelte\n  - entrypoints/sidepanel/ProfilePanel.svelte\n  - entrypoints/sidepanel/toast.ts\n  - entrypoints/sidepanel/browser-access.ts\n  - entrypoints/sidepanel/app.css\n  - lib/sidepanel-i18n.ts\n  - lib/browser-access.ts\n  - lib/fx-icon-draw.ts\n  - public/_locales/en/messages.json\n  - public/_locales/zh_CN/messages.json\n---\n\n# 监督侧边栏\n\n## 职责\n\n侧边栏是用户看着 Agent 干活、并随时接管的地方：它展示当前会话的对话与工具过程、正在被操作的页面、任务产出的文件，并提供发起任务、停止任务、切换模型与运行方式的入口。\n\n它不是状态源。任务状态只存在于本地事件日志里，侧边栏打开时读一遍日志把界面重建出来，再订阅后续事件跟着变；关掉侧边栏不影响任务运行，重开也不会丢过程。因此同一个会话在关闭期间跑完的所有步骤，重新打开后仍能完整回看（ADR 0007）。\n\n它同时是准入闸门：模型没配好、或者浏览器访问权限没给全，侧边栏不会让用户开始任务，而是把界面收敛成一块欢迎区，引导去设置里补齐。供应商配置与设置界面本身属于设置页，不在本页范围。\n\n## 对外接口\n\n- 入口固定为 `entrypoints/sidepanel.html` + `main.ts`（挂载 `App.svelte`），在 manifest 里注册为 side panel 默认页面。\n- 侧边栏对外只发消息，不直接碰 Chrome API：启动任务发 `taber.background.startTask`（带提示词、前台模式、个人资料授权、窗口 id、界面语言），停止发 `taber.background.stopTask`，用户手动改 target 发 `taber.agent.switchTarget`，读写标签页统一走 `taber.chromeApi.request`（均在 `App.svelte` 的 `handleStart` / `handleStop` / `useCurrentTabAsTarget` / `sendChromeApiRequest`）。\n- 打开时用 `browser.runtime.connect({ name: 'taber.sidepanel' })` 建长连接并上报所属 `windowId`，供后台判断侧边栏归属；实时事件通过 `taber.agent.event` 广播回来。\n- 浏览器访问状态只由 `readBrowserControlState()`（`entrypoints/sidepanel/browser-access.ts`）读出，判定规则和权限常量在 `lib/browser-access.ts`（`browserControlReady` / `allSitesOrigins` / `browserPageScriptConsentKey`）；申请全站权限只有 `requestAllSitesAccess()` 一个入口。\n- 双语文案统一取自 `lib/sidepanel-i18n.ts` 的 `messages`，语言判定 `detectLocale`、写回 `persistLocale`、时间显示 `formatTime`；`public/_locales/*/messages.json` 只承担 Chrome 商店里显示的扩展描述。\n- 组件间通知走 `Notify`/`ToastInput`（`entrypoints/sidepanel/toast.ts`），由 `ToastStack.svelte` 统一渲染；样式令牌与动效类集中在 `app.css`，图标描边动画由 `installIconDrawNormalizer`（`lib/fx-icon-draw.ts`）在悬停时懒归一化。\n\n## 数据怎么流\n\n启动时先初始化数据库、补种内置技能，再并行读取供应商、浏览器访问状态、会话列表和当前会话快照；这些都就绪后界面才解锁，避免用户抢在技能表写完之前打开技能面板看到空列表。\n\n之后事件分两条路进来。任务边界事件（开始、结束、失败等）触发整段会话重读，顺带修好任何漏收的广播；其余增量事件直接就地追加，不为每个片段重读会话。落到界面上，事件先被投影成时间线条目：用户消息和助手回复按顺序排开，中间连续的思考与工具调用被压成一张可展开的活动卡，卡面显示当前步骤摘要、步数和计时，展开后逐条列出工具的原始输入输出。工具图标按动作语义选取，出参里带失败标记的一步会显示为警告而不是成功，让\"能继续但没做成\"和\"真失败\"区分得开。\n\n来源栏挂在时间线下方，主位是当前被控制的页面，任务运行时带呼吸指示点，展开可以看到目标的地址、标签页与窗口编号，也能一键打开；其余被访问过的来源和最近一张截图缩略图放在同一张卡里。用户想换目标必须经过一次确认对话框，且只在任务运行时可用——这条正是 ADR 0018 里\"target 只由工具或侧边栏确认切换\"的用户侧出口。文件条列出本会话工作区产生的文件，可下载、可对文本类文件走打印页导出 PDF、可删除；用户也能反向从输入框附件上传文件进工作区，文件名会追加进提示词告诉 Agent 去哪儿取。\n\n发起任务前，输入框一行工具条决定这次怎么跑：选模型和推理档位、切前台模式（开启时 Agent 会在 Chrome 内激活目标标签让人直接看，但不会把 Chrome 抢到系统前台，见 ADR 0019）、以及是否本次授权读取个人资料——这个授权只对单次任务生效，从不落库，任务成功启动即消耗掉；还没写个人资料时点它会跳去设置里编辑。快捷动作把\"总结当前页\"\"研究\"\"比较\"变成预置提示词，后两者可以先勾选本窗口的若干标签页再发。任务运行期间输入区整体换成运行态条，只留停止按钮。\n\n会话历史在顶部，切换会话会写入选中项并整体做一次过渡动画，新建会话就是回到空白态；流式事件不触发这个动画。语言、主题分别持久化在扩展存储与本地存储，其它窗口改语言会通过存储变更同步过来。\n\n## 改动指南\n\n- 快照与实时事件共用一套并发防护：`sessionRequestId` + `sessionNavigationPending` + `sessionSelectionWrite`（`App.svelte`）保证会话切换期间到来的旧请求不会覆盖新界面。新增任何\"读会话再 setState\"的路径都必须复用这三者，否则快速切会话会串档。\n- 任务边界事件走全量重读、其它事件走 `appendLiveEvent` 追加，是刻意的性能取舍；把边界事件也改成追加会失去补漏能力。\n- `readBrowserControlState()` 有副作用：全站权限与 User Scripts 都就绪时会顺手把页面脚本同意标记写进 Dexie。想只做纯查询要另加函数，不要在这里去掉写入。\n- 准入判定链是 `missingBrowserControl` → `hasAnyModel` → `setupMissing`，三者决定欢迎区/正常界面与自动弹设置的时机（`shouldAdvanceToProviderSetup`、`settingsTabStartsBrowserControlGuide` 在 `lib/sidepanel-view.ts`）。改引导顺序请改这些纯函数，不要在组件里加新的 if。\n- 时间线的分组、活动卡状态、来源与截图提取全部是 `lib/sidepanel-view.ts` 的纯函数（`groupTurnParts` / `activityGroupStatus` / `sourcesFromProjection` 等），组件只负责渲染。新展示逻辑放纯函数一侧才有测试覆盖。\n- 新增文案必须同时补 `lib/sidepanel-i18n.ts` 的 `en` 和 `zh`，类型会强制两边同构；`public/_locales` 只放商店描述，别把界面文案混进去。\n- 个人资料授权状态 `profileAccess` 绝不能持久化（ADR 0021），并且在资料被清空时要跟着复位。\n- 冒烟测试通过 `taber-smoke=1` 查询串接管消息发送与 User Scripts 可用性判定；改这几个发送函数时保留 hook 分支，否则 `pnpm run test:ci:full` 的 sidepanel smoke 会断。\n",
    "modules/skills-workspace.md": "---\nsources:\n  - lib/fs-tool.ts 435378f7d4a7 createFsController parseFsInput fsInputJsonSchema FS_READ_LIMIT_CHARS\n  - lib/skills.ts ced47471c1d1 matchSkillsForTask skillsDigestForTask availableSkillPathsForUrl serializeSkillFile parseSkillFile skillFileName saveSkill\n  - lib/skills-seeds.ts 037e890da986 seedBuiltinSkills builtinSkillSeeds builtinSkillDisplay BUILTIN_SKILLS_VERSION\n  - lib/workspace-files.ts 7eb961fd6d0c writeSessionFile readSessionFile listSessionFiles normalizeFileName textMimeTypes MAX_SESSION_FILES\n  - lib/document-export.ts baf8fe341a8c markdownToDocx docxToText\n  - lib/personal-profile.ts 24a0f483084c readPersonalProfile parseProfileAccess profileConsentAfterStart personalProfileSettingKey\n  - entrypoints/print/main.ts ed1aada29752\n  - entrypoints/print.html 182a10d234de\ncovers:\n  - lib/fs-tool.ts\n  - lib/skills.ts\n  - lib/skills-seeds.ts\n  - lib/workspace-files.ts\n  - lib/document-export.ts\n  - lib/personal-profile.ts\n  - entrypoints/print/main.ts\n  - entrypoints/print.html\n---\n\n# 文件工作区与站点技能\n\n## 职责\n\n浏览器扩展里没有真实文件系统，但模型对「列目录、读文件、写文件」有极强的先验。本模块就把三类完全不同的本地数据伪装成一棵虚拟文件树交给 Agent：本次会话的上传件与产出件、可跨会话复用的站点经验、以及用户手写的个人资料。底层存储仍是本地数据库里的结构化表，文件只是模型看到的界面（ADR 0016）。\n\n站点技能是「先验知识」而不是事实：Agent 在动手探索一个陌生站点前，先读该站点已验证过的接口、入口和坑；任务里发现新的可复用流程或陷阱时再写回去。扩展自带一批内置技能作为冷启动资产，覆盖票务、购物、社交、视频、出行、开发者工具和参考资料七类共三十条，内容只收录经实测验证的接口与约束——错误的先验比没有先验更糟。\n\n个人资料用于替用户填表。它默认对模型完全不可见，只有用户在发起某一次任务时显式勾选授权，这一次任务才能读到（ADR 0021）。\n\n## 对外接口\n\n- fs 工具域只暴露一个控制器 `createFsController`（`lib/fs-tool.ts`），配合 `parseFsInput` 与 `fsInputJsonSchema` 由 `lib/agent-tools.ts` 装配成 `ls`/`read`/`write` 三动作工具；控制器构造时绑定 `sessionId` 与 `profileAccess`，路径合法性只认 `/workspace/<name>`、`/skills/<name>.md`、`/profile.md`。\n- 技能域对外只给匹配与序列化：`skillsDigestForTask`（任务启动摘要，`entrypoints/offscreen/main.ts` 用）、`availableSkillPathsForUrl`（导航后附带的可用技能路径，`lib/agent-tools.ts` 用）、`saveSkill`/`deleteSkill`/`setSkillEnabled`/`listSkills`（侧边栏与 fs 写入共用），以及文件形态转换 `skillFileName`/`serializeSkillFile`/`parseSkillFile`（`lib/skills.ts`）。\n- 会话文件域只暴露 `listSessionFiles`/`readSessionFile`/`writeSessionFile`/`deleteSessionFile` 与命名规范 `normalizeFileName`、`mimeTypeForFileName`、`textMimeTypes`（`lib/workspace-files.ts`），侧边栏上传、fs 写入、大结果外溢共用同一入口。\n- 文档转换域只有两个纯函数 `markdownToDocx`、`docxToText`（`lib/document-export.ts`），依赖 `docx`/`mammoth` 且都是动态 import。\n- 个人资料域暴露 `readPersonalProfile`/`setPersonalProfile` 与两个纯策略函数 `parseProfileAccess`、`profileConsentAfterStart`（`lib/personal-profile.ts`）。\n- PDF 导出入口是独立扩展页 `entrypoints/print.html` + `entrypoints/print/main.ts`，以查询参数 `?file=<id>` 定位文件。\n- 内置技能种子由 `seedBuiltinSkills` 幂等灌入，展示用中文名走 `builtinSkillDisplay`（`lib/skills-seeds.ts`）。\n\n## 数据怎么流\n\n列目录时一次并行取回三样东西：当前会话的文件清单、全部技能清单、以及（仅在本次任务已授权时）个人资料。未授权时资料在列表里根本不出现，读它也只回一个和普通文件一模一样的「文件不存在」，模型无从判断该功能是否存在；写它在授权状态下才会得到「只读，由用户在设置里维护」的明确拒绝。\n\n读工作区文件时，文本类按字符上限截断并如实标注被截断；二进制类不返回内容，而是提示改用文档提取工具按文件名解析。读技能文件时，数据库里的结构化记录被拼成带 frontmatter 的 Markdown 再返回，看起来就是一份普通文档。\n\n写工作区文件时按扩展名决定通路：常见文本格式直接编码入库；Word 文档则把正文当 Markdown 逐行解析成标题、列表、引用、代码块和表格，再打包成真正的 .docx 二进制；其余格式一律拒绝，并明确告知 PDF 要先写 Markdown 或 HTML、由用户在侧边栏导出。写技能文件时先解析 frontmatter 校验字段，再落库；由于文件名是从技能名派生的短横线 slug，改名会导致旧文件名失效，因此实现是「先保存新记录、成功后再删掉改名前的旧记录」，避免中途失败丢数据。\n\n技能怎么被想起来分两条路。任务启动时按目标页面主机名匹配，同时扫描用户提示词里是否提到某个技能主机的主体标签（标签太短的会跳过，避免在普通词里误命中），命中的技能被压成一段只含路径和描述的摘要塞进本次任务指令，让模型自己决定要不要展开读。任务进行中每次导航或页面动作落到新主机时，工具结果里附上该主机的可用技能路径，同一主机不重复提示。\n\n会话文件跟着会话生命周期走：用户从输入框上传、Agent 产出、以及超大工具结果自动外溢，都写进同一张按会话隔离的表；会话被保留策略裁剪时，文件随事件日志和工具记录一起在同一事务里删除。导出 PDF 时侧边栏新开打印页，它按 id 从本地库取文件，Markdown 走渲染、HTML 直用，统一经过消毒后插入页面并自动唤起浏览器打印对话框，由用户另存为 PDF——排版质量交给浏览器，不引入 PDF 生成库。\n\n个人资料被读取时，模型在本次调用里拿到原文，但写进事件日志和工具记录的是脱敏后的占位结果，这样历史上下文不会让后续未授权的任务绕过门控。授权本身是一次性的：任务成功启动即消费掉勾选状态，启动失败则保留用户的选择。\n\n## 改动指南\n\n- 新增虚拟路径必须同时改三处：`parsePath` 的路径解析、`list` 的列举、以及 `fsInputJsonSchema` 里给模型看的路径说明（`lib/fs-tool.ts`）；只改其一会出现「能读不能列」或模型永远猜不到路径。\n- 零知识门控是硬约束：任何与 `/profile.md` 相关的错误信息都必须与普通文件的 not found 完全一致（`profileNotFoundError`），静态工具描述里也不得提及它；同时脱敏收口点在 `recordableToolOutput`（`lib/agent-tools.ts`），新增读取路径时必须一并覆盖。\n- 技能名到文件名是有损映射，`saveSkill` 里显式检测 slug 冲突并报错。改 `skillFileName` 的 slug 规则等于改所有已存技能的路径，会让模型此前读过的路径失效。\n- 改内置技能内容后必须递增 `BUILTIN_SKILLS_VERSION`，否则 `seedBuiltinSkills` 会因版本号相同直接跳过。种子只覆盖 `source` 为 builtin 的记录，绝不会覆盖用户或 Agent 写的同名技能；新增种子时中文展示名走 `builtinSkillDisplay`，数据库里存的名字保持英文作为逻辑键。\n- 会话文件表以「会话 + 文件名」为唯一键，同名写入是覆盖而非新增；文件名校验拒绝路径分隔符和 `..`，放宽前先确认没有把外部输入直接当路径用。数量与体积上限在 `lib/workspace-files.ts`，超限直接报错而不是静默丢弃。\n- 打印页运行在扩展页面上下文且会注入模型产出的 HTML，消毒规则里禁用了所有远程资源标签与属性（`entrypoints/print/main.ts`）。放宽任何一项都等于给模型产出的内容开外联通道，改动前先想清楚数据外泄路径。\n- Markdown 转 Word 是行级解析，不支持嵌套列表层级、行内链接和图片。需要更强的还原度时优先走 HTML + 浏览器打印，而不是在这里堆解析分支。\n- 文档转换的两个依赖体积不小，务必保持动态 import，不要提到模块顶层，否则会拖累 offscreen 启动。\n",
    "modules/subscription-auth.md": "---\nsources:\n  - lib/oauth-browser.ts 5ca1c8c40840 waitForBrowserOAuthRedirect buildOAuthAuthorizeUrl exchangeOAuthCode refreshOAuthToken readBearerTokens readOAuthAuthorizationCode createPkce BrowserOAuthError\n  - lib/codex-oauth.ts 841b75da22b3 loginOpenAICodex waitForCodexIdentityRedirect waitForCodexOAuthRedirect CODEX_OAUTH_REDIRECT_URI\n  - lib/codex-auth.ts 604960926283 refreshCodexTokens fetchCodexModels parseCodexModels selectDefaultCodexModel parseCodexTokenMetadata redactCodexSecrets CODEX_CLIENT_VERSION CODEX_ORIGINATOR\n  - lib/codex-provider.ts 49ec409fd7e5 connectOpenAICodex readFreshCodexTokens refreshCodexModels readCodexTokens\n  - lib/codex-runtime.ts 03adcb4568b1 createCodexLanguageModel codexProviderOptions\n  - lib/xai-oauth.ts e2e76ee99c14 loginXaiSub parseXaiManualCode\n  - lib/xai-auth.ts 747e51441422 refreshXaiTokens parseXaiTokenResponse XAI_MODELS mapXaiError\n  - lib/xai-provider.ts f534a21531a2 connectXaiSub readFreshXaiTokens readXaiTokens\n  - lib/xai-runtime.ts 64e6f803e6b9 createXaiLanguageModel xaiProviderOptions\n  - lib/subscription-login.ts 6e901a307370 createChatgptAdapter createXaiAdapter mapOAuthLoginError visibleSubscriptionModels\ncovers:\n  - lib/oauth-browser.ts\n  - lib/subscription-login.ts\n  - lib/codex-auth.ts\n  - lib/codex-oauth.ts\n  - lib/codex-provider.ts\n  - lib/codex-runtime.ts\n  - lib/xai-auth.ts\n  - lib/xai-oauth.ts\n  - lib/xai-provider.ts\n  - lib/xai-runtime.ts\n---\n\n# 官方订阅登录与运行时\n\n## 职责\n\n让用户用已有的 ChatGPT 或 xAI 订阅账号驱动 Taber，而不必去控制台申请密钥。模块负责三件事：在浏览器里跑完一次授权登录并拿到凭据；把凭据、账号身份和该账号可用的模型列表落进本地数据库；在任务运行时把这份凭据变成一个能直接对话的语言模型，并在快过期时自动续期。\n\n它只管\"订阅账号\"这条路径。用户自填密钥的供应商不经过这里，两者最终汇合在同一份供应商与模型记录上，任务侧感知不到差别。\n\n## 对外接口\n\n- 通用浏览器 PKCE 原语只在 `lib/oauth-browser.ts`：`createPkce` / `buildOAuthAuthorizeUrl` / `waitForBrowserOAuthRedirect` / `readOAuthAuthorizationCode` / `exchangeOAuthCode` / `refreshOAuthToken` / `readBearerTokens`，失败统一抛 `BrowserOAuthError`（`auth` / `token_exchange
