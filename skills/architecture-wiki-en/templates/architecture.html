<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="wiki-digest" content="__WIKI_DIGEST__">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #F2EFE6;
    --surface: #E7E3D5;
    --card: #FBFAF4;
    --ink: #20261F;
    --ink-soft: #71766B;
    --line: rgba(32, 38, 31, .1);
    --accent: #3E7A5E;
    --accent-deep: #2C5E47;
    --warn: #BE5560;
    --navw: clamp(195px, 15vw, 235px);
    --asidew: clamp(300px, 26vw, 420px);
    --paper: var(--card);
    --paper-hi: var(--card);
    --mono: ui-monospace, "SF Mono", Menlo, "PingFang SC", monospace;
    --sans: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    --serif: "Georgia", "Songti SC", serif;
    /* 浮空层材质：1px 半透 ring + 两层贴身柔光，代替「边框 + 一团模糊阴影」 */
    --shadow-float: 0 0 0 1px oklch(0 0 0 / .07), 0 1px 2px -1px oklch(0 0 0 / .07), 0 3px 8px -2px oklch(0 0 0 / .07);
  }
  * { box-sizing: border-box; margin: 0; }
  ::selection { background: color-mix(in srgb, var(--accent) 24%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  nav, #panel, .hmodal, #flowbar { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--ink) 25%, transparent) transparent; }
  #panel, .hmodal { text-wrap: pretty; }
  /* 按下反馈：独立 scale/translate 属性不碰既有 transform/transition，可中断回弹；按压 80ms 释放 160ms */
  #panel .chip, #panel .morebtn, .hmodal .hclose { transition: scale .16s cubic-bezier(.2, 0, 0, 1); }
  /* 分段控件滑动指示器：选中态是一枚在按钮间滑动的药丸，位置/宽度由 JS 实测驱动 */
  .seg-ind {
    position: absolute; top: 3px; bottom: 3px; left: 0; z-index: 0; border-radius: 8px; pointer-events: none;
    transition: translate .26s cubic-bezier(.22, 1, .36, 1), width .26s cubic-bezier(.22, 1, .36, 1);
  }
  .tabs .seg-ind { background: var(--card); border: 1px solid var(--line); }
  #flowbar .seg-ind { border-radius: 9px; background: var(--accent); }
  header button:active, .tabs button:active, #flowbar button:active, #panel .chip:active, #panel .morebtn:active, .vstat:active { scale: .96; transition-duration: .08s; }
  .hmodal .hclose:active, nav .grp .chev:active { scale: .92; transition-duration: .08s; }
  nav .item:active, nav .grp:active, #panel .steps li:active, #panel li.fi.mod:active { translate: 0 1px; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 12.5px/1.65 var(--sans);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .ic { width: 13px; height: 13px; flex-shrink: 0; vertical-align: -2px; }
  /* Outline 默认、Fill 表选中：两层叠放做 cross-fade，槽位固定不抽动 */
  .isw { position: relative; display: inline-flex; flex-shrink: 0; vertical-align: -2px; }
  .isw .ic { vertical-align: 0; transition: opacity .16s cubic-bezier(.2, 0, 0, 1); }
  .isw .if { position: absolute; inset: 0; opacity: 0; }
  .sel .isw .if, .on .isw .if { opacity: 1; }
  .sel .isw .io, .on .isw .io { opacity: 0; }
  header { display: flex; align-items: center; gap: 15px; padding: 12px 16px 5px; }
  header .ops { display: flex; align-items: center; gap: 6px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img, .brand svg.logo { width: 28px; height: 28px; }
  .brand .k { display: none; }
  .brand .v { font: 700 15px var(--serif); white-space: nowrap; }
  .statbar {
    display: flex; align-items: center; gap: 13px; height: 32px;
    background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 0 14px;
  }
  .statbar .stat { display: flex; align-items: baseline; gap: 5px; }
  .statbar .stat .ic { width: 12px; height: 12px; color: var(--accent-deep); align-self: center; }
  .statbar .k { font-size: 10.5px; color: var(--ink-soft); }
  .statbar .v { font: 700 13px var(--mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .statbar .sep { width: 1px; height: 12px; background: var(--line); align-self: center; }
  header .spacer { flex: 1; }
  header button {
    display: flex; align-items: center; gap: 6px; height: 32px;
    font: 600 12px var(--sans); cursor: pointer; border-radius: 10px;
    background: var(--card); color: var(--ink); border: 1px solid var(--line); padding: 0 14px;
    transition: background .15s, color .15s, border-color .15s, scale .16s cubic-bezier(.2, 0, 0, 1);
  }
  header button.primary { background: var(--accent); color: #FFF; border-color: transparent; }
  header button.primary:hover { background: var(--accent-deep); }
  header button:not(.primary):hover { background: var(--surface); }
  /* 体检入口：文字用墨色，分级色（--hc）只落在底色、图标与分数上 */
  header button.vitals-btn {
    --hc: var(--ink-soft);
    background: color-mix(in srgb, var(--hc) 10%, transparent); border-color: transparent;
  }
  header button.vitals-btn:hover { background: color-mix(in srgb, var(--hc) 18%, transparent); }
  header button.vitals-btn .ic { color: var(--hc); }
  header button.vitals-btn .score { font: 700 12px var(--mono); color: var(--hc); font-variant-numeric: tabular-nums; }

  dialog#healthDlg {
    border: none; padding: 0; background: none; overflow: visible;
    width: 100%; height: 100%; max-width: 100%; max-height: 100%;
  }
  dialog#healthDlg[open] { display: flex; align-items: center; justify-content: center; }
  dialog#healthDlg::backdrop { background: rgba(32, 38, 31, .4); }
  .hmodal {
    width: min(860px, 92vw); max-height: 84vh; overflow-y: auto;
    background: var(--card); border-radius: 18px;
    padding: 18px 24px 26px; box-shadow: var(--shadow-float), 0 20px 60px rgba(20, 20, 19, .24);
  }
  /* forced-colors 会把 box-shadow 归零，只靠阴影画的边界要补真边框 */
  @media (forced-colors: active) { #flowbar, .hmodal { border: 1px solid CanvasText; } }
  .hmodal .hclose {
    position: sticky; top: 0; float: right; margin: -4px -8px 0 0;
    width: 28px; height: 28px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 1px solid var(--line); color: var(--ink-soft); cursor: pointer;
  }
  .hmodal .hclose:hover { background: var(--surface); color: var(--ink); }
  .hmodal .hhead {
    display: flex; align-items: center; gap: 9px; color: var(--ink);
    font: 700 19px/1.3 var(--serif); margin: 0 0 14px;
  }
  .hmodal .hhead .ic { color: var(--hc, var(--ink)); }
  dialog#healthDlg[open] .hmodal { animation: hin .2s cubic-bezier(.16, 1, .3, 1); }
  @keyframes hin { from { opacity: 0; transform: translateY(8px) scale(.985); } }
  main { flex: 1; display: flex; min-height: 0; gap: 10px; padding: 10px 12px 12px; position: relative; }
  /* 把手：贴边半圆，展开时贴面板外缘、收起时贴视口边缘，位置本身带过渡 */
  .handle {
    position: fixed; z-index: 30; top: 50%; transform: translateY(-50%);
    width: 24px; height: 48px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--card); border: 1px solid var(--line); cursor: pointer;
    color: var(--ink-soft);
    transition: left .26s cubic-bezier(.2, 0, 0, 1), right .26s cubic-bezier(.2, 0, 0, 1),
                width .15s, background .15s, color .15s;
  }
  .handle:hover { width: 28px; background: var(--surface); color: var(--accent-deep); }
  .handle .ic { width: 13px; height: 13px; transition: transform .22s; }
  /* 展开时向面板方向压 1px 盖住面板边框且不带阴影，半圆与面板融为一体；收起悬浮在屏幕边缘时才需要投影 */
  #handleNav { left: calc(12px + var(--navw) - 1px); border-left: none; border-radius: 0 24px 24px 0; }
  body.nav-off #handleNav { left: 0; box-shadow: 2px 0 10px rgba(20, 20, 19, .07); }
  body.nav-off #handleNav .ic { transform: rotate(180deg); }
  #handleAside { right: calc(12px + var(--asidew) - 1px); border-right: none; border-radius: 24px 0 0 24px; }
  #handleAside .ic { transform: rotate(180deg); }
  body.aside-off #handleAside { right: 0; box-shadow: -2px 0 10px rgba(20, 20, 19, .07); }
  body.aside-off #handleAside .ic { transform: rotate(0deg); }
  /* 跨断点是布局模式切换（挤占 ↔ 覆盖），定位机制不同无法平滑，瞬间切换比半吊子动画干净 */
  body.no-anim nav, body.no-anim aside, body.no-anim .handle { transition: none; }
  /* 拖宽把手：6px 命中区不变，可视指示是居中的小圆条 */
  #asideResize {
    position: absolute; z-index: 25; top: 10px; bottom: 12px; width: 6px;
    right: calc(12px + var(--asidew) - 3px); cursor: col-resize;
    transition: right .24s cubic-bezier(.2, 0, 0, 1);
  }
  #asideResize::after {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 3px; height: 44px; border-radius: 2px;
    background: color-mix(in srgb, var(--accent) 60%, transparent);
    opacity: 0; transition: opacity .15s;
  }
  #asideResize:hover::after, #asideResize.on::after { opacity: 1; }
  body.aside-off #asideResize { display: none; }
  body.resizing nav, body.resizing aside, body.resizing .handle, body.resizing #asideResize { transition: none; }
  nav, #stage, aside {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  }
  nav {
    width: var(--navw);
    overflow-y: auto; padding: 8px 8px 20px; flex-shrink: 0;
  }
  nav, aside { transition: margin .24s cubic-bezier(.2, 0, 0, 1), opacity .18s ease-out; }
  body.nav-off nav { margin-left: calc(-1 * var(--navw) - 10px); opacity: 0; pointer-events: none; }
  body.aside-off aside { margin-right: calc(-1 * var(--asidew) - 10px); opacity: 0; pointer-events: none; }
  nav .filter {
    position: sticky; top: 0; background: var(--card); padding: 2px 2px 8px; z-index: 2;
    display: flex; align-items: center; gap: 4px;
  }
  nav .filter .sbox { position: relative; flex: 1; min-width: 0; }
  nav .filter .sic {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--ink-soft); pointer-events: none;
  }
  nav .filter input {
    width: 100%; font: 12px var(--sans); padding: 6px 10px 6px 30px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); outline: none;
  }
  nav .filter input:focus { border-color: var(--accent); }
  nav .grp {
    display: flex; align-items: center; gap: 7px;
    font: 700 10.5px var(--mono); letter-spacing: .1em;
    margin: 12px 4px 4px; padding: 6px 10px; border-radius: 8px; cursor: pointer;
  }
  nav .grp .ct { margin-left: auto; font-weight: 400; letter-spacing: 0; }
  nav .grp .chev {   /* 独立命中区 ≥28px（无障碍基线），箭头本身保持小尺寸 */
    width: 28px; height: 28px; margin: -5px -8px -5px 2px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: inherit; cursor: pointer;
    font-size: 9px; border-radius: 8px; transition: transform .15s, background .15s, scale .16s cubic-bezier(.2, 0, 0, 1);
  }
  nav .grp .chev:hover { background: color-mix(in srgb, currentColor 14%, transparent); }
  nav .grp.closed .chev { transform: rotate(-90deg); }
  nav .grpbody.closed { display: none; }
  nav .item {
    display: flex; gap: 8px; align-items: center; padding: 5.5px 9px; margin: 2px 0;
    cursor: pointer; border-radius: 8px; line-height: 1.4;
  }
  nav .item:hover { background: var(--surface); }
  nav .item.sel { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent-deep); }
  nav .item.hid { display: none; }
  nav .item.dm { opacity: .35; }
  nav .code {
    font: 700 10.5px var(--mono); border: 1px solid var(--line); border-radius: 5px;
    padding: 0 4px; min-width: 26px; text-align: center; background: var(--bg); flex-shrink: 0;
  }
  nav .nm { font-size: 12.5px; }
  nav .ct { margin-left: auto; font-size: 11px; color: var(--ink-soft); }
  nav .hdot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }
  #stage { flex: 1; position: relative; min-width: 0; cursor: grab; overflow: hidden; touch-action: none; }
  #stage.panning { cursor: grabbing; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #flowbar {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 3px; background: var(--card);
    border-radius: 12px; padding: 3px; z-index: 5; max-width: 86%; overflow-x: auto;
    box-shadow: var(--shadow-float);
  }
  #flowbar button {
    position: relative; z-index: 1;
    font: 600 11.5px var(--sans); border: 1px solid transparent; background: none;
    color: var(--ink-soft); padding: 5px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap;
    transition: color .16s, scale .16s cubic-bezier(.2, 0, 0, 1);
  }
  #flowbar button.on { color: #FFF; }
  /* 图例：虚实两种边是不同语义，不解释等于没编码。无壳居中，纯注记不抢画布 */
  #legend {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; z-index: 4;
    display: flex; align-items: center; gap: 22px;
    font: 600 11px var(--sans); color: var(--ink-soft);
    letter-spacing: .02em; pointer-events: none;
  }
  #legend span { display: flex; align-items: center; gap: 7px; }
  #legend svg { width: 26px; height: 8px; flex-shrink: 0; }
  @media (max-width: 700px) { #legend { display: none; } }
  aside {
    width: var(--asidew);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .tabs { position: relative; display: flex; gap: 4px; margin: 10px 12px 0; background: var(--surface); border-radius: 11px; padding: 3px; }
  .tabs button {
    position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    font: 600 12.5px var(--sans); padding: 7px 0; border-radius: 8px;
    background: none; color: var(--ink-soft); border: 1px solid transparent; cursor: pointer;
    transition: color .16s, scale .16s cubic-bezier(.2, 0, 0, 1);
  }
  .tabs button.on { color: var(--ink); }
  #panel { flex: 1; overflow-y: auto; padding: 16px 20px 30px; }
  #panel .kicker {
    display: flex; align-items: center; gap: 7px;
    font-size: 10.5px; letter-spacing: .15em; color: var(--ink-soft);
  }
  #panel h2, .hmodal h2 { font: 700 18px/1.4 var(--serif); margin: 6px 0 12px; text-wrap: balance; }
  #panel .titlerow { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
  #panel .titlerow h2 { margin-bottom: 10px; }
  #panel .titlerow .chips { margin: 0; flex-shrink: 0; }
  #panel h3 { font-size: 11px; letter-spacing: .13em; color: var(--ink-soft); margin: 18px 0 7px; }
  #panel p { font: 13.5px/1.75 var(--sans); margin-bottom: 11px; }
  #panel mark { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent-deep); padding: 0 4px; border-radius: 4px; font-weight: 700; }
  #panel ul { list-style: none; padding: 0; }
  #panel li { font-size: 12px; margin: 4px 0; }
  #panel li.src { display: flex; align-items: baseline; gap: 6px; }
  #panel li.src code, #panel .src code { word-break: break-all; }
  #panel code { font: 11.5px var(--mono); background: var(--surface); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
  #panel .src { cursor: pointer; }
  #panel .src:hover code { border-color: var(--accent); color: var(--accent-deep); }
  #panel .steps li.done { color: var(--ink-soft); }
  #panel .steps li.now { color: var(--accent-deep); font-weight: 700; }
  #panel .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0 6px; }
  #panel .chip {
    font: 600 11px var(--sans); background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 3px 9px; cursor: pointer;
  }
  #panel .chip:hover { border-color: var(--accent); color: var(--accent-deep); }
  #panel .chip.hchip {
    background: color-mix(in srgb, var(--warn) 7%, transparent);
    border-color: color-mix(in srgb, var(--warn) 28%, transparent); color: var(--warn);
  }
  #panel .chip.hchip:hover { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
  #panel .dimtext { color: var(--ink-soft); font-size: 12px; }
  #panel h3 + .dimtext { margin: -4px 0 6px; font-size: 11px; line-height: 1.5; }
  #panel .flist.collapsed li:nth-child(n+9) { display: none; }
  #panel li.fi { display: flex; align-items: baseline; gap: 6px; }
  #panel li.fi .loc {
    position: relative; flex-shrink: 0; padding-bottom: 5px; width: 46px;
    font: 11px var(--mono); color: var(--ink-soft); text-align: right; font-variant-numeric: tabular-nums;
  }
  /* 行数下的条：相对本清单最大值，扫一眼就知道哪个重。只有成组对比时才画（.bar） */
  #panel li.fi .loc.bar { padding-bottom: 5px; }
  #panel li.fi .loc.bar::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: 1px; height: 3px; border-radius: 2px;
    background: color-mix(in srgb, var(--ink) 7%, transparent);
  }
  #panel li.fi .loc i {
    position: absolute; right: 0; bottom: 1px; height: 3px; border-radius: 2px;
    background: color-mix(in srgb, var(--accent) 55%, transparent);
  }
  #panel li.fi.mod { cursor: pointer; padding: 3px 7px; margin: 0 -7px; border-radius: 8px; transition: background .15s; }
  #panel li.fi.mod:hover { background: var(--surface); }
  #panel li.fi.mod .mn { font-size: 12.5px; }
  #panel li.fi > :nth-child(2) { flex: 1; min-width: 0; }
  #panel li.fi .sub { font-size: 10.5px; color: var(--ink-soft); flex-shrink: 0; margin-right: 9px; }
  #panel .steps li {
    display: flex; align-items: baseline; gap: 8px;
    padding: 5px 8px; margin: 1px -8px; border-radius: 8px;
    cursor: pointer; transition: background .15s;
  }
  #panel .steps li:hover { background: var(--surface); color: var(--accent-deep); }
  #panel .steps li .no {
    font: 700 10.5px var(--mono); color: var(--ink-soft); min-width: 15px;
    font-variant-numeric: tabular-nums; flex-shrink: 0;
  }
  #panel .steps li.now .no, #panel .steps li:hover .no { color: var(--accent-deep); }
  #panel .statrow { display: flex; gap: 7px; margin: 5px 0 9px; }
  #panel .sv {
    flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 11px; font: 700 15px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums;
  }
  #panel .sv em { display: block; font: 400 10.5px var(--sans); font-style: normal; color: var(--ink-soft); margin-top: 1px; }
  #panel .morebtn {
    font: 600 11.5px var(--sans); background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 11px; cursor: pointer; color: var(--ink-soft); margin-top: 3px;
  }
  #panel .morebtn:hover { border-color: var(--accent); color: var(--accent-deep); }
  #panel .md-body h1 { font: 700 15px/1.5 var(--serif); margin: 16px 0 8px; }
  #panel .md-body h2 { font: 700 13px/1.5 var(--sans); letter-spacing: .01em; margin: 20px 0 8px; }
  #panel .md-body h3, #panel .md-body h4 { font: 700 12px var(--sans); letter-spacing: 0; color: var(--ink); margin: 12px 0 6px; }
  #panel .md-body pre { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; margin: 0 0 11px; }
  #panel .md-body pre code { border: none; background: none; padding: 0; font-size: 11px; line-height: 1.6; display: block; }
  #panel .md-body ul { list-style: disc; padding-left: 18px; margin-bottom: 11px; }
  #panel .md-body ol { padding-left: 18px; margin-bottom: 11px; }
  #panel .md-body li { font: 12.5px/1.7 var(--sans); margin: 3px 0; }
  #panel .md-body table { border-collapse: collapse; margin: 0 0 12px; width: 100%; }
  #panel .md-body th, #panel .md-body td { border: 1px solid var(--line); padding: 4px 8px; font-size: 11.5px; text-align: left; }
  #panel .md-body th { background: var(--surface); font-size: 10.5px; letter-spacing: .05em; color: var(--ink-soft); }
  #panel .md-body tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 55%, transparent); }
  #panel .md-body li::marker { color: var(--accent); }
  .vitals {
    display: flex; gap: 14px; align-items: center; margin: 2px 0 16px;
    background: color-mix(in srgb, var(--hc, var(--ink)) 8%, var(--card));
    border: 1px solid color-mix(in srgb, var(--hc, var(--ink)) 22%, transparent);
    border-radius: 14px; padding: 14px;
  }
  .gauge { position: relative; width: 84px; height: 84px; flex-shrink: 0; }
  .gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .gauge circle { fill: none; stroke-width: 8; }
  .gauge .gbg { stroke: color-mix(in srgb, currentColor 16%, transparent); }
  .gauge .gfg { stroke: currentColor; stroke-linecap: round; transition: stroke-dashoffset .7s cubic-bezier(.16, 1, .3, 1); }
  .gscore { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 22px var(--mono); color: var(--ink); }
  .gscore span { font-size: 10px; color: var(--ink-soft); margin: 9px 0 0 1px; }
  .vmeta { flex: 1; min-width: 0; }
  .vgrade { font: 700 15px var(--sans); }
  .vadvice { margin: 2px 0 9px; }
  .vadvice div { font-size: 11px; line-height: 1.6; color: var(--ink-soft); }
  .vadvice b { font-weight: 700; }
  .vstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .vstat { background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 5px 3px; text-align: center; cursor: pointer; transition: border-color .15s, scale .16s cubic-bezier(.2, 0, 0, 1); }
  .vstat:hover { border-color: var(--accent); }
  .vstat .vv { font: 700 14px var(--mono); color: var(--ink-soft); }
  .vstat .vv em { font: 600 9.5px var(--sans); font-style: normal; opacity: .85; }
  .vstat .vk { font-size: 10px; color: var(--ink-soft); margin-top: 1px; }
  .hmodal .md-body { font: 12.5px/1.75 var(--sans); }
  .hmodal .md-body h2 { font: 700 13px/1.5 var(--sans); margin: 20px 0 8px; }
  .hmodal .md-body h3 { font: 700 12px var(--sans); margin: 14px 0 6px; }
  .hmodal .md-body p, .hmodal .md-body li { font-size: 12.5px; }
  .hmodal .md-body ul { list-style: disc; padding-left: 18px; margin-bottom: 11px; }
  .hmodal .md-body li { margin: 3px 0; }
  .hmodal .md-body li::marker { color: var(--accent); }
  .hmodal .md-body code { font: 11.5px var(--mono); background: var(--surface); border: 1px solid var(--line); padding: 1px 6px; border-radius: 6px; }
  .hmodal .md-body table { border-collapse: collapse; width: 100%; margin: 0 0 12px; }
  .hmodal .md-body th, .hmodal .md-body td { border: 1px solid var(--line); padding: 5px 9px; font-size: 11.5px; text-align: left; }
  .hmodal .md-body th { background: var(--surface); font-size: 10.5px; letter-spacing: .05em; color: var(--ink-soft); }
  .hmodal .md-body tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface) 55%, transparent); }
  .dt { transition: opacity .18s; }
  .dt.dim { opacity: .13; }
  @media (prefers-reduced-motion: reduce) {
    .gauge .gfg { transition: none; }
    dialog#healthDlg[open] .hmodal { animation: none; }
  }
  #panel .md-body blockquote { border-left: 3px solid var(--accent); padding: 2px 10px; color: var(--ink-soft); margin: 0 0 11px; }
  #panel .md-body a { color: var(--accent-deep); }
  #panel .md-body hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  #panel .wl { cursor: pointer; text-decoration: underline dotted; }
  .b, .lk { transition: opacity .18s, transform .2s ease; cursor: pointer; }
  .dfloor { cursor: pointer; }
  .dfloor polygon { transition: fill .18s, stroke-width .18s; }
  .dfloor.sel polygon { stroke-dasharray: none; stroke-width: 2.4; }
  nav .grp.sel { outline: 1.5px solid currentColor; outline-offset: -1.5px; }
  .hbadge { cursor: pointer; }
  .hbadge .ring { transition: r .15s ease-out; }
  .hbadge:hover .ring { r: 8.5; }
  .b.dim, .lk.dim { opacity: .13; }
  /* 聚焦时结构边要真的亮起来：细虚线本身就淡，只靠不压暗看不出区别 */
  #svg g.lk.hi > path:first-child { opacity: 1; stroke-width: 1.7; stroke: var(--ink); }
  #svg g.b:not([data-plate]):hover { transform: translateY(-3px); }
  #svg g.b.hop { animation: hop .5s ease; }
  @keyframes hop { 30% { transform: translateY(-7px); } 60% { transform: translateY(-1px); } }
  #selring { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) {
    #selring, #svg g.b.hop { animation: none; }
    #svg g.b:not([data-plate]):hover { transform: none; }
    nav, aside, .handle, .isw .ic, .seg-ind { transition: none; }
  }
  /* 窄屏：两栏转为固定抽屉，把手停靠屏幕边缘 */
  @media (max-width: 1080px) {
    nav {
      position: fixed; left: 0; top: 0; bottom: 0; z-index: 20; margin: 0;
      width: min(78vw, 320px); border-radius: 0 16px 16px 0;
      box-shadow: 10px 0 34px rgba(20, 20, 19, .18);
      transition: transform .26s cubic-bezier(.2, 0, 0, 1);
    }
    body.nav-off nav { margin: 0; opacity: 1; transform: translateX(calc(-100% - 40px)); }
    #handleNav { left: calc(min(78vw, 320px) - 1px); }
    body.nav-off #handleNav { left: 0; }
  }
  @media (max-width: 820px) {
    #asideResize { display: none; }
    aside {
      position: fixed; right: 0; top: 0; bottom: 0; z-index: 20; margin: 0;
      width: min(88vw, 360px); border-radius: 16px 0 0 16px;
      box-shadow: -10px 0 34px rgba(20, 20, 19, .18);
      transition: transform .26s cubic-bezier(.2, 0, 0, 1);
    }
    body.aside-off aside { margin: 0; opacity: 1; transform: translateX(calc(100% + 40px)); }
    #handleAside { right: calc(min(88vw, 360px) - 1px); }
    body.aside-off #handleAside { right: 0; }
  }
  @media (max-width: 700px) {
    .statbar { display: none; }
    header { gap: 6px; }
    header button.compact .lb { display: none; }
    header button.compact { padding: 7px 9px; }
    .vstats { grid-template-columns: repeat(2, 1fr); }
    .hmodal { padding: 16px 16px 22px; }
  }
</style>
</head>

function clipToRect(pOut, pIn, n, m = .12) {

  if (by !== ay) { cand.push((y0 - ay) / (by - ay), (y1 - ay) / (by - ay)); }

    if (k <= 0 || k > 1) continue;

    if (px >= x0 - 1e-6 && px <= x1 + 1e-6 && py >= y0 - 1e-6 && py <= y1 + 1e-6) t = Math.min(t, k);

  pts[pts.length - 1] = clipToRect(pts[pts.length - 2], pts[pts.length - 1], N[b]);

/* ── 流程追踪：按「拍」推进而不是按步——标了 par 的步骤与上一步同时发生 ── */
let auto = null, beatIdx = -1, playPulses = [];
const beatsOf = (steps = []) => steps.reduce((out, s, i) => {
  if (i > 0 && s.par) out[out.length - 1].push(i); else out.push([i]);
  return out;
}, []);
const curBeats = () => beatsOf(FLOWS[activeFlow]?.steps);
function clearPulses() { for (const p of playPulses) p.remove(); playPulses = []; }
function addPulse(pathEl, myBeat) {
  const len = pathEl.getTotalLength(), t0 = performance.now(), dur = motionOK ? 340 : 0;
  const pulse = el("path", { d: pathEl.getAttribute("d"), stroke: "#FFFFFF", "stroke-width": 3,
    fill: "none", "stroke-linecap": "round", opacity: .95,
    "stroke-dasharray": `22 ${(len + 22).toFixed(1)}`, "stroke-dashoffset": 22 }, gTag);
  playPulses.push(pulse);
  (function anim(now) {
    const k = dur ? Math.min((now - t0) / dur, 1) : 1;
    pulse.setAttribute("stroke-dashoffset", (22 - k * (len + 22)).toFixed(1));
    if (k < 1 && beatIdx === myBeat) requestAnimationFrame(anim);
  })(t0);
}
function showBeat(k) {
  const F = FLOWS[activeFlow], beats = beatsOf(F?.steps);
  if (!F || k < 0 || k >= beats.length) return;
  beatIdx = k;
  const now = new Set(beats[k]), done = new Set(beats.slice(0, k).flat());
  sel = beats[k][0]; markSel(null); render();
  flowEls.forEach(({ p, glow }, j) => {
    const isNow = now.has(j);
    p.setAttribute("stroke", isNow ? "var(--accent)" : "var(--ink)");
    p.setAttribute("stroke-width", isNow ? 2.6 : done.has(j) ? 2 : 1.6);
    p.setAttribute("marker-end", isNow ? "url(#arrA)" : "url(#arr)");
    p.setAttribute("opacity", isNow || done.has(j) ? 1 : .35);
    glow.setAttribute("opacity", isNow ? .22 : 0);
  });
  const steps = beats[k].map(j => F.steps[j]);
  focusSet(new Set(steps.flatMap(s => [s.from, s.to])));
  for (const s of steps) hopNode(s.to);
  gStreak.style.display = "none";
  clearPulses();
  for (const j of beats[k]) if (flowEls[j]) addPulse(flowEls[j].p, k);
}
const showStep = i => showBeat(curBeats().findIndex(b => b.includes(i)));
function pauseAuto() { if (auto) clearTimeout(auto); auto = null; }
function stopFlowVisual() {
  pauseAuto(); beatIdx = -1; clearPulses();
  gStreak.style.display = "";
  flowEls.forEach(({ p, glow }) => { p.setAttribute("stroke", "var(--ink)");
    p.setAttribute("stroke-width", 1.6); p.setAttribute("marker-end", "url(#arr)");
    p.setAttribute("opacity", 1); glow.setAttribute("opacity", 0); });
}
document.getElementById("btnPlay").onclick = () => {
  if (activeFlow < 0) { activeFlow = 0; syncFlowbar(); }
  stopFlowVisual(); buildEdges(stepsOf(activeFlow)); showBeat(0);
  const total = curBeats().length;
  const tick = () => {
    if (beatIdx + 1 >= total) { auto = null; return; }
    showBeat(beatIdx + 1);
    auto = setTimeout(tick, motionOK ? 620 : 400);
  };
  auto = setTimeout(tick, motionOK ? 620 : 400);
};
document.getElementById("btnStep").onclick = () => {
  if (activeFlow < 0) { activeFlow = 0; syncFlowbar(); buildEdges(stepsOf(0)); }
  pauseAuto(); showBeat((beatIdx + 1) % (curBeats().length || 1));
};

/* ── 取景 / 平移缩放 / 响应式 ── */
const stage = document.getElementById("stage");
function fitHome() {
  const boxes = [gDist.getBBox(), gNode.getBBox(), gPlate.getBBox(), gTag.getBBox()];
  const x = Math.min(...boxes.map(b => b.x)) - 18, y = Math.min(...boxes.map(b => b.y)) - 16;
  return { x, y,
    w: Math.max(...boxes.map(b => b.x + b.width)) + 18 - x,
    h: Math.max(...boxes.map(b => b.y + b.height)) + 16 - y };
}
const HOME = fitHome();
let vb = { ...HOME }, homeView = true;
const applyVB = () => svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
document.getElementById("btnReset").onclick = () => { stopFlowVisual(); select(null); vbT = null; vb = { ...HOME }; homeView = true; applyVB(); };
new ResizeObserver(() => { if (homeView) applyVB(); }).observe(stage);
let pan = null, moved = false, pinch = null;
const touches = new Map();
stage.addEventListener("pointerdown", e => {
  if (e.target.closest(".b") || e.target.closest(".lk") || e.target.closest("#flowbar")) return;
  if (vbT) { vb = { ...vbT }; vbT = null; applyVB(); }   // 手势接管前先把追赶中的缩放落定
  touches.set(e.pointerId, [e.clientX, e.clientY]);
  stage.setPointerCapture(e.pointerId);
  if (touches.size === 2) {   // 双指捿合：以按下时取景为基准缩放
    const [a, b] = [...touches.values()];
    pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, vb: { ...vb } };
    pan = null; moved = true;
    stage.classList.remove("panning");
    return;
  }
  // 记住起手落在哪块地板：指针捕获后 pointerup/click 的 target 都会被重定向到画布，当场判不出来
  pan = { px: e.clientX, py: e.clientY, x: vb.x, y: vb.y, floor: e.target.closest(".dfloor")?.dataset.d || null };
  moved = false;
  stage.classList.add("panning");
});
stage.addEventListener("pointermove", e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && touches.size >= 2) {
    const [a, b] = [...touches.values()];
    const k = pinch.d / (Math.hypot(a[0] - b[0], a[1] - b[1]) || 1);
    const r = svg.getBoundingClientRect();
    const mx = pinch.vb.x + ((a[0] + b[0]) / 2 - r.left) / r.width * pinch.vb.w;
    const my = pinch.vb.y + ((a[1] + b[1]) / 2 - r.top) / r.height * pinch.vb.h;
    vb = { x: mx - (mx - pinch.vb.x) * k, y: my - (my - pinch.vb.y) * k, w: pinch.vb.w * k, h: pinch.vb.h * k };
    homeView = false; applyVB();
    return;
  }
  if (!pan) return;
  if (Math.hypot(e.clientX - pan.px, e.clientY - pan.py) > 3) moved = true;
  const k = vb.w / stage.clientWidth;
  vb.x = pan.x - (e.clientX - pan.px) * k; vb.y = pan.y - (e.clientY - pan.py) * k;
  if (moved) { homeView = false; applyVB(); }
});
const endPointer = e => {
  touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
};
stage.addEventListener("pointercancel", endPointer);
stage.addEventListener("pointerup", e => {
  endPointer(e);
  const wasPan = pan; pan = null; stage.classList.remove("panning");
  if (e.pointerType !== "mouse") hideEdgeTag();   // 触屏无 mouseleave，气泡会滞留
  // 未拖动的单击：落在地板上选中分区，落在真空白处取消选中
  if (wasPan && !moved) select(wasPan.floor ? { district: wasPan.floor } : null);
});
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY > 0 ? 1.12 : 1 / 1.12;
  const b = vbT || vb;   // 连续滚轮在目标上复利，锚点映射才不漂
  const r = svg.getBoundingClientRect();
  const mx = b.x + (e.clientX - r.left) / r.width * b.w;
  const my = b.y + (e.clientY - r.top) / r.height * b.h;
  const t = { x: mx - (mx - b.x) * k, y: my - (my - b.y) * k, w: b.w * k, h: b.h * k };
  homeView = false;
  if (motionOK) vbT = t; else { vb = t; applyVB(); }
}, { passive: false });

applyVB();
render();
</script>
</body>
</html>
